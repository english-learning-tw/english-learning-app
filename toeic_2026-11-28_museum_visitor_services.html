<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/28]主題博物館與觀光導覽｜多益高頻英文20單字</title><meta name="theme-color" content="#176780"><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f9;color:#173849;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#183e5c,#178291);color:white;padding:24px 15px}.wrap{max-width:1080px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.45}.back{color:white;border:1px solid #c9e8ed;padding:10px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}main{max-width:1100px;padding:16px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:10px}input{min-width:180px;flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #b4ced9}button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px}.stop{background:#e8f2f5;color:#145b75;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;background:white;border:1px solid #d8e5ea;border-radius:16px}.head{display:flex;gap:12px;align-items:center}.symbol{background:#e8f4f7;padding:12px;border-radius:12px;font-size:27px}.word{color:#17687f;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#577382}.meaning{font-weight:700;margin:13px 0}.example{background:#f3f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#526c77;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{color:white;background:#19718b;padding:8px 4px;font-size:14px;font-weight:700}.slow{background:#e6f2f7;color:#165c73;border:1px solid #bed8e0}.status{color:#4c6b78;font-size:14px}footer{text-align:center;color:#617b86;font-size:12px;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/28]主題博物館與觀光導覽｜多益高頻英文20單字</h1><p>🏛️ 20 個職場單字｜🇺🇸 美式 IPA｜🔊 單字與例句｜🐢 慢速跟讀</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋英文、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite">共 20 個單字</p><section id="cards" class="grid"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材使用原創 TOEIC 職場情境例句，並非 ETS 官方頻率排名。發音使用瀏覽器 Web Speech API，優先選用裝置可用的美式英語聲音。</footer></main><script>"use strict";const DATA=[{"en":"museum","ipa":"/mjuˈziəm/","zh":"博物館","icon":"🏛️","ex":"The museum opens at ten on weekdays.","tr":"博物館平日上午十點開館。"},{"en":"gallery","ipa":"/ˈɡæləri/","zh":"藝廊；展覽室","icon":"🏛️","ex":"The gallery is closed for a private event.","tr":"展覽室因私人活動而關閉。"},{"en":"exhibit","ipa":"/ɪɡˈzɪbɪt/","zh":"展品；展覽","icon":"🏛️","ex":"The new exhibit opens next Friday.","tr":"新展覽將於下週五開幕。"},{"en":"curator","ipa":"/kjʊˈreɪtər/","zh":"策展人","icon":"🏛️","ex":"The curator will introduce the collection.","tr":"策展人將介紹館藏。"},{"en":"collection","ipa":"/kəˈlɛkʃən/","zh":"收藏品；館藏","icon":"🏛️","ex":"The collection includes works by local artists.","tr":"館藏包含當地藝術家的作品。"},{"en":"artifact","ipa":"/ˈɑrtəˌfækt/","zh":"文物","icon":"🏛️","ex":"Visitors must not touch the artifacts.","tr":"訪客不得觸摸文物。"},{"en":"sculpture","ipa":"/ˈskʌlptʃər/","zh":"雕塑","icon":"🏛️","ex":"The sculpture stands near the main entrance.","tr":"雕塑位於主要入口附近。"},{"en":"portrait","ipa":"/ˈpɔrtrət/","zh":"肖像畫","icon":"🏛️","ex":"The portrait is on loan from another museum.","tr":"這幅肖像畫由另一家博物館借展。"},{"en":"guided tour","ipa":"/ˈɡaɪdɪd tʊr/","zh":"導覽行程","icon":"🏛️","ex":"A guided tour is included in the ticket price.","tr":"票價包含導覽行程。"},{"en":"landmark","ipa":"/ˈlændˌmɑrk/","zh":"地標","icon":"🏛️","ex":"The bus stops near a historic landmark.","tr":"公車停靠在歷史地標附近。"},{"en":"heritage","ipa":"/ˈhɛrətɪdʒ/","zh":"文化遺產","icon":"🏛️","ex":"The center promotes local cultural heritage.","tr":"中心推廣當地文化遺產。"},{"en":"souvenir","ipa":"/ˌsuvəˈnɪr/","zh":"紀念品","icon":"🏛️","ex":"Souvenirs are sold near the exit.","tr":"出口附近販售紀念品。"},{"en":"audio guide","ipa":"/ˈɔdioʊ ɡaɪd/","zh":"語音導覽","icon":"🏛️","ex":"An audio guide is available in English.","tr":"館方提供英文語音導覽。"},{"en":"visitor","ipa":"/ˈvɪzətər/","zh":"訪客","icon":"🏛️","ex":"Each visitor must show a valid ticket.","tr":"每位訪客都必須出示有效門票。"},{"en":"attraction","ipa":"/əˈtrækʃən/","zh":"觀光景點","icon":"🏛️","ex":"The garden is a popular tourist attraction.","tr":"這座花園是熱門觀光景點。"},{"en":"scenic","ipa":"/ˈsinɪk/","zh":"風景優美的","icon":"🏛️","ex":"The tour follows a scenic route along the river.","tr":"導覽沿著風景優美的河岸路線進行。"},{"en":"preserve","ipa":"/prɪˈzɜrv/","zh":"保存；保護","icon":"🏛️","ex":"The museum works to preserve historic documents.","tr":"博物館致力保存歷史文件。"},{"en":"restoration","ipa":"/ˌrɛstəˈreɪʃən/","zh":"修復","icon":"🏛️","ex":"The painting is undergoing restoration.","tr":"這幅畫正在修復中。"},{"en":"membership","ipa":"/ˈmɛmbərˌʃɪp/","zh":"會員資格","icon":"🏛️","ex":"Annual membership includes unlimited visits.","tr":"年度會員資格包含不限次數的參觀。"},{"en":"opening hours","ipa":"/ˈoʊpənɪŋ ˈaʊərz/","zh":"開放時間","icon":"🏛️","ex":"Please check the opening hours before your visit.","tr":"參觀前請確認開放時間。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis||null;let voices=[];function load(){if(s)voices=s.getVoices()||[]}if(s){load();s.addEventListener?.("voiceschanged",load)}function speak(text,slow){if(!s||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援朗讀，請改用 Safari";return}s.cancel();load();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在慢速朗讀…":"正在朗讀…"};u.onend=()=>{$("status").textContent="朗讀完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="朗讀失敗，請確認音量或使用 Safari"};s.speak(u)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){const q=$("search").value.trim().toLowerCase(),found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of found){const c=el("article","card"),h=el("div","head"),inf=el("div"),ex=el("div","example"),b=el("div","buttons");inf.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","symbol",x.icon),inf);ex.append(el("div","",x.ex),el("div","tr",x.tr));b.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,b);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{s?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>s?.cancel());render();</script></body></html>
