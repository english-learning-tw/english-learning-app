<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16667e"><title>[11/23]主題商務簡報與資料分析｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fa;color:#19384a;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#173d60,#167a8c);color:white;padding:22px 15px}.wrap{max-width:1050px;margin:auto}h1{font-size:clamp(22px,5vw,31px);line-height:1.4}.back{color:white;display:inline-block;padding:10px;border:1px solid #bbdfe8;border-radius:10px;text-decoration:none}main{max-width:1080px;padding:15px;margin:auto}.bar{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:190px;border:1px solid #a9c5d3;border-radius:11px;padding:12px;font-size:16px}button{font:inherit;min-height:46px;cursor:pointer;touch-action:manipulation;border-radius:10px;border:0}.stop{background:#e1eff4;color:#145771;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;border:1px solid #d6e5ed;border-radius:16px;background:white}.head{display:flex;align-items:center;gap:13px}.emoji{font-size:30px;background:#e8f5f7;border-radius:12px;padding:11px}.word{font-size:22px;color:#146b84;font-weight:800}.ipa{font-size:14px;color:#587581}.meaning{font-weight:700;margin:12px 0}.example{background:#f3f8fa;border-radius:10px;padding:12px}.tr{color:#516e7a;font-size:14px;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{background:#176e89;color:white;font-size:14px;font-weight:700;padding:8px 3px}.slow{background:#e5f2f7;color:#165a74;border:1px solid #bad7df}.status{color:#4b6d7b;font-size:14px}footer{color:#607f8a;font-size:12px;text-align:center;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/23]主題商務簡報與資料分析｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA｜🔊 單字與例句發音｜🐢 慢速跟讀｜📱 iPhone 適用</p></div></header><main><div class="bar"><input id="search" type="search" aria-label="搜尋英文、中文或例句" placeholder="搜尋英文、中文或例句…" autocomplete="off"><button class="stop" id="stop">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite"></p><section class="grid" id="cards"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材為 TOEIC 常見情境原創例句，非 ETS 官方詞頻榜。語音採用瀏覽器內建 Web Speech API，優先選用 en-US 聲音；實際音色依裝置而異。</footer></main><script>"use strict";const DATA=[{"en":"presentation","ipa":"/ˌprezənˈteɪʃən/","zh":"簡報；發表","icon":"🎤","ex":"The manager will give a presentation on quarterly sales at ten thirty.","tr":"經理將在十點三十分進行季度銷售簡報。"},{"en":"chart","ipa":"/tʃɑːrt/","zh":"圖表","icon":"📊","ex":"The chart compares revenue from three regional offices.","tr":"這張圖表比較三個區域辦公室的營收。"},{"en":"graph","ipa":"/ɡræf/","zh":"統計圖；曲線圖","icon":"📈","ex":"The graph shows a steady increase in online orders.","tr":"這張曲線圖顯示線上訂單持續增加。"},{"en":"statistics","ipa":"/stəˈtɪstɪks/","zh":"統計數據","icon":"🧮","ex":"The statistics were collected through an annual employee survey.","tr":"這些統計數據來自年度員工問卷調查。"},{"en":"trend","ipa":"/trend/","zh":"趨勢","icon":"📉","ex":"The report identifies a downward trend in operating costs.","tr":"報告指出營運成本呈現下降趨勢。"},{"en":"percentage","ipa":"/pərˈsentɪdʒ/","zh":"百分比","icon":"💯","ex":"The percentage of returned items has fallen since January.","tr":"退貨商品的百分比自一月以來已下降。"},{"en":"comparison","ipa":"/kəmˈperəsən/","zh":"比較","icon":"⚖️","ex":"A comparison of the two proposals is included in the report.","tr":"報告中包含兩份提案的比較。"},{"en":"overview","ipa":"/ˈoʊvərˌvjuː/","zh":"概述；總覽","icon":"🗂️","ex":"The director requested a brief overview of the new market.","tr":"主管要求提供新市場的簡要概述。"},{"en":"summary","ipa":"/ˈsʌməri/","zh":"摘要","icon":"📝","ex":"Please read the summary before tomorrow's briefing.","tr":"請在明天的簡報會前閱讀摘要。"},{"en":"finding","ipa":"/ˈfaɪndɪŋ/","zh":"調查結果；研究發現","icon":"🔍","ex":"One key finding was that customers prefer faster delivery.","tr":"一項重要發現是顧客偏好更快速的配送。"},{"en":"conclusion","ipa":"/kənˈkluːʒən/","zh":"結論","icon":"✅","ex":"The report's conclusion will be discussed at the board meeting.","tr":"報告的結論將在董事會議中討論。"},{"en":"recommendation","ipa":"/ˌrekəmenˈdeɪʃən/","zh":"建議；提議","icon":"💡","ex":"The consultant made a recommendation to extend the trial period.","tr":"顧問提出延長試行期間的建議。"},{"en":"outline","ipa":"/ˈaʊtlaɪn/","zh":"大綱；綱要","icon":"📑","ex":"Please send me the outline of your presentation by noon.","tr":"請在中午前把簡報大綱寄給我。"},{"en":"highlight","ipa":"/ˈhaɪlaɪt/","zh":"強調；凸顯","icon":"🖍️","ex":"The speaker will highlight the main differences between the options.","tr":"講者將強調各選項之間的主要差異。"},{"en":"illustrate","ipa":"/ˈɪləˌstreɪt/","zh":"說明；以圖示解釋","icon":"🖼️","ex":"These examples illustrate how the new process saves time.","tr":"這些例子說明新流程如何節省時間。"},{"en":"estimate","ipa":"/ˈestəmət/","zh":"估價；估計值（名詞）","icon":"🧾","ex":"The estimate for the installation is attached to the report.","tr":"安裝工程的估價單附在報告中。"},{"en":"interpret","ipa":"/ɪnˈtɜːrprət/","zh":"解讀；詮釋","icon":"🧠","ex":"The analyst will interpret the latest customer satisfaction data.","tr":"分析師將解讀最新的顧客滿意度資料。"},{"en":"fluctuation","ipa":"/ˌflʌktʃuˈeɪʃən/","zh":"波動；起伏","icon":"〰️","ex":"The fluctuation in monthly sales is shown in the graph.","tr":"每月銷售額的波動呈現在圖表上。"},{"en":"benchmark","ipa":"/ˈbentʃmɑːrk/","zh":"比較基準；標竿","icon":"🏁","ex":"We use last year's results as a benchmark for performance.","tr":"我們以去年的成果作為績效比較基準。"},{"en":"indicator","ipa":"/ˈɪndəˌkeɪtər/","zh":"指標；徵兆","icon":"🚦","ex":"Customer retention is an important indicator of service quality.","tr":"顧客留存率是服務品質的重要指標。"}];const $=id=>document.getElementById(id);const synth=window.speechSynthesis||null;let voices=[];function refresh(){if(synth)voices=synth.getVoices()||[]}if(synth){refresh();synth.addEventListener?.("voiceschanged",refresh)}function speak(t,slow){if(!synth||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="瀏覽器不支援語音，請用 Safari";return} synth.cancel();refresh();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(v=>v.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在播放慢速英文":"正在播放英文"};u.onend=()=>{$("status").textContent="播放完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="播放失敗，請改用 Safari"};synth.speak(u)}function el(tag,cls,t){const n=document.createElement(tag);if(cls)n.className=cls;if(t!==undefined)n.textContent=t;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.trim().toLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of items){const c=el("article","card"),h=el("div","head"),info=el("div"),ex=el("div","example"),bs=el("div","buttons");info.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","emoji",x.icon),info);ex.append(el("div","",x.ex),el("div","tr",x.tr));bs.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,bs);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=items.length>0;$("status").textContent="顯示 "+items.length+" / "+DATA.length+" 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{synth?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>synth?.cancel());render();</script></body></html>
