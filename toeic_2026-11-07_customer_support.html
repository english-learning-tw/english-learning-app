<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#165270">
<meta name="description" content="11/07 客服與售後問題處理，多益職場英文20單字：美式IPA、中英文例句、正常及慢速發音、即時搜尋。">
<title>[11/07]主題客服與售後問題處理｜多益高頻英文20單字</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#173344;background:#f2f7fa}*{box-sizing:border-box}body{margin:0;padding-bottom:env(safe-area-inset-bottom);line-height:1.55}header{background:linear-gradient(120deg,#123f5b,#157c90);color:#fff;padding:22px 16px 26px}.wrap{max-width:1080px;margin:0 auto}h1{font-size:clamp(22px,5vw,31px);line-height:1.4;margin:12px 0}header p{font-size:14px;color:#e2f3f8}.back{display:inline-flex;min-height:44px;align-items:center;color:#fff;border:1px solid #ffffff99;border-radius:11px;padding:8px 12px;font-weight:700;text-decoration:none}main{padding:18px 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:white;border:1px solid #d9e6eb;border-radius:16px;padding:12px}.search{flex:1;min-width:180px;min-height:48px;border:1px solid #b1cad4;border-radius:10px;padding:10px 12px;font-size:16px}.stop{border:1px solid #bbd2dc;background:#e8f2f6;color:#14546e;border-radius:10px;min-height:48px;padding:10px 12px;font-weight:700}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f9ba34;outline-offset:2px}.status{font-size:14px;color:#486a7b;margin:12px 3px 15px;min-height:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,305px),1fr));gap:14px}.card{background:white;border:1px solid #dce8ed;border-radius:17px;padding:16px;box-shadow:0 5px 20px #13354b08}.head{display:flex;gap:13px;align-items:center}.emoji{width:56px;height:56px;border-radius:13px;background:#eaf7f7;display:grid;place-items:center;font-size:29px;flex:none}.word{font-size:21px;line-height:1.35;font-weight:800;color:#145d7b;overflow-wrap:anywhere}.ipa{font-size:14px;color:#5a7886;margin-top:3px}.meaning{font-weight:750;margin:13px 0 10px}.example{background:#f5f9fb;border-radius:11px;padding:12px;border:1px solid #edf1f4}.en{font-size:15px;line-height:1.65}.tr{font-size:14px;color:#516f7c;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.audio{border:none;border-radius:10px;background:#196e8b;color:white;font-weight:700;font-size:14px;min-height:46px;padding:9px 5px}.audio.slow{background:#e9f3f7;color:#1a6680;border:1px solid #bdd6df}footer{padding:26px 5px;color:#647f8e;text-align:center;font-size:12px}.empty{text-align:center;margin:35px;color:#587687}@media(max-width:355px){.card{padding:13px}.audio{font-size:13px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/07]主題客服與售後問題處理｜多益高頻英文20單字</h1><p>🎧 客戶服務 × 20 單字｜🔊 美式英語｜🐢 慢速跟讀｜📱 iPhone 友善</p></div></header>
<main class="wrap"><section class="toolbar" aria-label="教材搜尋"><input id="search" type="search" class="search" placeholder="搜尋英文、中文或例句…" aria-label="搜尋單字與例句" autocomplete="off"><button type="button" id="stop" class="stop">⏹ 停止發音</button></section><p class="status" id="status" role="status" aria-live="polite">共20個單字。</p><section id="cards" class="grid" aria-label="多益客服與售後問題處理英文單字"></section><p id="empty" class="empty" hidden>找不到符合的單字，請更換搜尋條件。</p><footer>此為原創職場情境例句，並非多益官方單字頻率排名。發音使用裝置 Web Speech API，音色依瀏覽器提供的 en-US 語音而異。</footer></main>
<script>
"use strict";
const DATA=[{"en":"complaint","ipa":"/kəmˈpleɪnt/","zh":"客訴；抱怨","icon":"🗣️","ex":"The customer filed a complaint about the delayed installation.","tr":"客戶針對安裝延誤提出客訴。"},{"en":"defective","ipa":"/dɪˈfektɪv/","zh":"有瑕疵的；故障的","icon":"⚠️","ex":"Customers may return defective items within thirty days.","tr":"顧客可在三十天內退回有瑕疵的商品。"},{"en":"replacement","ipa":"/rɪˈpleɪsmənt/","zh":"替換品；更換","icon":"🔄","ex":"We will send a replacement at no additional charge.","tr":"我們會免費寄送替換品。"},{"en":"troubleshoot","ipa":"/ˈtrʌbəlʃuːt/","zh":"排除故障","icon":"🛠️","ex":"A technician will help you troubleshoot the connection problem.","tr":"技術人員會協助您排除連線問題。"},{"en":"malfunction","ipa":"/mælˈfʌŋkʃən/","zh":"故障；運作失常","icon":"🚨","ex":"Please report any equipment malfunction to the service desk.","tr":"若設備出現任何故障，請向服務櫃檯通報。"},{"en":"technician","ipa":"/tekˈnɪʃən/","zh":"技術人員","icon":"👨‍🔧","ex":"Our technician is available to inspect the printer this afternoon.","tr":"我們的技術人員今天下午可以檢查印表機。"},{"en":"resolution","ipa":"/ˌrezəˈluːʃən/","zh":"解決方案","icon":"✅","ex":"The support team offered a resolution within one business day.","tr":"客服團隊在一個工作天內提出解決方案。"},{"en":"dissatisfied","ipa":"/dɪsˈsætɪsfaɪd/","zh":"不滿意的","icon":"😟","ex":"Customers who are dissatisfied with the service can request a review.","tr":"對服務不滿意的顧客可以要求重新審查。"},{"en":"courtesy","ipa":"/ˈkɜːrtəsi/","zh":"禮貌；善意","icon":"🤝","ex":"As a courtesy, the hotel waived the service fee.","tr":"飯店出於善意免收服務費。"},{"en":"inconvenience","ipa":"/ˌɪnkənˈviːniəns/","zh":"不便","icon":"⏳","ex":"We apologize for any inconvenience caused by the system outage.","tr":"系統中斷造成不便，我們深感抱歉。"},{"en":"escalate","ipa":"/ˈeskəleɪt/","zh":"升級處理；轉交上級","icon":"📈","ex":"Please escalate unresolved billing issues to the supervisor.","tr":"請將尚未解決的帳務問題轉交主管處理。"},{"en":"assistance","ipa":"/əˈsɪstəns/","zh":"協助；支援","icon":"🙋","ex":"For assistance with your account, contact our support center.","tr":"如需帳戶協助，請聯絡客服中心。"},{"en":"clarification","ipa":"/ˌklerəfɪˈkeɪʃən/","zh":"釐清；進一步說明","icon":"🔎","ex":"The customer requested clarification about the return policy.","tr":"顧客要求進一步說明退貨政策。"},{"en":"response","ipa":"/rɪˈspɑːns/","zh":"回覆；回應","icon":"💬","ex":"You should receive a response to your inquiry by tomorrow.","tr":"您應該會在明天前收到詢問的回覆。"},{"en":"satisfaction","ipa":"/ˌsætɪsˈfækʃən/","zh":"滿意度；滿足","icon":"⭐","ex":"Customer satisfaction is measured through a monthly survey.","tr":"顧客滿意度透過每月問卷調查衡量。"},{"en":"repair","ipa":"/rɪˈper/","zh":"修理；維修","icon":"🔧","ex":"The repair is covered by the manufacturer's service agreement.","tr":"這次維修在製造商的服務合約保障範圍內。"},{"en":"verify","ipa":"/ˈverɪfaɪ/","zh":"確認；核實","icon":"🔐","ex":"Please verify your order number before requesting support.","tr":"申請客服支援前，請確認您的訂單編號。"},{"en":"callback","ipa":"/ˈkɔːlbæk/","zh":"回電","icon":"📞","ex":"You can request a callback instead of waiting on hold.","tr":"您可以要求客服回電，而不必在線上等候。"},{"en":"claim","ipa":"/kleɪm/","zh":"索賠；申請理賠","icon":"📑","ex":"The customer filed a claim for the damaged equipment.","tr":"顧客針對損壞的設備提出索賠。"},{"en":"apologize","ipa":"/əˈpɑːlədʒaɪz/","zh":"道歉","icon":"🙏","ex":"We sincerely apologize for shipping the wrong item.","tr":"我們誠摯地為寄錯商品道歉。"}];
const el=id=>document.getElementById(id),synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[];
function refreshVoices(){if(synth)voices=synth.getVoices();}
if(synth){refreshVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",refreshVoices);}
function speak(text,slow){
 if(!synth||typeof SpeechSynthesisUtterance==="undefined"){el("status").textContent="裝置不支援語音功能，請使用 iPhone Safari 或其他支援語音的瀏覽器。";return;}
 synth.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;u.pitch=1;
 const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;
 u.onstart=()=>{el("status").textContent="正在播放"+(slow?"慢速":"正常")+"英文發音…";};
 u.onend=()=>{el("status").textContent="播放完成，可以再次點擊練習。";};
 u.onerror=ev=>{if(ev.error!=="canceled"&&ev.error!=="interrupted")el("status").textContent="語音播放失敗，請檢查裝置音量或改用 Safari。";};
 synth.speak(u);
}
function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;}
function makeButton(label,text,slow){const b=node("button","audio"+(slow?" slow":""),label);b.type="button";b.setAttribute("aria-label",label+"："+text);b.addEventListener("click",()=>speak(text,slow));return b;}
function render(){
 const q=el("search").value.trim().toLocaleLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(t=>t.toLocaleLowerCase().includes(q)));
 const frag=document.createDocumentFragment();
 for(const x of items){const card=node("article","card"),head=node("div","head"),info=node("div");info.append(node("div","word",x.en),node("div","ipa",x.ipa));head.append(node("div","emoji",x.icon),info);const example=node("div","example");example.append(node("div","en",x.ex),node("div","tr",x.tr));const buttons=node("div","actions");buttons.append(makeButton("🔊 單字",x.en,false),makeButton("🐢 單字慢速",x.en,true),makeButton("🔊 例句",x.ex,false),makeButton("🐢 例句慢速",x.ex,true));card.append(head,node("div","meaning",x.zh),example,buttons);frag.append(card);}
 el("cards").replaceChildren(frag);el("empty").hidden=items.length!==0;el("status").textContent="顯示 "+items.length+" / "+DATA.length+" 個單字。";
}
el("search").addEventListener("input",render);el("stop").addEventListener("click",()=>{if(synth)synth.cancel();el("status").textContent="已停止發音。";});render();
</script>
</body></html>
