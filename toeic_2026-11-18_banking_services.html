<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/18]主題銀行服務與企業融資｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7fa;color:#173448;font-family:-apple-system,"PingFang TC",sans-serif}header{background:#176b83;color:white;padding:20px}main{max-width:960px;margin:auto;padding:15px}h1{font-size:clamp(21px,5vw,30px)}a{color:inherit}input{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #aac5d3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}.card{background:white;border-radius:15px;padding:17px;border:1px solid #d7e6ed}.word{font-size:23px;font-weight:800;color:#12677b}.ipa{color:#597482}.zh{font-weight:bold;margin:10px 0}.example{background:#eff6fa;padding:12px;border-radius:10px}.tr{color:#56717e;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:46px;border:0;border-radius:9px;background:#146c86;color:white;font-weight:bold}button.slow{background:#e4f1f5;color:#145c76}.back{display:inline-block;padding:10px;border:1px solid white;border-radius:8px}#status{margin:12px 0;color:#56717e}</style></head><body><header><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/18]主題銀行服務與企業融資｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA　🔊 正常發音　🐢 慢速跟讀</p></header><main><input id="search" type="search" placeholder="搜尋英文、中文、例句"><p id="status"></p><button id="stop">⏹ 停止發音</button><section id="cards" class="grid"></section><p>語音由裝置 Web Speech API 提供，實際發音依系統語音而異。本教材非 ETS 官方字頻排名。</p></main><script>"use strict";const DATA=[{"en":"mortgage","ipa":"/ˈmɔːr.ɡɪdʒ/","zh":"房屋貸款","icon":"📌","ex":"The bank approved the client's mortgage.","tr":"銀行核准了客戶的房屋貸款。"},{"en":"collateral","ipa":"/kəˈlæt̬.ɚ.əl/","zh":"擔保品","icon":"💼","ex":"The lender requested additional collateral.","tr":"貸款機構要求提供額外擔保品。"},{"en":"principal","ipa":"/ˈprɪn.sə.pəl/","zh":"本金","icon":"📋","ex":"The borrower repaid the principal early.","tr":"借款人提前償還本金。"},{"en":"interest rate","ipa":"/ˈɪn.trəst reɪt/","zh":"利率","icon":"🏢","ex":"The interest rate will remain unchanged.","tr":"利率將維持不變。"},{"en":"installment","ipa":"/ɪnˈstɑːl.mənt/","zh":"分期付款金額","icon":"🧾","ex":"The first installment is due in June.","tr":"第一期款項六月到期。"},{"en":"creditworthiness","ipa":"/ˈkred.ɪtˌwɝː.ði.nəs/","zh":"信用可靠程度","icon":"🔎","ex":"The bank assessed the firm's creditworthiness.","tr":"銀行評估了公司的信用可靠程度。"},{"en":"borrower","ipa":"/ˈbɑːr.oʊ.ɚ/","zh":"借款人","icon":"📈","ex":"Each borrower must submit identification.","tr":"每位借款人都必須提交身分證明。"},{"en":"lender","ipa":"/ˈlen.dɚ/","zh":"貸款機構","icon":"🤝","ex":"The lender reviewed the application.","tr":"貸款機構審查了申請。"},{"en":"deposit account","ipa":"/dɪˈpɑː.zɪt əˌkaʊnt/","zh":"存款帳戶","icon":"💳","ex":"The company opened a new deposit account.","tr":"公司開立了新的存款帳戶。"},{"en":"withdrawal","ipa":"/wɪðˈdrɔː.əl/","zh":"提款","icon":"📝","ex":"Large withdrawals require advance notice.","tr":"大額提款需要提前通知。"},{"en":"transfer","ipa":"/trænsˈfɝː/","zh":"轉帳","icon":"📌","ex":"The transfer will be completed tomorrow.","tr":"轉帳將於明天完成。"},{"en":"balance","ipa":"/ˈbæl.əns/","zh":"帳戶餘額","icon":"💼","ex":"Please verify the account balance.","tr":"請確認帳戶餘額。"},{"en":"statement","ipa":"/ˈsteɪt.mənt/","zh":"對帳單","icon":"📋","ex":"Monthly statements are available online.","tr":"每月對帳單可在線上取得。"},{"en":"overdraft","ipa":"/ˈoʊ.vɚˌdræft/","zh":"透支","icon":"🏢","ex":"The bank charges a fee for an overdraft.","tr":"銀行會對透支收取費用。"},{"en":"liquidity","ipa":"/lɪˈkwɪd.ə.t̬i/","zh":"流動性","icon":"🧾","ex":"The company needs sufficient liquidity.","tr":"公司需要充足的流動性。"},{"en":"financing","ipa":"/ˈfaɪ.næn.sɪŋ/","zh":"融資","icon":"🔎","ex":"The expansion requires additional financing.","tr":"擴張計畫需要額外融資。"},{"en":"guarantor","ipa":"/ˌɡer.ənˈtɔːr/","zh":"保證人","icon":"📈","ex":"The bank asked for a guarantor.","tr":"銀行要求提供一名保證人。"},{"en":"maturity","ipa":"/məˈtʊr.ə.t̬i/","zh":"到期日","icon":"🤝","ex":"The bond reaches maturity next year.","tr":"這張債券明年到期。"},{"en":"transaction","ipa":"/trænˈzæk.ʃən/","zh":"交易","icon":"💳","ex":"Every transaction is recorded automatically.","tr":"每筆交易都會自動記錄。"},{"en":"remittance","ipa":"/rɪˈmɪt̬.əns/","zh":"匯款","icon":"📝","ex":"The overseas remittance arrived on Friday.","tr":"海外匯款於星期五入帳。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis;function speak(t,slow){if(!s){$("status").textContent="瀏覽器不支援發音";return}s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;const vs=s.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;s.speak(u)}function el(tag,cls,t){const n=document.createElement(tag);n.className=cls;if(t!==undefined)n.textContent=t;return n}function btn(label,t,slow){const b=el("button",slow?"slow":"",label);b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.toLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),frag=document.createDocumentFragment();for(const x of items){const c=el("article","card"),ex=el("div","example"),bs=el("div","buttons");ex.append(el("div","",x.ex),el("div","tr",x.tr));bs.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(el("div","word",x.icon+" "+x.en),el("div","ipa",x.ipa),el("div","zh",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+items.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>s?.cancel();render();</script></body></html>
