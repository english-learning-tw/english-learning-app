<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文單字發音學習</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --primary:#3157d5;
      --primary-dark:#2444ad;
      --text:#1f2937;
      --muted:#64748b;
      --soft:#eef2ff;
      --border:#dfe5f1;
      --success:#0f9d75;
      --shadow:0 10px 28px rgba(31,41,55,.09);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;
      background:linear-gradient(180deg,#eef3ff 0,#f8fafc 300px);
      color:var(--text);
    }
    header{
      text-align:center;
      padding:42px 20px 28px;
    }
    header h1{
      margin:0 0 10px;
      font-size:clamp(30px,6vw,48px);
      color:#1d347e;
      letter-spacing:.5px;
    }
    header p{
      margin:0 auto;
      max-width:700px;
      color:var(--muted);
      font-size:17px;
      line-height:1.7;
    }
    .toolbar{
      max-width:1120px;
      margin:0 auto 22px;
      padding:0 18px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .toolbar button{
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      padding:11px 16px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 4px 12px rgba(30,41,59,.05);
    }
    .toolbar button:hover{background:var(--soft)}
    .grid{
      width:min(1120px,calc(100% - 28px));
      margin:0 auto 48px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:20px;
    }
    .card{
      background:var(--card);
      border:1px solid rgba(223,229,241,.9);
      border-radius:24px;
      padding:22px;
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:132px 1fr;
      gap:20px;
      align-items:center;
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 15px 36px rgba(31,41,55,.13);
    }
    .visual{
      width:132px;
      height:132px;
      border-radius:24px;
      background:linear-gradient(145deg,#eef2ff,#fdfdff);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:68px;
      border:1px solid #e4e8fb;
      user-select:none;
    }
    .word-row{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .word{
      font-size:29px;
      font-weight:850;
      color:#1e3a8a;
      margin:0;
    }
    .phonetic{
      color:var(--muted);
      font-size:15px;
    }
    .meaning{
      margin:10px 0 13px;
      font-size:17px;
      font-weight:700;
    }
    .speak{
      border:0;
      border-radius:12px;
      background:var(--primary);
      color:white;
      font-weight:800;
      padding:9px 13px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition:background .15s ease,transform .1s ease;
    }
    .speak:hover{background:var(--primary-dark)}
    .speak:active{transform:scale(.97)}
    .speak.playing{background:var(--success)}
    .example{
      border-top:1px dashed var(--border);
      padding-top:13px;
      line-height:1.65;
    }
    .example-en{
      margin:0;
      font-size:16px;
      font-weight:700;
    }
    .example-zh{
      margin:4px 0 0;
      color:var(--muted);
      font-size:15px;
    }
    footer{
      text-align:center;
      color:var(--muted);
      padding:0 16px 32px;
      font-size:14px;
    }
    @media (max-width:820px){
      .grid{grid-template-columns:1fr}
    }
    @media (max-width:520px){
      header{padding-top:30px}
      .card{
        grid-template-columns:1fr;
        text-align:center;
      }
      .visual{margin:auto}
      .word-row{justify-content:center}
      .speak{margin:auto}
      .example{text-align:left}
    }
  </style>
</head>
<body>
  <header>
    <h1>🔊 英文單字發音學習</h1>
    <p>點擊每張卡片的「發音」按鈕，英文單字只會播放一次。每個單字都附有圖像、中文意思、英文例句與中文翻譯。</p>
  </header>

  <div class="toolbar">
    <button onclick="stopSpeech()">⏹ 停止發音</button>
    <button onclick="shuffleCards()">🔀 隨機排列</button>
  </div>

  <main class="grid" id="wordGrid"></main>

  <footer>
    建議使用 Chrome、Edge 或 Safari 開啟，並確認裝置音量已開啟。
  </footer>

  <script>
    const words = [
      {word:"apple", phonetic:"/ˈæp.əl/", meaning:"蘋果", icon:"🍎",
       example:"I eat an apple every morning.", translation:"我每天早上吃一顆蘋果。"},
      {word:"book", phonetic:"/bʊk/", meaning:"書、本子", icon:"📘",
       example:"This book is very interesting.", translation:"這本書非常有趣。"},
      {word:"cat", phonetic:"/kæt/", meaning:"貓", icon:"🐱",
       example:"The cat is sleeping on the sofa.", translation:"那隻貓正在沙發上睡覺。"},
      {word:"dog", phonetic:"/dɔːɡ/", meaning:"狗", icon:"🐶",
       example:"My dog likes to play in the park.", translation:"我的狗喜歡在公園玩。"},
      {word:"water", phonetic:"/ˈwɔː.tɚ/", meaning:"水", icon:"💧",
       example:"Please give me a glass of water.", translation:"請給我一杯水。"},
      {word:"sun", phonetic:"/sʌn/", meaning:"太陽", icon:"☀️",
       example:"The sun is bright today.", translation:"今天陽光很明亮。"},
      {word:"car", phonetic:"/kɑːr/", meaning:"汽車", icon:"🚗",
       example:"His car is parked outside.", translation:"他的車停在外面。"},
      {word:"house", phonetic:"/haʊs/", meaning:"房子、住宅", icon:"🏠",
       example:"They live in a small house.", translation:"他們住在一間小房子裡。"},
      {word:"happy", phonetic:"/ˈhæp.i/", meaning:"快樂的、高興的", icon:"😊",
       example:"I am happy to see you.", translation:"我很高興見到你。"},
      {word:"travel", phonetic:"/ˈtræv.əl/", meaning:"旅行", icon:"✈️",
       example:"We love to travel during summer.", translation:"我們喜歡在夏天旅行。"}
    ];

    const grid = document.getElementById("wordGrid");

    function render(list){
      grid.innerHTML = "";
      list.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="visual" role="img" aria-label="${item.meaning}">${item.icon}</div>
          <div>
            <div class="word-row">
              <h2 class="word">${item.word}</h2>
              <span class="phonetic">${item.phonetic}</span>
              <button class="speak" data-index="${index}" aria-label="播放 ${item.word} 的發音">
                🔊 發音
              </button>
            </div>
            <p class="meaning">中文：${item.meaning}</p>
            <div class="example">
              <p class="example-en">例句：${item.example}</p>
              <p class="example-zh">中文：${item.translation}</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll(".speak").forEach(btn => {
        btn.addEventListener("click", () => {
          const word = list[Number(btn.dataset.index)].word;
          speakOnce(word, btn);
        });
      });
    }

    function getEnglishVoice(){
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang === "en-US") ||
             voices.find(v => v.lang.startsWith("en")) ||
             null;
    }

    function speakOnce(text, button){
      if (!("speechSynthesis" in window)){
        alert("此瀏覽器不支援語音播放，請改用 Chrome、Edge 或 Safari。");
        return;
      }

      speechSynthesis.cancel();

      document.querySelectorAll(".speak").forEach(b => {
        b.classList.remove("playing");
        b.innerHTML = "🔊 發音";
      });

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.82;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voice = getEnglishVoice();
      if (voice) utterance.voice = voice;

      button.classList.add("playing");
      button.innerHTML = "🔈 播放中";

      utterance.onend = utterance.onerror = () => {
        button.classList.remove("playing");
        button.innerHTML = "🔊 發音";
      };

      speechSynthesis.speak(utterance);
    }

    function stopSpeech(){
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      document.querySelectorAll(".speak").forEach(b => {
        b.classList.remove("playing");
        b.innerHTML = "🔊 發音";
      });
    }

    function shuffleCards(){
      stopSpeech();
      const shuffled = [...words].sort(() => Math.random() - 0.5);
      render(shuffled);
    }

    speechSynthesis.onvoiceschanged = () => getEnglishVoice();
    render(words);
  </script>
</body>
</html>
