<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雲端自動發布測試｜English Learning</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.7;background:#f1f5fc;color:#203458;margin:0;padding:28px 16px 110px}
main{max-width:680px;margin:auto;background:white;padding:26px;border-radius:20px;box-shadow:0 5px 25px #22346615}
h1{color:#224ab0;margin-top:0}p{font-size:17px}button{background:#2b56b4;color:white;border:0;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
#back{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:9999;text-decoration:none;background:#2454ba;color:#fff;font-weight:700;border-radius:999px;padding:14px 19px;box-shadow:0 5px 20px #0003}
</style>
</head>
<body>
<main>
<h1>✅ 自動發布測試教材</h1>
<p>這是一份用來確認 GitHub Actions 是否能將教材自動發布到 Firestore 的測試頁面。</p>
<p><strong>English:</strong> Hello! <strong>中文：</strong>你好！</p>
<button type="button" onclick="speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Hello!');u.lang='en-US';speechSynthesis.speak(u)">🔊 測試發音 Hello!</button>
<p>若你能從 English Learning App 的教材清單開啟本頁，代表雲端教材連結已發布。</p>
</main>
<a id="back" href="/english-learning-app/">← 返回教材首頁</a>
</body>
