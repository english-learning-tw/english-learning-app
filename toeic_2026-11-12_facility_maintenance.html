<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14596b">
<meta name="description" content="2026年11月12日多益高頻職場英文：建築設施與物業維護，20個單字、美式IPA、中英例句、iPhone語音正常及慢速跟讀。">
<title>[11/12]主題建築設施與物業維護｜多益高頻英文20單字</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#153846;background:#f1f7f9}
*{box-sizing:border-box}body{margin:0;line-height:1.55;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
header{background:linear-gradient(120deg,#153d54,#147c8c);color:white;padding:22px 16px 28px}
.wrap{max-width:1070px;margin-inline:auto}h1{font-size:clamp(22px,5vw,31px);line-height:1.4;margin:14px 0}
.subtitle{font-size:14px;color:#e1f5f7;margin:7px 0 0}.back{display:inline-flex;min-height:44px;padding:8px 13px;align-items:center;color:white;border-radius:11px;border:1px solid #ffffff80;text-decoration:none;font-size:14px;font-weight:700}
main{padding:18px 14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid #d7e8eb;border-radius:15px;background:white;padding:12px}
.search{min-width:180px;flex:1;border:1px solid #abcad2;border-radius:10px;padding:12px;font-size:16px;min-height:48px}
button{font:inherit;cursor:pointer;touch-action:manipulation}.stop{min-height:46px;border:1px solid #bdd8e0;background:#e9f3f5;color:#17586b;border-radius:10px;padding:10px 13px;font-weight:700}
.status{font-size:14px;color:#426877;min-height:22px;margin:12px 3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,315px),1fr));gap:14px}
.card{background:white;border:1px solid #d8e7ec;border-radius:17px;padding:17px;box-shadow:0 4px 16px #092f4109}.head{display:flex;align-items:center;gap:12px}
.pic{background:#eaf6f5;display:grid;place-items:center;width:58px;height:58px;border-radius:14px;font-size:30px;flex:none}
.word{font-weight:800;font-size:21px;color:#17687a;overflow-wrap:anywhere}.ipa{font-size:14px;color:#567c86;margin-top:3px}
.meaning{font-size:16px;font-weight:750;margin:13px 0 10px}.example{background:#f4f9fa;border-radius:12px;padding:12px;border:1px solid #e1edef}
.en{font-size:15px;line-height:1.7}.tr{font-size:14px;color:#526e78;line-height:1.7;margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.audio{background:#176c86;color:white;border:0;border-radius:10px;min-height:46px;padding:9px 4px;font-weight:720;font-size:14px}
.audio.slow{background:#e7f3f6;color:#195e72;border:1px solid #b5d5df}.audio:focus-visible,.stop:focus-visible,.search:focus-visible,.back:focus-visible{outline:3px solid #dba939;outline-offset:2px}
.empty{text-align:center;padding:25px;color:#5a7580}footer{text-align:center;font-size:12px;color:#617d86;padding:22px 0}
@media(max-width:350px){.card{padding:13px}.audio{font-size:13px}.word{font-size:19px}}
</style></head>
<body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a>
<h1>[11/12]主題建築設施與物業維護｜多益高頻英文20單字</h1><p class="subtitle">🏢 建築維護 × 20 單字 ｜ 🔊 美式發音 ｜ 🐢 慢速跟讀 ｜ 📱 iPhone 友善</p></div></header>
<main class="wrap"><section class="toolbar" aria-label="教材搜尋及播放控制">
<input id="search" class="search" type="search" placeholder="搜尋英文、中文或例句…" aria-label="搜尋單字、中文及例句" autocomplete="off">
<button id="stop" class="stop" type="button">⏹ 停止發音</button></section>
<p id="status" class="status" role="status" aria-live="polite">載入中…</p>
<section class="grid" id="cards" aria-label="TOEIC 今日單字卡"></section>
<p class="empty" id="empty" hidden>沒有找到符合的單字，請更改搜尋條件。</p>
<footer>使用手機內建 Web Speech 語音播放；不同裝置的美式英語聲音可能略有差異。建議使用 iPhone Safari。</footer></main>
<script>
"use strict";
const DATA=[{"en":"facility","ipa":"/fəˈsɪləti/","zh":"設施；場所","icon":"🏢","ex":"The new training facility will open to employees next Monday.","tr":"新的訓練設施將於下週一開放員工使用。"},{"en":"maintenance","ipa":"/ˈmeɪntənəns/","zh":"維護；保養","icon":"🔧","ex":"Routine maintenance of the air-conditioning system is scheduled for Saturday.","tr":"空調系統的例行保養安排在星期六。"},{"en":"renovation","ipa":"/ˌrenəˈveɪʃən/","zh":"整修；翻新","icon":"🏗️","ex":"The office renovation is expected to finish before the annual conference.","tr":"辦公室整修預計會在年度會議前完成。"},{"en":"inspection","ipa":"/ɪnˈspekʃən/","zh":"檢查；檢驗","icon":"🔍","ex":"The building passed its annual fire safety inspection.","tr":"這棟建築物通過了年度消防安全檢查。"},{"en":"tenant","ipa":"/ˈtenənt/","zh":"租戶；承租人","icon":"🧑‍💼","ex":"Tenants must report water leaks to the property manager immediately.","tr":"租戶必須立即向物業經理通報漏水情況。"},{"en":"landlord","ipa":"/ˈlændlɔːrd/","zh":"房東；出租人","icon":"🏠","ex":"The landlord agreed to replace the damaged windows.","tr":"房東同意更換受損的窗戶。"},{"en":"lease","ipa":"/liːs/","zh":"租約；租賃","icon":"📄","ex":"The company signed a three-year lease for its new office.","tr":"公司為新辦公室簽訂了為期三年的租約。"},{"en":"premises","ipa":"/ˈpremɪsɪz/","zh":"營業場所；建築及其附屬場地","icon":"🚪","ex":"All visitors must wear identification badges while on the premises.","tr":"所有訪客在場所內都必須佩戴識別證。"},{"en":"plumbing","ipa":"/ˈplʌmɪŋ/","zh":"給排水管線；水管設備","icon":"🚰","ex":"The restaurant will close briefly while the plumbing is repaired.","tr":"餐廳將在水管設備維修期間短暫歇業。"},{"en":"electrician","ipa":"/ɪˌlekˈtrɪʃən/","zh":"電工；電氣技術人員","icon":"⚡","ex":"A licensed electrician will inspect the wiring tomorrow.","tr":"一名合格電工明天將檢查電線配置。"},{"en":"ventilation","ipa":"/ˌventəˈleɪʃən/","zh":"通風；通風系統","icon":"🌬️","ex":"Proper ventilation is essential in the laboratory.","tr":"實驗室必須有適當的通風。"},{"en":"elevator","ipa":"/ˈeləveɪtər/","zh":"電梯","icon":"🛗","ex":"The elevator will be out of service until noon.","tr":"電梯將停用至中午。"},{"en":"fixture","ipa":"/ˈfɪkstʃər/","zh":"固定裝置；設備配件","icon":"💡","ex":"A damaged light fixture was replaced in the hallway.","tr":"走廊裡一組受損的燈具已被更換。"},{"en":"janitorial","ipa":"/ˌdʒænɪˈtɔːriəl/","zh":"清潔維護工作的","icon":"🧹","ex":"The janitorial staff cleans the offices after business hours.","tr":"清潔人員會在營業時間結束後清掃辦公室。"},{"en":"landscaping","ipa":"/ˈlændskeɪpɪŋ/","zh":"景觀美化；庭園造景","icon":"🌳","ex":"The property manager approved the landscaping plan for the courtyard.","tr":"物業經理核准了中庭的景觀美化計畫。"},{"en":"corridor","ipa":"/ˈkɔːrɪdər/","zh":"走廊；通道","icon":"🚶","ex":"Please keep the corridor clear during the renovation.","tr":"整修期間請保持走廊暢通。"},{"en":"utility","ipa":"/juːˈtɪləti/","zh":"公用事業服務；水電等費用","icon":"💡","ex":"The monthly utility bill increased after the new equipment was installed.","tr":"新設備安裝後，每月水電等公用事業費用增加了。"},{"en":"accessible","ipa":"/əkˈsesəbəl/","zh":"無障礙可達的；可進入的","icon":"♿","ex":"The conference room is accessible to visitors who use wheelchairs.","tr":"使用輪椅的訪客可以無障礙進入這間會議室。"},{"en":"disruption","ipa":"/dɪsˈrʌpʃən/","zh":"中斷；干擾","icon":"🚧","ex":"Employees were notified of the temporary disruption to water service.","tr":"員工已收到暫時停水的通知。"},{"en":"blueprint","ipa":"/ˈbluːprɪnt/","zh":"建築藍圖；設計圖","icon":"📐","ex":"The architect reviewed the blueprint before construction began.","tr":"建築師在施工開始前審閱了設計圖。"}];
const $=id=>document.getElementById(id);
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){if(synth)voices=synth.getVoices()}
if(synth){loadVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",loadVoices)}
function speak(text,slow){
  if(!synth||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="這個瀏覽器不支援語音播放，請改用 iPhone Safari。";return}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=slow?0.67:0.98;u.pitch=1;
  const v=voices.find(v=>v.lang.toLowerCase().replace(/_/g,"-")==="en-us");
  if(v)u.voice=v;
  u.onstart=()=>{$("status").textContent="正在播放"+(slow?"慢速":"正常")+"英文發音…"};
  u.onend=()=>{$("status").textContent="播放完成，可以再次點選練習。"};
  u.onerror=()=>{$("status").textContent="語音播放失敗。請檢查裝置音量，或改用 Safari。"};
  synth.speak(u);
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function speechButton(label,spoken,slow){
 const b=el("button","audio"+(slow?" slow":""),label);
 b.type="button";b.setAttribute("aria-label",label+"："+spoken);
 b.addEventListener("click",()=>speak(spoken,slow));return b;
}
function render(){
 const q=$("search").value.trim().toLocaleLowerCase();
 const match=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(t=>t.toLocaleLowerCase().includes(q)));
 const fragment=document.createDocumentFragment();
 for(const x of match){
   const c=el("article","card"),head=el("div","head"),info=el("div");
   info.append(el("div","word",x.en),el("div","ipa",x.ipa));
   head.append(el("div","pic",x.icon),info);
   const example=el("div","example");
   example.append(el("div","en",x.ex),el("div","tr",x.tr));
   const buttons=el("div","actions");
   buttons.append(speechButton("🔊 單字",x.en,false),speechButton("🐢 單字慢速",x.en,true),speechButton("🔊 例句",x.ex,false),speechButton("🐢 例句慢速",x.ex,true));
   c.append(head,el("div","meaning",x.zh),example,buttons);fragment.append(c);
 }
 $("cards").replaceChildren(fragment);$("empty").hidden=match.length!==0;
 $("status").textContent="顯示 "+match.length+" / "+DATA.length+" 個單字。點選按鈕可播放發音。";
}
$("search").addEventListener("input",render);
$("stop").addEventListener("click",()=>{if(synth)synth.cancel();$("status").textContent="已停止發音。"});
render();
</script></body></html>
