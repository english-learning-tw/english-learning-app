<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/13]主題零售門市與商品陳列｜多益高頻英文20單字</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#18384b;background:#f2f7fa}*{box-sizing:border-box}body{margin:0;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(110deg,#173c58,#147b83);color:white;padding:22px 16px}main,.wrap{max-width:1000px;margin:auto}main{padding:16px}h1{font-size:clamp(22px,5vw,32px)}a{color:inherit}.back{display:inline-block;padding:10px;border:1px solid #a6c8d3;border-radius:9px}input{width:100%;font-size:16px;padding:13px;border:1px solid #aac5d3;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}.card{background:white;border:1px solid #d7e6ed;border-radius:15px;padding:17px}.head{display:flex;gap:12px;align-items:center}.emoji{font-size:32px}.word{font-size:22px;font-weight:800;color:#11647d}.ipa{color:#577383}.meaning{font-weight:700;margin:10px 0}.example{background:#f1f7fa;padding:12px;border-radius:10px}.tr{color:#536f7b;margin-top:6px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:46px;border:0;border-radius:9px;background:#146c86;color:white;font-size:14px;font-weight:700}button.slow{background:#e6f2f6;color:#145c76;border:1px solid #b5d4df}#status{color:#496a7a}footer{text-align:center;padding:25px;font-size:12px;color:#637d8a}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/13]主題零售門市與商品陳列｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA｜🔊 正常發音｜🐢 慢速跟讀｜📱 iPhone 友善</p></div></header><main><input id="search" type="search" placeholder="搜尋英文、中文或例句" aria-label="搜尋教材"><p id="status" aria-live="polite"></p><button id="stop" type="button">⏹ 停止發音</button><section id="cards" class="grid"></section><footer>發音使用裝置內建 Web Speech API；實際語音品質依瀏覽器與手機而異。</footer></main><script>"use strict";const DATA=[{"en":"merchandise","ipa":"/ˈmɝːtʃənˌdaɪs/","zh":"商品","icon":"🛍️","ex":"The store will display seasonal merchandise near the entrance.","tr":"商店將在入口附近展示季節性商品。"},{"en":"retailer","ipa":"/ˈriːˌteɪlɚ/","zh":"零售商","icon":"🏬","ex":"The retailer plans to open two new branches next year.","tr":"這家零售商計畫明年開設兩間新分店。"},{"en":"display","ipa":"/dɪˈspleɪ/","zh":"陳列；展示","icon":"🪧","ex":"Please arrange the new products in the front display.","tr":"請將新商品擺放在前方展示區。"},{"en":"shelf","ipa":"/ʃelf/","zh":"貨架","icon":"📚","ex":"The cleaning supplies are on the top shelf.","tr":"清潔用品放在最上層貨架。"},{"en":"showroom","ipa":"/ˈʃoʊˌruːm/","zh":"展示間；陳列室","icon":"🏢","ex":"The new furniture collection is available in our showroom.","tr":"新的家具系列已在展示間陳列。"},{"en":"checkout","ipa":"/ˈtʃekˌaʊt/","zh":"結帳處","icon":"🧾","ex":"An additional checkout counter will open during peak hours.","tr":"尖峰時段將增開一個結帳櫃檯。"},{"en":"cashier","ipa":"/kæˈʃɪr/","zh":"收銀員","icon":"💵","ex":"The cashier will provide a receipt after payment.","tr":"付款後收銀員會提供收據。"},{"en":"receipt","ipa":"/rɪˈsiːt/","zh":"收據","icon":"🧾","ex":"Keep your receipt in case you need to exchange the item.","tr":"請保留收據，以備需要換貨。"},{"en":"promotion","ipa":"/prəˈmoʊʃən/","zh":"促銷活動","icon":"🎉","ex":"The weekend promotion applies to selected appliances.","tr":"週末促銷活動適用於指定家電。"},{"en":"markdown","ipa":"/ˈmɑːrkˌdaʊn/","zh":"降價","icon":"🏷️","ex":"The manager approved a markdown on last season's clothing.","tr":"經理核准了上一季服飾的降價。"},{"en":"clearance","ipa":"/ˈklɪrəns/","zh":"出清特賣","icon":"📦","ex":"All clearance items are marked with yellow tags.","tr":"所有出清商品都貼有黃色標籤。"},{"en":"restock","ipa":"/ˌriːˈstɑːk/","zh":"補貨","icon":"🔁","ex":"Staff members will restock the shelves before opening.","tr":"員工將在開店前補滿貨架。"},{"en":"assortment","ipa":"/əˈsɔːrtmənt/","zh":"商品組合；各式商品","icon":"🎨","ex":"The shop offers a wide assortment of office supplies.","tr":"這間店提供各式各樣的辦公用品。"},{"en":"apparel","ipa":"/əˈperəl/","zh":"服飾","icon":"👕","ex":"The apparel section is located on the second floor.","tr":"服飾區位於二樓。"},{"en":"fitting room","ipa":"/ˈfɪtɪŋ ruːm/","zh":"試衣間","icon":"🚪","ex":"The fitting rooms are beside the customer service desk.","tr":"試衣間位於客服櫃檯旁。"},{"en":"price tag","ipa":"/ˈpraɪs tæɡ/","zh":"價格標籤","icon":"🏷️","ex":"Please replace the price tags before the sale begins.","tr":"請在特賣開始前更換價格標籤。"},{"en":"barcode","ipa":"/ˈbɑːrˌkoʊd/","zh":"條碼","icon":"▥","ex":"Scan the barcode to check the product's price.","tr":"掃描條碼以確認商品價格。"},{"en":"loyalty","ipa":"/ˈlɔɪəlti/","zh":"忠誠度","icon":"💳","ex":"The loyalty program offers members exclusive discounts.","tr":"會員忠誠計畫提供專屬折扣。"},{"en":"exchange","ipa":"/ɪksˈtʃeɪndʒ/","zh":"換貨","icon":"🔄","ex":"The store allows exchanges within fourteen days of purchase.","tr":"商店允許在購買後十四天內換貨。"},{"en":"outlet","ipa":"/ˈaʊtˌlet/","zh":"暢貨中心；直營門市","icon":"🏪","ex":"The brand opened a new outlet outside the city.","tr":"該品牌在市郊開設了一間新的暢貨門市。"}];const $=id=>document.getElementById(id);const synth=window.speechSynthesis;let voices=[];function load(){if(synth)voices=synth.getVoices()}load();if(synth)synth.addEventListener("voiceschanged",load);function speak(t,slow){if(!synth){$("status").textContent="此瀏覽器不支援語音";return} synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;u.voice=voices.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;u.onstart=()=>{$("status").textContent="正在播放…"};u.onend=()=>{$("status").textContent="播放完成"};u.onerror=()=>{$("status").textContent="發音未成功，請改用 Safari"};synth.speak(u)}function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function audio(label,t,slow){const b=node("button",slow?"slow":"",label);b.type="button";b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.trim().toLowerCase();const found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q)));const frag=document.createDocumentFragment();for(const x of found){const c=node("article","card"),head=node("div","head"),info=node("div"),ex=node("div","example"),bs=node("div","buttons");info.append(node("div","word",x.en),node("div","ipa",x.ipa));head.append(node("div","emoji",x.icon),info);ex.append(node("div","",x.ex),node("div","tr",x.tr));bs.append(audio("🔊 單字",x.en,false),audio("🐢 單字慢速",x.en,true),audio("🔊 例句",x.ex,false),audio("🐢 例句慢速",x.ex,true));c.append(head,node("div","meaning",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{if(synth)synth.cancel();$("status").textContent="已停止發音"};render();</script></body></html>
