<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/25]主題企業內訓與專業認證｜多益高頻英文20單字</title><meta name="theme-color" content="#176780"><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f9;color:#173849;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#183e5c,#178291);color:white;padding:24px 15px}.wrap{max-width:1080px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.45}.back{color:white;border:1px solid #c9e8ed;padding:10px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}main{max-width:1100px;padding:16px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:10px}input{min-width:180px;flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #b4ced9}button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px}.stop{background:#e8f2f5;color:#145b75;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;background:white;border:1px solid #d8e5ea;border-radius:16px}.head{display:flex;gap:12px;align-items:center}.symbol{background:#e8f4f7;padding:12px;border-radius:12px;font-size:27px}.word{color:#17687f;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#577382}.meaning{font-weight:700;margin:13px 0}.example{background:#f3f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#526c77;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{color:white;background:#19718b;padding:8px 4px;font-size:14px;font-weight:700}.slow{background:#e6f2f7;color:#165c73;border:1px solid #bed8e0}.status{color:#4c6b78;font-size:14px}footer{text-align:center;color:#617b86;font-size:12px;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/25]主題企業內訓與專業認證｜多益高頻英文20單字</h1><p>🎓 20 個職場單字｜🇺🇸 美式 IPA｜🔊 單字與例句｜🐢 慢速跟讀</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋英文、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite">共 20 個單字</p><section id="cards" class="grid"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材使用原創 TOEIC 職場情境例句，並非 ETS 官方頻率排名。發音使用瀏覽器 Web Speech API，優先選用裝置可用的美式英語聲音。</footer></main><script>"use strict";const DATA=[{"en":"training","ipa":"/ˈtreɪ.nɪŋ/","zh":"訓練；培訓","icon":"🎓","ex":"New employees receive two weeks of training before they begin taking calls.","tr":"新進員工在開始接聽電話之前，會接受兩週培訓。"},{"en":"instructor","ipa":"/ɪnˈstrʌk.tɚ/","zh":"講師；指導員","icon":"🎓","ex":"The instructor will demonstrate how to enter orders in the new system.","tr":"講師會示範如何在新系統中輸入訂單。"},{"en":"trainee","ipa":"/treɪˈniː/","zh":"受訓人員","icon":"🎓","ex":"Each trainee will practice answering customer questions with a partner.","tr":"每位受訓人員都會和搭檔練習回答顧客的問題。"},{"en":"certification","ipa":"/ˌsɝː.t̬ə.fəˈkeɪ.ʃən/","zh":"認證；資格認定","icon":"🎓","ex":"Technicians must obtain certification before working independently.","tr":"技術人員必須先取得認證，才能獨立作業。"},{"en":"course","ipa":"/kɔːrs/","zh":"課程","icon":"🎓","ex":"The company offers a six-week course in business writing.","tr":"公司提供一門為期六週的商務寫作課程。"},{"en":"curriculum","ipa":"/kəˈrɪk.jə.ləm/","zh":"課程內容；課程規劃","icon":"📚","ex":"The new curriculum includes more time for speaking practice.","tr":"新課程安排了更多口說練習時間。"},{"en":"module","ipa":"/ˈmɑː.dʒuːl/","zh":"課程單元","icon":"📚","ex":"Please finish the first online module before Friday's class.","tr":"請在週五上課前完成第一個線上單元。"},{"en":"tutorial","ipa":"/tuːˈtɔːr.i.əl/","zh":"教學指南；教學影片","icon":"📚","ex":"Watch the short tutorial before using the scheduling tool for the first time.","tr":"第一次使用排班工具前，請先觀看簡短的教學影片。"},{"en":"assessment","ipa":"/əˈses.mənt/","zh":"評量；評估","icon":"📚","ex":"You will take a short assessment at the end of the course.","tr":"你會在課程結束時參加一項簡短的評量。"},{"en":"attendance","ipa":"/əˈten.dəns/","zh":"出席；出席情況","icon":"📚","ex":"Managers can view their team's attendance records online.","tr":"主管可以在線上查看團隊的出席紀錄。"},{"en":"refresher","ipa":"/rɪˈfreʃ.ɚ/","zh":"複習課程；補強訓練","icon":"🛠️","ex":"Staff who have not used the software recently can take a one-hour refresher.","tr":"最近沒用過這套軟體的員工，可以參加一小時的複習課程。"},{"en":"hands-on","ipa":"/ˌhændzˈɑːn/","zh":"實作的；親自操作的","icon":"🛠️","ex":"The session includes hands-on practice with the new equipment.","tr":"這堂課包含新設備的實作練習。"},{"en":"prerequisite","ipa":"/priːˈrek.wə.zɪt/","zh":"先修要求；必要條件","icon":"🛠️","ex":"The introductory course is a prerequisite for the advanced class.","tr":"入門課程是進階班的先修要求。"},{"en":"proficiency","ipa":"/prəˈfɪʃ.ən.si/","zh":"熟練程度；精通","icon":"🛠️","ex":"The assessment measures proficiency in using the new software.","tr":"這項評量測量新軟體的操作熟練度。"},{"en":"apprenticeship","ipa":"/əˈpren.t̬ɪʃ.ɪp/","zh":"學徒訓練；學徒期","icon":"🛠️","ex":"The company offers a paid apprenticeship for new technicians.","tr":"公司為新進技術人員提供有薪的學徒訓練。"},{"en":"practice","ipa":"/ˈpræk.tɪs/","zh":"練習；演練","icon":"✅","ex":"The trainer gave everyone ten minutes to practice the new procedure.","tr":"培訓講師給大家十分鐘練習新流程。"},{"en":"self-paced","ipa":"/ˌselfˈpeɪst/","zh":"可依個人進度進行的","icon":"✅","ex":"The self-paced course is available online for the next 30 days.","tr":"這門可依個人進度學習的線上課程在未來 30 天內都可以上。"},{"en":"coaching","ipa":"/ˈkoʊ.tʃɪŋ/","zh":"指導；個別輔導","icon":"✅","ex":"The company provides one-on-one coaching for new team leaders.","tr":"公司為新任組長提供一對一輔導。"},{"en":"enroll","ipa":"/ɪnˈroʊl/","zh":"報名；登記參加","icon":"✅","ex":"Employees can enroll in the writing course through the staff portal.","tr":"員工可透過員工入口網站報名寫作課程。"},{"en":"mandatory","ipa":"/ˈmæn.də.tɔːr.i/","zh":"必須的；強制的","icon":"✅","ex":"The annual training session is mandatory for all staff.","tr":"所有員工都必須參加年度訓練。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis||null;let voices=[];function load(){if(s)voices=s.getVoices()||[]}if(s){load();s.addEventListener?.("voiceschanged",load)}function speak(text,slow){if(!s||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援朗讀，請改用 Safari";return}s.cancel();load();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在慢速朗讀…":"正在朗讀…"};u.onend=()=>{$("status").textContent="朗讀完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="朗讀失敗，請確認音量或使用 Safari"};s.speak(u)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){const q=$("search").value.trim().toLowerCase(),found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of found){const c=el("article","card"),h=el("div","head"),inf=el("div"),ex=el("div","example"),b=el("div","buttons");inf.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","symbol",x.icon),inf);ex.append(el("div","",x.ex),el("div","tr",x.tr));b.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,b);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{s?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>s?.cancel());render();</script></body></html>
