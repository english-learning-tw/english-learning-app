<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 個常見食物英文單字</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--primary:#3157d5;--text:#1f2937;--muted:#64748b;--border:#e1e7f0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:linear-gradient(#eef3ff,#f8fafc 320px);color:var(--text)}
header{text-align:center;padding:38px 18px 24px}
h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);color:#1e3a8a}
header p{color:var(--muted);line-height:1.7}
.controls{position:sticky;top:0;z-index:5;background:rgba(246,248,252,.94);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid var(--border)}
.control-inner{max-width:1180px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:12px 15px;border:1px solid var(--border);border-radius:14px;font-size:16px}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.action{background:#fff;border:1px solid var(--border)}
.grid{width:min(1180px,calc(100% - 28px));margin:22px auto 48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;display:grid;grid-template-columns:100px 1fr;gap:16px;box-shadow:0 8px 22px rgba(31,41,55,.07)}
.visual{width:100px;height:100px;border-radius:20px;background:#f0f4ff;display:flex;align-items:center;justify-content:center;font-size:52px}
.wordrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word{margin:0;font-size:26px;color:#1e3a8a}
.speak{background:var(--primary);color:white}
.speak.playing{background:#0f9d75}
.meaning{font-weight:800;margin:8px 0}
.example{border-top:1px dashed var(--border);padding-top:10px;line-height:1.55}
.example p{margin:3px 0}
.zh{color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding-bottom:30px}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
@media(max-width:480px){.card{grid-template-columns:1fr;text-align:center}.visual{margin:auto}.wordrow{justify-content:center}.example{text-align:left}}
</style>
</head>
<body>
<header>
<h1>🍽️ 100 個常見食物英文單字</h1>
<p>可搜尋英文或中文。點擊「🔊 發音」按鈕時，單字只播放一次。</p>
</header>
<div class="controls">
<div class="control-inner">
<input id="search" placeholder="搜尋單字，例如 apple、蘋果、雞肉">
<button class="action" onclick="shuffleCards()">🔀 隨機排列</button>
<button class="action" onclick="stopSpeech()">⏹ 停止發音</button>
</div>
</div>
<main class="grid" id="grid"></main>
<footer>建議使用 Safari、Chrome 或 Edge 開啟，並確認裝置音量已開啟。</footer>
<script>

ation": "我們晚餐後吃了冰淇淋。"}, {"word": "cake", "meaning": "蛋糕", "icon": "🍰", "example": "She made a chocolate cake.", "translation": "她做了一個巧克力蛋糕。"}, {"word": "cookie", "meaning": "餅乾", "icon": "🍪", "example": "I ate two cookies with tea.", "translation": "我配茶吃了兩片餅乾。"}, {"word": "chocolate", "meaning": "巧克力", "icon": "🍫", "example": "This chocolate is not too sweet.", "translation": "這塊巧克力不會太甜。"}, {"word": "candy", "meaning": "糖果", "icon": "🍬", "example": "The child wants some candy.", "translation": "這個孩子想吃一些糖果。"}, {"word": "doughnut", "meaning": "甜甜圈", "icon": "🍩", "example": "He bought a chocolate doughnut.", "translation": "他買了一個巧克力甜甜圈。"}, {"word": "pie", "meaning": "派", "icon": "🥧", "example": "My grandmother makes apple pie.", "translation": "我奶奶會做蘋果派。"}, {"word": "pudding", "meaning": "布丁", "icon": "🍮", "example": "The pudding is smooth and sweet.", "translation": "這個布丁滑順又香甜。"}, {"word": "honey", "meaning": "蜂蜜", "icon": "🍯", "example": "I put honey in my tea.", "translation": "我在茶裡加蜂蜜。"}, {"word": "jam", "meaning": "果醬", "icon": "🍓", "example": "She spreads jam on her toast.", "translation": "她把果醬抹在吐司上。"}, {"word": "sugar", "meaning": "糖", "icon": "🧂", "example": "Do not add too much sugar.", "translation": "不要加太多糖。"}, {"word": "salt", "meaning": "鹽", "icon": "🧂", "example": "The soup needs a little salt.", "translation": "這碗湯需要加一點鹽。"}, {"word": "peppercorn", "meaning": "胡椒", "icon": "🫙", "example": "Add some pepper to the eggs.", "translation": "在雞蛋上加一些胡椒。"}, {"word": "soy sauce", "meaning": "醬油", "icon": "🫙", "example": "Dip the dumpling in soy sauce.", "translation": "把水餃沾醬油。"}, {"word": "ketchup", "meaning": "番茄醬", "icon": "🍅", "example": "He puts ketchup on his fries.", "translation": "他把番茄醬加在薯條上。"}, {"word": "mustard", "meaning": "芥末醬", "icon": "🌭", "example": "Would you like mustard on your hot dog?", "translation": "你的熱狗要加芥末醬嗎？"}, {"word": "mayonnaise", "meaning": "美乃滋", "icon": "🥪", "example": "This sandwich has mayonnaise.", "translation": "這個三明治裡有美乃滋。"}, {"word": "oil", "meaning": "食用油", "icon": "🫗", "example": "Heat the oil in the pan.", "translation": "把鍋裡的油加熱。"}, {"word": "vinegar", "meaning": "醋", "icon": "🫙", "example": "Add a little vinegar to the salad.", "translation": "在沙拉裡加一點醋。"}, {"word": "coffee", "meaning": "咖啡", "icon": "☕", "example": "I drink coffee every morning.", "translation": "我每天早上喝咖啡。"}, {"word": "tea", "meaning": "茶", "icon": "🍵", "example": "Would you like some hot tea?", "translation": "你想喝一些熱茶嗎？"}, {"word": "juice", "meaning": "果汁", "icon": "🧃", "example": "The orange juice is fresh.", "translation": "這杯柳橙汁很新鮮。"}, {"word": "water", "meaning": "水", "icon": "💧", "example": "Please drink more water.", "translation": "請多喝水。"}, {"word": "soda", "meaning": "汽水", "icon": "🥤", "example": "He ordered a soda with lunch.", "translation": "他午餐點了一杯汽水。"}, {"word": "beer", "meaning": "啤酒", "icon": "🍺", "example": "They shared a cold beer.", "translation": "他們一起喝了一杯冰啤酒。"}, {"word": "wine", "meaning": "葡萄酒", "icon": "🍷", "example": "This wine goes well with steak.", "translation": "這款葡萄酒很適合配牛排。"}, {"word": "breakfast", "meaning": "早餐", "icon": "🍳", "example": "Breakfast is my favorite meal.", "translation": "早餐是我最喜歡的一餐。"}, {"word": "lunch", "meaning": "午餐", "icon": "🍱", "example": "We had lunch at a small café.", "translation": "我們在一間小咖啡館吃午餐。"}, {"word": "dinner", "meaning": "晚餐", "icon": "🍽️", "example": "Dinner will be ready at six.", "translation": "晚餐六點會準備好。"}, {"word": "snack", "meaning": "點心", "icon": "🍿", "example": "I packed a snack for work.", "translation": "我帶了一份點心去上班。"}, {"word": "cereal", "meaning": "早餐穀片", "icon": "🥣", "example": "The children eat cereal with milk.", "translation": "孩子們把早餐穀片配牛奶吃。"}, {"word": "oatmeal", "meaning": "燕麥粥", "icon": "🥣", "example": "Oatmeal is warm and filling.", "translation": "燕麥粥溫暖又有飽足感。"}, {"word": "pancake", "meaning": "鬆餅", "icon": "🥞", "example": "We had pancakes with honey.", "translation": "我們吃了淋蜂蜜的鬆餅。"}, {"word": "waffle", "meaning": "格子鬆餅", "icon": "🧇", "example": "The waffle is crispy outside.", "translation": "這個格子鬆餅外皮很酥脆。"}, {"word": "sausage", "meaning": "香腸", "icon": "🌭", "example": "The sausage is hot and juicy.", "translation": "這根香腸又熱又多汁。"}, {"word": "bacon", "meaning": "培根", "icon": "🥓", "example": "I like bacon with eggs.", "translation": "我喜歡培根配雞蛋。"}];
let currentWords = [...originalWords];
const grid = document.getElementById("grid");
const search = document.getElementById("search");

function render(list){
  grid.innerHTML="";
  if(!list.length){
    grid.innerHTML='<div class="empty">找不到符合的食物單字。</div>';
    return;
  }
  list.forEach((item,index)=>{
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`
      <div class="visual" role="img" aria-label="${item.meaning}">${item.icon}</div>
      <div>
        <div class="wordrow">
          <h2 class="word">${item.word}</h2>
          <button class="speak" data-index="${index}">🔊 發音</button>
        </div>
        <p class="meaning">中文：${item.meaning}</p>
        <div class="example">
          <p><strong>例句：</strong>${item.example}</p>
          <p class="zh"><strong>中文：</strong>${item.translation}</p>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  document.querySelectorAll(".speak").forEach(btn=>{
    btn.addEventListener("click",()=>speakOnce(list[Number(btn.dataset.index)].word,btn));
  });
}

function getEnglishVoice(){
  const voices=speechSynthesis.getVoices();
  return voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"))||null;
}

function speakOnce(text,button){
  if(!("speechSynthesis" in window)){
    alert("此瀏覽器不支援語音播放。");
    return;
  }
  speechSynthesis.cancel();
  document.querySelectorAll(".speak").forEach(b=>{b.classList.remove("playing");b.textContent="🔊 發音";});
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=.82;
  const voice=getEnglishVoice();
  if(voice)u.voice=voice;
  button.classList.add("playing");
  button.textContent="🔈 播放中";
  u.onend=u.onerror=()=>{button.classList.remove("playing");button.textContent="🔊 發音";};
  speechSynthesis.speak(u);
}

function stopSpeech(){
  if("speechSynthesis" in window)speechSynthesis.cancel();
  document.querySelectorAll(".speak").forEach(b=>{b.classList.remove("playing");b.textContent="🔊 發音";});
}

function shuffleCards(){
  stopSpeech();
  currentWords=[...currentWords].sort(()=>Math.random()-.5);
  render(currentWords);
}

search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  currentWords=originalWords.filter(x=>x.word.toLowerCase().includes(q)||x.meaning.includes(q));
  render(currentWords);
});

speechSynthesis.onvoiceschanged=getEnglishVoice;
render(currentWords);
</script>
</body>
</html>
