<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f67"><meta name="description" content="2026年11月15日會展與商務活動規劃 TOEIC 高頻職場英文20單字，附美式IPA、繁中例句、iPhone語音正常與慢速朗讀。"><title>[11/15]主題會展與商務活動規劃｜多益高頻英文20單字</title><style>:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#1c3649;background:#f2f7fa}*{box-sizing:border-box}body{margin:0;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(115deg,#173f67,#176f83);padding:24px 16px 28px;color:#fff}.wrap{max-width:1100px;margin:0 auto}h1{font-size:clamp(22px,4.6vw,32px);line-height:1.42;margin:15px 0 9px}header p{font-size:14px;color:#e0f4fa;margin:0}.back{display:inline-flex;align-items:center;min-height:44px;border:1px solid #c3dfe8b3;border-radius:11px;padding:9px 13px;color:white;text-decoration:none;font-weight:750}main{max-width:1128px;margin:auto;padding:19px 15px}.controls{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #d9e7ed;padding:12px;border-radius:15px}.search{flex:1;min-width:185px;padding:12px;border-radius:10px;min-height:48px;border:1px solid #b1cad5;font-size:16px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #efb943;outline-offset:2px}.stop{padding:10px 14px;border:1px solid #bed6e0;border-radius:10px;background:#eaf3f7;color:#185c76;font-weight:750;min-height:46px}.status{font-size:14px;color:#4e6f81;margin:13px 4px;min-height:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,315px),1fr));gap:14px}.card{background:white;border:1px solid #dbe6ee;border-radius:17px;padding:18px;box-shadow:0 4px 18px #1b405008}.head{display:flex;gap:13px;align-items:center}.emoji{flex:none;width:59px;height:59px;border-radius:15px;background:#e7f5f7;font-size:29px;display:grid;place-items:center}.word{font-size:22px;color:#146280;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;margin-top:3px;color:#567580}.meaning{font-size:16px;font-weight:750;margin:13px 0 10px}.example{border:1px solid #e3edf0;background:#f5f9fb;border-radius:12px;padding:12px}.english{font-size:15px;line-height:1.7}.chinese{font-size:14px;color:#55717d;line-height:1.7;margin-top:7px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.audio{min-height:46px;border:none;border-radius:10px;background:#1a6b8d;color:white;font-size:14px;font-weight:750;padding:8px 4px}.audio.slow{background:#e8f3f7;border:1px solid #bed7df;color:#17617b}.empty{text-align:center;padding:36px;color:#587482}footer{text-align:center;color:#627e8a;padding:24px 6px 8px;font-size:12px;line-height:1.7}@media(max-width:355px){.card{padding:13px}.word{font-size:20px}.audio{font-size:13px}}</style></head>
<body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>🎪 [11/15]主題會展與商務活動規劃｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA　·　🔊 單字及例句朗讀　·　🐢 慢速跟讀　·　📱 iPhone 友善</p></div></header><main><div class="controls"><input id="search" class="search" type="search" autocomplete="off" aria-label="搜尋英文、中文、音標或例句" placeholder="🔎 搜尋英文、中文或例句…"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p id="status" class="status" role="status" aria-live="polite">共 20 個單字，點選發音按鈕開始練習。</p><section id="cards" class="cards" aria-label="TOEIC會展英文20單字"></section><p id="empty" class="empty" hidden>找不到符合的單字或例句，請更換搜尋文字。</p><footer>本教材使用 TOEIC 常見職場情境設計原創例句，並非 ETS 官方公布的字頻排名。發音使用 iPhone Safari 等瀏覽器內建 Web Speech API，將優先選用 en-US 語音；實際音色與音量取決於裝置設定。</footer></main><script>
"use strict";const DATA=[{"en":"venue","ipa":"/ˈven.juː/","zh":"活動場地；會場","icon":"📍","ex":"The event coordinator reserved a venue near the train station.","tr":"活動協調人員預訂了火車站附近的會場。"},{"en":"exhibitor","ipa":"/ɪɡˈzɪb.ɪ.tɚ/","zh":"參展商；展出者","icon":"🧑‍💼","ex":"Each exhibitor must set up its booth before the trade show opens.","tr":"每家參展商都必須在商展開幕前完成攤位布置。"},{"en":"booth","ipa":"/buːθ/","zh":"展覽攤位","icon":"🏷️","ex":"Our sales team will demonstrate the new product at booth twelve.","tr":"業務團隊將在十二號攤位示範新產品。"},{"en":"convention","ipa":"/kənˈven.ʃən/","zh":"大型會議；業界大會","icon":"🏢","ex":"More than a thousand professionals attended the annual industry convention.","tr":"超過一千名專業人士參加了年度產業大會。"},{"en":"seminar","ipa":"/ˈsem.ə.nɑːr/","zh":"研討會；講座","icon":"🎓","ex":"The company is hosting a seminar on international business practices.","tr":"公司正在舉辦一場關於國際商務實務的研討會。"},{"en":"keynote","ipa":"/ˈkiː.noʊt/","zh":"主題演講；主旨演說","icon":"🎤","ex":"The chief executive will deliver the keynote at nine thirty.","tr":"執行長將於九點三十分發表主題演講。"},{"en":"delegate","ipa":"/ˈdel.ə.ɡət/","zh":"會議代表；出席代表","icon":"👥","ex":"Every delegate will receive an information packet at check-in.","tr":"每位與會代表報到時都會收到一份資料袋。"},{"en":"registration","ipa":"/ˌredʒ.ɪˈstreɪ.ʃən/","zh":"報名；登記","icon":"📝","ex":"Online registration closes three days before the conference.","tr":"線上報名將於研討會開始前三天截止。"},{"en":"admission","ipa":"/ədˈmɪʃ.ən/","zh":"入場許可；入場費","icon":"🎟️","ex":"Admission to the exhibition is free for registered visitors.","tr":"已完成登記的參觀者可免費入場觀展。"},{"en":"rehearsal","ipa":"/rɪˈhɝː.səl/","zh":"彩排；預演","icon":"🎬","ex":"The speakers will attend a rehearsal before the opening ceremony.","tr":"講者將在開幕典禮前參加彩排。"},{"en":"catering","ipa":"/ˈkeɪ.tɚ.ɪŋ/","zh":"活動餐飲服務；外燴","icon":"🍽️","ex":"The organizer arranged catering for two hundred guests.","tr":"主辦單位為兩百位賓客安排了餐飲服務。"},{"en":"banquet","ipa":"/ˈbæŋ.kwɪt/","zh":"正式宴會","icon":"🥂","ex":"The awards banquet will take place after the closing presentation.","tr":"頒獎宴會將在閉幕簡報後舉行。"},{"en":"auditorium","ipa":"/ˌɑː.dəˈtɔːr.i.əm/","zh":"禮堂；大型講堂","icon":"🏛️","ex":"The presentation has been moved to the main auditorium.","tr":"這場簡報已改至主禮堂舉行。"},{"en":"demonstration","ipa":"/ˌdem.ənˈstreɪ.ʃən/","zh":"示範；操作展示","icon":"🛠️","ex":"The equipment demonstration will begin at the exhibition hall at noon.","tr":"設備操作展示將於中午在展覽館開始。"},{"en":"signage","ipa":"/ˈsaɪ.nɪdʒ/","zh":"指示標誌；標示系統","icon":"🪧","ex":"Please install clear signage directing visitors to the registration desk.","tr":"請設置清楚的指示標誌，引導訪客前往報到櫃檯。"},{"en":"badge","ipa":"/bædʒ/","zh":"識別證；名牌","icon":"🪪","ex":"Staff members must wear their event badges throughout the conference.","tr":"工作人員在整場會議期間都必須佩戴活動識別證。"},{"en":"seating","ipa":"/ˈsiː.tɪŋ/","zh":"座位安排；座位配置","icon":"💺","ex":"The seating arrangement will be finalized after we confirm the guest list.","tr":"確認賓客名單後，我們將敲定座位安排。"},{"en":"capacity","ipa":"/kəˈpæs.ə.ti/","zh":"容納人數；容量","icon":"👥","ex":"The meeting room has a maximum capacity of eighty people.","tr":"這間會議室最多可容納八十人。"},{"en":"facilitator","ipa":"/fəˈsɪl.əˌteɪ.tɚ/","zh":"活動引導人；協作主持人","icon":"🗣️","ex":"A trained facilitator will lead the small-group discussions.","tr":"一位受過訓練的引導人將帶領小組討論。"},{"en":"workshop","ipa":"/ˈwɝːk.ʃɑːp/","zh":"實作工作坊；研習課程","icon":"🧑‍🏫","ex":"Participants can attend a workshop on effective customer communication.","tr":"參與者可以參加一場有效顧客溝通的實作工作坊。"}];const get=id=>document.getElementById(id);const synth=("speechSynthesis" in window)?window.speechSynthesis:null;let voices=[];function refreshVoices(){if(synth)voices=synth.getVoices()||[];}if(synth){refreshVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",refreshVoices);}function speak(text,slow){if(!synth||typeof SpeechSynthesisUtterance==="undefined"){get("status").textContent="此瀏覽器不支援語音朗讀，建議改用 iPhone Safari。";return;}try{synth.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=slow?0.65:0.98;utterance.pitch=1;refreshVoices();const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)utterance.voice=v;utterance.onstart=()=>{get("status").textContent="正在播放"+(slow?"慢速":"正常語速")+"英文…"};utterance.onend=()=>{get("status").textContent="播放完成，可選擇下一個發音按鈕。"};utterance.onerror=e=>{if(!["interrupted","canceled"].includes(e.error))get("status").textContent="語音播放失敗，請檢查音量或改用 Safari。"};synth.speak(utterance);}catch(e){get("status").textContent="無法播放語音，請檢查瀏覽器設定。"}}function element(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}function audio(label,txt,slow){const b=element("button","audio"+(slow?" slow":""),label);b.type="button";b.setAttribute("aria-label",label+"："+txt);b.addEventListener("click",()=>speak(txt,slow));return b;}function render(){const q=get("search").value.trim().toLocaleLowerCase();const rows=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(y=>y.toLocaleLowerCase().includes(q)));const frag=document.createDocumentFragment();for(const x of rows){const card=element("article","card"),head=element("div","head"),info=element("div"),example=element("div","example"),buttons=element("div","actions");info.append(element("div","word",x.en),element("div","ipa",x.ipa));head.append(element("div","emoji",x.icon),info);example.append(element("div","english",x.ex),element("div","chinese",x.tr));buttons.append(audio("🔊 單字",x.en,false),audio("🐢 單字慢速",x.en,true),audio("🔊 例句",x.ex,false),audio("🐢 例句慢速",x.ex,true));card.append(head,element("div","meaning",x.zh),example,buttons);frag.append(card);}get("cards").replaceChildren(frag);get("empty").hidden=rows.length!==0;get("status").textContent="顯示 "+rows.length+" / "+DATA.length+" 個單字。";}get("search").addEventListener("input",render);get("stop").addEventListener("click",()=>{if(synth)synth.cancel();get("status").textContent="已停止發音。";});render();
</script></body></html>
