g, the maidenhair fern produces fresh leaves and new growth.", "translation": "春天時，鐵線蕨會長出新葉與嫩芽。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "bird's-nest fern", "meaning": "山蘇", "emoji": "🍄", "example": "Gardeners often choose the bird's-nest fern for its distinctive form and color.", "translation": "園藝愛好者常因山蘇獨特的外形與色彩而選擇它。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "staghorn fern", "meaning": "鹿角蕨", "emoji": "🍄", "example": "The roots of the staghorn fern absorb moisture and nutrients from the soil.", "translation": "鹿角蕨的根會從土壤吸收水分與養分。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "bracken", "meaning": "蕨菜", "emoji": "🍄", "example": "This bracken can attract insects, birds, or other wildlife to the garden.", "translation": "這種蕨菜能吸引昆蟲、鳥類或其他野生動物到花園。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "sphagnum moss", "meaning": "水苔", "emoji": "🍄", "example": "With proper care, the sphagnum moss can remain healthy through changing seasons.", "translation": "妥善照顧下，水苔能在季節變化中維持健康。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "liverwort", "meaning": "地錢", "emoji": "🍄", "example": "The liverwort grows best with the right balance of sunlight and water.", "translation": "地錢在日照與水分適當時生長得最好。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "mushroom", "meaning": "蘑菇", "emoji": "🍄", "example": "In spring, the mushroom produces fresh leaves and new growth.", "translation": "春天時，蘑菇會長出新葉與嫩芽。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "shiitake", "meaning": "香菇", "emoji": "🍄", "example": "Gardeners often choose the shiitake for its distinctive form and color.", "translation": "園藝愛好者常因香菇獨特的外形與色彩而選擇它。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "oyster mushroom", "meaning": "蠔菇", "emoji": "🍄", "example": "The roots of the oyster mushroom absorb moisture and nutrients from the soil.", "translation": "蠔菇的根會從土壤吸收水分與養分。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "enoki mushroom", "meaning": "金針菇", "emoji": "🍄", "example": "This enoki mushroom can attract insects, birds, or other wildlife to the garden.", "translation": "這種金針菇能吸引昆蟲、鳥類或其他野生動物到花園。"}, {"type": "植物", "category": "蕨類苔蘚與真菌", "word": "truffle", "meaning": "松露", "emoji": "🍄", "example": "With proper care, the truffle can remain healthy through changing seasons.", "translation": "妥善照顧下，松露能在季節變化中維持健康。"}];let favorites=JSON.parse(localStorage.getItem('nature300Fav')||'[]'),learned=JSON.parse(localStorage.getItem('nature300Learn')||'[]'),current=[...words],quizWord;const grid=document.getElementById('grid'),search=document.getElementById('search'),typeFilter=document.getElementById('typeFilter'),category=document.getElementById('category'),statusFilter=document.getElementById('statusFilter');function rebuildCategories(){let val=category.value;let cats=[...new Set(words.filter(x=>!typeFilter.value||x.type===typeFilter.value).map(x=>x.category))];category.innerHTML='<option value="">全部分類</option>'+cats.map(c=>`<option>${c}</option>`).join('');if(cats.includes(val))category.value=val}rebuildCategories();function save(){localStorage.setItem('nature300Fav',JSON.stringify(favorites));localStorage.setItem('nature300Learn',JSON.stringify(learned));stats()}function stats(){favStat.textContent='收藏 '+favorites.length;learnStat.textContent='已學會 '+learned.length}function applyFilters(){let q=search.value.trim().toLowerCase();current=words.filter(x=>(!q||(x.word+' '+x.meaning+' '+x.category).toLowerCase().includes(q))&&(!typeFilter.value||x.type===typeFilter.value)&&(!category.value||x.category===category.value)&&(!statusFilter.value||(statusFilter.value==='favorite'?favorites.includes(x.word):learned.includes(x.word))));render(current)}function render(list){grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">找不到符合條件的單字。</div>';return}list.forEach((x,i)=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<div class="visual"><span class="typeTag">${x.type}</span>${x.emoji}</div><div><div class="top"><h2 class="word">${x.word}</h2><span class="badge">${x.category}</span><button class="speak" data-word="${i}">🔊 單字</button><button class="iconbtn favorite ${favorites.includes(x.word)?'active':''}" data-f="${x.word}">⭐</button><button class="iconbtn ${learned.includes(x.word)?'active':''}" data-l="${x.word}">✔</button></div><p class="meaning">中文：${x.meaning}</p><div class="example"><div class="exampleRow"><p><b>例句：</b>${x.example}</p><button class="sentenceSpeak smallBtn" data-sentence="${i}">🔊 例句</button></div><p class="zh"><b>中文：</b>${x.translation}</p></div></div>`;grid.appendChild(c)});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>speakText(list[+b.dataset.word].word,b,'🔊 單字'));document.querySelectorAll('[data-sentence]').forEach(b=>b.onclick=()=>speakText(list[+b.dataset.sentence].example,b,'🔊 例句'));document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>toggle('f',b.dataset.f));document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>toggle('l',b.dataset.l))}function toggle(t,w){let a=t==='f'?favorites:learned;a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();applyFilters()}function speakText(t,b,label){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();document.querySelectorAll('.speak').forEach(x=>x.textContent='🔊 單字');document.querySelectorAll('.sentenceSpeak').forEach(x=>x.textContent='🔊 例句');let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=t.split(' ').length>4?.88:.8;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;b.textContent='🔈 播放中';u.onend=u.onerror=()=>b.textContent=label;speechSynthesis.speak(u)}function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('.speak').forEach(x=>x.textContent='🔊 單字');document.querySelectorAll('.sentenceSpeak').forEach(x=>x.textContent='🔊 例句')}function shuffleCards(){current=[...current].sort(()=>Math.random()-.5);render(current)}function openQuiz(){quizModal.classList.
