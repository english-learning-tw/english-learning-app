<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/24]主題採購議價與供應商管理｜多益高頻英文20單字</title><meta name="theme-color" content="#176780"><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f9;color:#173849;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#183e5c,#178291);color:white;padding:24px 15px}.wrap{max-width:1080px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.45}.back{color:white;border:1px solid #c9e8ed;padding:10px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}main{max-width:1100px;padding:16px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:10px}input{min-width:180px;flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #b4ced9}button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px}.stop{background:#e8f2f5;color:#145b75;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;background:white;border:1px solid #d8e5ea;border-radius:16px}.head{display:flex;gap:12px;align-items:center}.symbol{background:#e8f4f7;padding:12px;border-radius:12px;font-size:27px}.word{color:#17687f;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#577382}.meaning{font-weight:700;margin:13px 0}.example{background:#f3f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#526c77;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{color:white;background:#19718b;padding:8px 4px;font-size:14px;font-weight:700}.slow{background:#e6f2f7;color:#165c73;border:1px solid #bed8e0}.status{color:#4c6b78;font-size:14px}footer{text-align:center;color:#617b86;font-size:12px;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/24]主題採購議價與供應商管理｜多益高頻英文20單字</h1><p>🛒 20 個職場單字｜🇺🇸 美式 IPA｜🔊 單字與例句｜🐢 慢速跟讀</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋英文、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite">共 20 個單字</p><section id="cards" class="grid"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材使用原創 TOEIC 職場情境例句，並非 ETS 官方頻率排名。發音使用瀏覽器 Web Speech API，優先選用裝置可用的美式英語聲音。</footer></main><script>"use strict";const DATA=[{"en":"procurement","ipa":"/prəˈkjʊrmənt/","zh":"採購作業","icon":"🛒","ex":"The procurement department requested bids from three suppliers.","tr":"採購部門向三家供應商徵求報價。"},{"en":"quotation","ipa":"/kwoʊˈteɪʃən/","zh":"報價單；報價","icon":"🧾","ex":"Please send an updated quotation by Thursday afternoon.","tr":"請在星期四下午前寄送更新後的報價單。"},{"en":"bid","ipa":"/bɪd/","zh":"投標；出價","icon":"📨","ex":"The contractor submitted the lowest bid for the renovation project.","tr":"承包商為整修工程提出最低標價。"},{"en":"tender","ipa":"/ˈtendər/","zh":"投標書；招標","icon":"📑","ex":"All tenders must be received before the stated deadline.","tr":"所有投標書必須在指定截止期限前送達。"},{"en":"vendor","ipa":"/ˈvendər/","zh":"供應商；賣方","icon":"🏭","ex":"The vendor agreed to replace items damaged during delivery.","tr":"供應商同意更換運送途中受損的商品。"},{"en":"negotiate","ipa":"/nɪˈɡoʊʃieɪt/","zh":"協商；議價","icon":"🤝","ex":"The purchasing manager will negotiate a lower unit price.","tr":"採購經理將協商較低的單價。"},{"en":"bargain","ipa":"/ˈbɑːrɡən/","zh":"議價；划算的交易","icon":"💬","ex":"The buyer tried to bargain for a discount on bulk orders.","tr":"買方試圖針對大量訂單議價以取得折扣。"},{"en":"wholesale","ipa":"/ˈhoʊlseɪl/","zh":"批發的；批發","icon":"📦","ex":"The distributor offers wholesale prices to registered businesses.","tr":"經銷商向已登記的企業提供批發價格。"},{"en":"bulk","ipa":"/bʌlk/","zh":"大量；大宗","icon":"🏷️","ex":"Ordering in bulk can reduce the cost per item.","tr":"大量訂購可以降低每件商品的成本。"},{"en":"purchase order","ipa":"/ˈpɜːrtʃəs ˌɔːrdər/","zh":"採購單","icon":"📝","ex":"The supplier cannot begin production until it receives our purchase order.","tr":"供應商收到我們的採購單後才能開始生產。"},{"en":"requisition","ipa":"/ˌrekwəˈzɪʃən/","zh":"請購單；正式申請","icon":"📋","ex":"Employees must submit a requisition before ordering new equipment.","tr":"員工訂購新設備前必須提交請購單。"},{"en":"invoice","ipa":"/ˈɪnvɔɪs/","zh":"發票；請款單","icon":"🧮","ex":"The invoice should include the purchase order number.","tr":"發票應包含採購單編號。"},{"en":"unit price","ipa":"/ˈjuːnɪt praɪs/","zh":"單價","icon":"💲","ex":"The unit price decreases when we order more than five hundred pieces.","tr":"訂購超過五百件時，單價會下降。"},{"en":"lead time","ipa":"/ˈliːd taɪm/","zh":"前置作業時間；交期","icon":"⏱️","ex":"The supplier's lead time for custom parts is six weeks.","tr":"供應商客製化零件的交期為六週。"},{"en":"minimum order","ipa":"/ˈmɪnəməm ˈɔːrdər/","zh":"最低訂購量","icon":"📏","ex":"The minimum order for this product is one hundred units.","tr":"這項產品的最低訂購量是一百件。"},{"en":"supplier evaluation","ipa":"/səˈplaɪər ɪˌvæljuˈeɪʃən/","zh":"供應商評估","icon":"📊","ex":"Supplier evaluation includes delivery reliability and product quality.","tr":"供應商評估包含交貨可靠度與產品品質。"},{"en":"specification","ipa":"/ˌspesəfəˈkeɪʃən/","zh":"規格；規範","icon":"📐","ex":"Review the technical specifications before approving the order.","tr":"核准訂單前請先檢查技術規格。"},{"en":"counteroffer","ipa":"/ˈkaʊntərˌɔːfər/","zh":"還價；反提案","icon":"🔄","ex":"The vendor made a counteroffer with a shorter delivery schedule.","tr":"供應商提出一項交期較短的反提案。"},{"en":"purchase agreement","ipa":"/ˈpɜːrtʃəs əˈɡriːmənt/","zh":"採購協議","icon":"✍️","ex":"The purchase agreement specifies payment and delivery terms.","tr":"採購協議明定付款與交貨條件。"},{"en":"sourcing","ipa":"/ˈsɔːrsɪŋ/","zh":"尋找供應來源；採購尋源","icon":"🔎","ex":"The company is sourcing alternative materials from local manufacturers.","tr":"公司正向當地製造商尋找替代材料來源。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis||null;let voices=[];function load(){if(s)voices=s.getVoices()||[]}if(s){load();s.addEventListener?.("voiceschanged",load)}function speak(text,slow){if(!s||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援朗讀，請改用 Safari";return}s.cancel();load();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在慢速朗讀…":"正在朗讀…"};u.onend=()=>{$("status").textContent="朗讀完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="朗讀失敗，請確認音量或使用 Safari"};s.speak(u)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){const q=$("search").value.trim().toLowerCase(),found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of found){const c=el("article","card"),h=el("div","head"),inf=el("div"),ex=el("div","example"),b=el("div","buttons");inf.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","symbol",x.icon),inf);ex.append(el("div","",x.ex),el("div","tr",x.tr));b.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,b);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{s?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>s?.cancel());render();</script></body></html>
