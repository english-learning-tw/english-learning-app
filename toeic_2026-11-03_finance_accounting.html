<style>

<body>
<header><div class="wrap"><div class="topline"><span class="tag">TOEIC DAILY · 2026/11/03</span><a class="top-home" href="./index.html">← 英文教材首頁</a></div><h1>📊 [11/03]主題財務報表與會計｜多益高頻英文20單字</h1><p class="desc">財務報表、營收獲利、會計稽核與企業資金管理。點單字或例句朗讀，並用慢速練習跟讀。</p><div class="chips"><span>20 個高頻職場詞彙</span><span>20 組雙語例句</span><span>🇺🇸 美式 IPA</span><span>🔊 正常＋慢速朗讀</span></div></div></header>
<main><div class="searchbar"><input type="search" id="q" placeholder="搜尋英文、中文、IPA 或例句…" aria-label="搜尋多益單字"><button type="button" class="stop" id="stop">■ 停止播放</button></div><div id="status" role="status" aria-live="polite"></div><p id="count" class="count"></p><section class="grid" id="grid"></section><p class="empty" id="empty" hidden>沒有符合的詞彙，請更換搜尋關鍵字。</p><p class="note">發音由 Safari／瀏覽器裝置內建英文語音合成提供，會優先選擇 en-US 語音；聲音品質與可用性取決於裝置及語音設定。這是原創職場學習教材，不代表 ETS 官方字頻排名。</p></main>
<a class="back" href="./index.html">← 返回 English Learning App</a>
<script>
"use strict";
const DATA=[{"en":"revenue","ipa":"/ˈrev.ə.nuː/","zh":"營收；收入","icon":"💰","ex":"The company's revenue increased by eight percent this quarter.","tr":"公司本季的營收成長了百分之八。"},{"en":"profit","ipa":"/ˈprɑː.fɪt/","zh":"利潤；獲利","icon":"📈","ex":"Higher transportation costs reduced our annual profit.","tr":"運輸成本上升使我們的年度利潤減少。"},{"en":"expense","ipa":"/ɪkˈspens/","zh":"費用；支出","icon":"🧾","ex":"Please record every business expense in the monthly report.","tr":"請將每一筆業務支出記錄在月報中。"},{"en":"asset","ipa":"/ˈæs.et/","zh":"資產","icon":"🏢","ex":"The new delivery vehicle is an important asset for the company.","tr":"新的配送車輛是公司的重要資產。"},{"en":"liability","ipa":"/ˌlaɪ.əˈbɪl.ə.t̬i/","zh":"負債；債務責任","icon":"📋","ex":"The accountant listed the outstanding loan as a liability.","tr":"會計師將尚未清償的貸款列為負債。"},{"en":"equity","ipa":"/ˈek.wə.t̬i/","zh":"權益；股東權益","icon":"⚖️","ex":"The financial statement shows an increase in shareholders' equity.","tr":"財務報表顯示股東權益有所增加。"},{"en":"audit","ipa":"/ˈɑː.dɪt/","zh":"審計；查核","icon":"🔍","ex":"An independent firm will conduct the annual audit in December.","tr":"一家獨立事務所將在十二月進行年度審計。"},{"en":"fiscal","ipa":"/ˈfɪs.kəl/","zh":"財政的；會計年度的","icon":"🗓️","ex":"Our fiscal year ends on March 31.","tr":"我們的會計年度於三月三十一日結束。"},{"en":"quarterly","ipa":"/ˈkwɔːr.t̬ɚ.li/","zh":"每季的；按季的","icon":"📆","ex":"The finance team will release its quarterly report on Friday.","tr":"財務團隊將在星期五發布季度報告。"},{"en":"forecast","ipa":"/ˈfɔːr.kæst/","zh":"預測；預估","icon":"🔮","ex":"The latest sales forecast predicts steady growth next year.","tr":"最新銷售預測顯示明年將穩定成長。"},{"en":"depreciation","ipa":"/dɪˌpriː.ʃiˈeɪ.ʃən/","zh":"折舊","icon":"📉","ex":"Depreciation on the equipment is included in the annual accounts.","tr":"該設備的折舊已列入年度帳目。"},{"en":"reimbursement","ipa":"/ˌriː.ɪmˈbɝːs.mənt/","zh":"費用報銷；償還","icon":"💳","ex":"Employees can request reimbursement for approved travel costs.","tr":"員工可針對已核准的差旅費申請報銷。"},{"en":"receivable","ipa":"/rɪˈsiː.və.bəl/","zh":"應收的；應收帳款（accounts receivable）","icon":"📥","ex":"The accountant reviewed the accounts receivable before closing the books.","tr":"會計人員在結帳前檢查了應收帳款。"},{"en":"payable","ipa":"/ˈpeɪ.ə.bəl/","zh":"應付的；應付帳款（accounts payable）","icon":"📤","ex":"The accounts payable team checks all bills before payment.","tr":"應付帳款團隊在付款前會核對所有帳單。"},{"en":"allocate","ipa":"/ˈæl.ə.keɪt/","zh":"分配；撥給","icon":"🧩","ex":"The director plans to allocate more funds to employee training.","tr":"主管計畫分配更多資金用於員工訓練。"},{"en":"deficit","ipa":"/ˈdef.ə.sɪt/","zh":"赤字；不足額","icon":"🔻","ex":"The department reported a budget deficit for the second quarter.","tr":"該部門報告第二季出現預算赤字。"},{"en":"surplus","ipa":"/ˈsɝː.pləs/","zh":"盈餘；剩餘","icon":"🟢","ex":"The company will use its cash surplus to upgrade office equipment.","tr":"公司將運用現金盈餘更新辦公設備。"},{"en":"ledger","ipa":"/ˈledʒ.ɚ/","zh":"分類帳；總帳簿","icon":"📖","ex":"Please record each transaction in the general ledger.","tr":"請將每筆交易記錄在總分類帳中。"},{"en":"dividend","ipa":"/ˈdɪv.ə.dend/","zh":"股利；股息","icon":"💵","ex":"The board announced a dividend payment to shareholders.","tr":"董事會宣布將向股東發放股利。"},{"en":"margin","ipa":"/ˈmɑːr.dʒɪn/","zh":"利潤率；差額","icon":"📊","ex":"The company improved its profit margin by reducing operating costs.","tr":"公司透過降低營運成本，提高了利潤率。"}];
const $=id=>document.getElementById(id);
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[];
function refreshVoices(){if(synth) voices=synth.getVoices();}
if(synth){refreshVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",refreshVoices);}
function say(text,slow){
 if(!synth||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援內建語音朗讀；請改用 Safari。";return;}
 synth.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";u.rate=slow?0.67:0.98;u.pitch=1;
 const us=voices.find(v=>v.lang.replace("_","-").toLowerCase()==="en-us");
 if(us)u.voice=us;
 u.onerror=()=>{$("status").textContent="語音播放失敗，請確認 iPhone 的音量與 Safari 語音設定，再點選一次。";};
 u.onstart=()=>{$("status").textContent="正在播放"+(slow?"慢速":"正常")+"英文朗讀…";};
 u.onend=()=>{$("status").textContent="";};
 synth.speak(u);
}
function elt(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!=null)n.textContent=content;return n;}
function audioButton(label,spoken,slow){const b=elt("button",slow?"slow":"",label);b.type="button";b.setAttribute("aria-label",label+"："+spoken);b.addEventListener("click",()=>say(spoken,slow));return b;}
function render(){
 const q=$("q").value.trim().toLocaleLowerCase();
 const list=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLocaleLowerCase().includes(q)));
 const fragment=document.createDocumentFragment();
 list.forEach(x=>{
  const card=elt("article","card");
  const head=elt("div","head");const icon=elt("div","emoji",x.icon);
  const info=elt("div");info.append(elt("div","word",x.en),elt("div","ipa",x.ipa));
  head.append(icon,info);
  const example=elt("div","example");
  example.append(elt("div","en",x.ex),elt("div","tw",x.tr));
  const actions=elt("div","actions");
  actions.append(audioButton("🔊 單字",x.en,false),audioButton("🐢 慢速單字",x.en,true),audioButton("🔊 例句",x.ex,false),audioButton("🐢 慢速例句",x.ex,true));
  card.append(head,elt("div","zh",x.zh),example,actions);fragment.append(card);
 });
 $("grid").replaceChildren(fragment);
 $("count").textContent="顯示 "+list.length+" / "+DATA.length+" 筆詞彙";
 $("empty").hidden=list.length!==0;
}
$("q").addEventListener("input",render);
$("stop").addEventListener("click",()=>{if(synth)synth.cancel();$("status").textContent="已停止朗讀。";});
render();
</script>
