r in Tokyo.", "translation": "我需要在東京轉機。"}, {"word": "Transit", "meaning": "過境", "icon": "🔁", "category": "搭機動作", "example": "We are in transit for three hours.", "translation": "我們過境停留三小時。"}, {"word": "Check in", "meaning": "辦理報到", "icon": "✅", "category": "搭機動作", "example": "You can check in online.", "translation": "你可以在線上辦理報到。"}, {"word": "Drop off baggage", "meaning": "托運行李", "icon": "🧳", "category": "搭機動作", "example": "Where can I drop off my baggage?", "translation": "我可以在哪裡托運行李？"}, {"word": "Upgrade", "meaning": "升等", "icon": "⬆️", "category": "搭機動作", "example": "We upgraded to business class.", "translation": "我們升等到商務艙。"}, {"word": "Queue", "meaning": "排隊", "icon": "👥", "category": "搭機動作", "example": "Please queue behind the line.", "translation": "請在標線後方排隊。"}, {"word": "Announcement", "meaning": "廣播", "icon": "📢", "category": "搭機動作", "example": "Listen carefully to the announcement.", "translation": "請仔細聽廣播。"}, {"word": "Boarding", "meaning": "登機作業", "icon": "🚶", "category": "搭機動作", "example": "Boarding has started.", "translation": "登機作業已開始。"}, {"word": "Final call", "meaning": "最後登機通知", "icon": "📣", "category": "搭機動作", "example": "This is the final call for Flight 207.", "translation": "這是207號航班最後登機通知。"}, {"word": "Boarding group", "meaning": "登機組別", "icon": "🔢", "category": "搭機動作", "example": "Please wait for your boarding group.", "translation": "請等候你的登機組別。"}, {"word": "Fasten", "meaning": "繫緊", "icon": "🔒", "category": "搭機動作", "example": "Please fasten your seat belt.", "translation": "請繫緊安全帶。"}, {"word": "Recline", "meaning": "後傾座椅", "icon": "💺", "category": "搭機動作", "example": "You may recline your seat now.", "translation": "你現在可以將座椅後傾。"}, {"word": "Turbulence", "meaning": "亂流", "icon": "🌪️", "category": "搭機動作", "example": "We experienced some turbulence.", "translation": "我們遇到了一些亂流。"}, {"word": "Emergency exit", "meaning": "緊急出口", "icon": "🚨", "category": "搭機動作", "example": "Do not block the emergency exit.", "translation": "請勿阻擋緊急出口。"}, {"word": "Evacuate", "meaning": "疏散", "icon": "🏃", "category": "搭機動作", "example": "Follow the crew if you need to evacuate.", "translation": "需要疏散時請聽從機組員指示。"}, {"word": "Suitcase", "meaning": "行李箱", "icon": "🧳", "category": "旅行用品", "example": "My suitcase is too heavy.", "translation": "我的行李箱太重了。"}, {"word": "Backpack", "meaning": "後背包", "icon": "🎒", "category": "旅行用品", "example": "I keep my passport in my backpack.", "translation": "我把護照放在後背包裡。"}, {"word": "Wallet", "meaning": "錢包", "icon": "👛", "category": "旅行用品", "example": "Do not leave your wallet on the seat.", "translation": "不要把錢包留在座位上。"}, {"word": "Credit card", "meaning": "信用卡", "icon": "💳", "category": "旅行用品", "example": "Can I pay by credit card?", "translation": "我可以刷信用卡嗎？"}, {"word": "Cash", "meaning": "現金", "icon": "💵", "category": "旅行用品", "example": "I need some cash for the bus.", "translation": "我需要一些現金搭公車。"}, {"word": "Phone charger", "meaning": "手機充電器", "icon": "🔌", "category": "旅行用品", "example": "I forgot my phone charger.", "translation": "我忘了帶手機充電器。"}, {"word": "Power bank", "meaning": "行動電源", "icon": "🔋", "category": "旅行用品", "example": "Keep your power bank in your carry-on bag.", "translation": "請把行動電源放在隨身行李中。"}, {"word": "Adapter", "meaning": "轉接頭", "icon": "🔌", "category": "旅行用品", "example": "I need an adapter for this outlet.", "translation": "我需要這個插座的轉接頭。"}, {"word": "Headphones", "meaning": "耳機", "icon": "🎧", "category": "旅行用品", "example": "I use headphones during the flight.", "translation": "我在飛行途中使用耳機。"}, {"word": "Neck pillow", "meaning": "頸枕", "icon": "🛌", "category": "旅行用品", "example": "This neck pillow is very comfortable.", "translation": "這個頸枕很舒服。"}, {"word": "Blanket", "meaning": "毛毯", "icon": "🧣", "category": "旅行用品", "example": "Could I have a blanket, please?", "translation": "可以給我一條毛毯嗎？"}, {"word": "Water bottle", "meaning": "水瓶", "icon": "🧴", "category": "旅行用品", "example": "Empty your water bottle before security.", "translation": "安檢前請把水瓶清空。"}, {"word": "Snack", "meaning": "點心", "icon": "🍪", "category": "旅行用品", "example": "I packed a snack for the flight.", "translation": "我帶了一份點心上飛機。"}, {"word": "Medicine", "meaning": "藥品", "icon": "💊", "category": "旅行用品", "example": "Keep your medicine in your carry-on bag.", "translation": "請把藥品放在隨身行李中。"}, {"word": "Umbrella", "meaning": "雨傘", "icon": "☂️", "category": "旅行用品", "example": "My umbrella is inside the suitcase.", "translation": "我的雨傘在行李箱裡。"}, {"word": "Camera", "meaning": "相機", "icon": "📷", "category": "旅行用品", "example": "I packed my camera carefully.", "translation": "我小心地收好相機。"}, {"word": "SIM card", "meaning": "SIM卡", "icon": "📱", "category": "旅行用品", "example": "I bought a local SIM card.", "translation": "我買了一張當地SIM卡。"}, {"word": "eSIM", "meaning": "電子SIM卡", "icon": "📲", "category": "旅行用品", "example": "I activated my eSIM before departure.", "translation": "我在出發前啟用了eSIM。"}, {"word": "Travel document", "meaning": "旅行文件", "icon": "📑", "category": "旅行用品", "example": "Keep all travel documents together.", "translation": "請把所有旅行文件放在一起。"}, {"word": "Luggage tag", "meaning": "行李吊牌", "icon": "🏷️", "category": "旅行用品", "example": "Write your name on the luggage tag.", "translation": "請在行李吊牌上寫名字。"}];
let favorites=JSON.parse(localStorage.getItem("airportFav")||"[]"),learned=JSON.parse(localStorage.getItem("airportLearn")||"[]"),current=[...words],quizWord;
const grid=document.getElementById("grid"),search=document.getElementById("search"),category=document.getElementById("category"),filter=document.getElementById("filter");
function save(){localStorage.setItem("airportFav",JSON.stringify(favorites));localStorage.setItem("airportLearn",JSON.stringify(learned));stats()}
function stats(){favStat.textContent="收藏 "+favorites.length;learnStat.textContent="已學會 "+learned.length}
function applyFilters(){let q=search.value.trim().toLowerCase();current=words.filter(x=>(!q||(x.word+" "+x.meaning).toLowerCase().includes(q))&&(!category.value||x.category===category.value)&&(!filter.value||(filter.value==="favorite"?favorites.includes(x.word):learned.includes(x.word))));render(current)}
function render(list){grid.innerHTML="";if(!list.length){grid.innerHTML='<div class="empty">找不到符合條件的單字。</div>';return}list.forEach((x,i)=>{let c=document.createElement("article");c.className="card";c.innerHTML=`<div class="visual">${x.icon}</div><div><div class="top"><h2 class="word">${x.word}</h2><span class="badge">${x.category}</span><button class="speak" data-s="${i}">🔊 發音</button><button class="iconbtn favorite ${favorites.includes(x.word)?"active":""}" data-f="${x.word}">⭐</button><button class="iconbtn ${learned.includes(x.word)?"active":""}" data-l="${x.word}">✔</button></div><p class="meaning">中文：${x.meaning}</p><div class="example"><p><b>例句：</b>${x.example}</p><p class="zh"><b>中文：</b>${x.translation}</p></div></div>`;grid.appendChild(c)});document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>speakOnce(list[+b.dataset.s].word,b));document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>toggle("f",b.dataset.f));document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>toggle("l",b.dataset.l))}
function toggle(t,w){let a=t==="f"?favorites:learned;a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();applyFilters()}
function speakOnce(t,b){if(!("speechSynthesis"in window)){alert("此瀏覽器不支援語音播放");return}speechSynthesis.cancel();document.querySelectorAll(".speak").forEach(x=>x.textContent="🔊 發音");let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang.startsWith("en"))||null;b.textContent="🔈 播放中";u.onend=u.onerror=()=>b.textContent="🔊 發音";speechSynthesis.speak(u)}
function stopSpeech(){if("speechSynthesis"in window)speechSynthesis.cancel();document.querySelectorAll(".speak").forEach(x=>x.textContent="🔊 發音")}
function shuffleCards(){current=[...current].sort(()=>Math.random()-.5);render(current)}
function openQuiz(){quizModal.classList.add("show");nextQuestion()}
function nextQuestion(){quizWord=words[Math.floor(Math.random()*words.length)];let opts=[quizWord,...words.filter(x=>x!==quizWord).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);quizBody.innerHTML=`<p>請選出正確中文：</p><div class="question">${quizWord.word}</div><div class="answers">${opts.map(o=>`<button class="answer" onclick="checkAnswer(this,'${o.word.replaceAll("'","\'")}')">${o.meaning}</button>`).join("")}</div>`}
function checkAnswer(b,w){document.querySelectorAll(".answer").forEach(x=>x.disabled=true);b.classList.add(w===quizWord.word?"correct":"wrong");if(w!==quizWord.word)[...document.querySelectorAll(".answer")].find(x=>x.textContent===quizWord.meaning)?.classList.add("correct")}
function openFlash(){flashModal.classList.add("show");nextFlash()}
function nextFlash(){let x=words[Math.floor(Math.random()*words.length)];flashBody.innerHTML=`<div class="flash"><div class="bigicon">${x.icon}</div><div class="bigword">${x.word}</div><button class="speak" onclick="speakOnce('${x.word.replaceAll("'","\'")}',this)">🔊 發音</button><div class="reveal" id="reveal"><h3>${x.meaning}</h3><p>${x.example}</p><p class="zh">${x.translation}</p></div></div>`}
function revealCard(){reveal?.classList.add("show")}function closeModal(id){document.getElementById(id).classList.remove("show");stopSpeech()}
search.oninput=applyFilters;category.onchange=applyFilters;filter.onchange=applyFilters;stats();render(words);
</script>
