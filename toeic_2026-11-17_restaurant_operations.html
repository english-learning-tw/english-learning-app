<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/17]主題餐廳服務與餐飲營運｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7fa;color:#173448;font-family:-apple-system,"PingFang TC",sans-serif}header{background:#176b83;color:white;padding:20px}main{max-width:960px;margin:auto;padding:15px}h1{font-size:clamp(21px,5vw,30px)}a{color:inherit}input{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #aac5d3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}.card{background:white;border-radius:15px;padding:17px;border:1px solid #d7e6ed}.word{font-size:23px;font-weight:800;color:#12677b}.ipa{color:#597482}.zh{font-weight:bold;margin:10px 0}.example{background:#eff6fa;padding:12px;border-radius:10px}.tr{color:#56717e;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:46px;border:0;border-radius:9px;background:#146c86;color:white;font-weight:bold}button.slow{background:#e4f1f5;color:#145c76}.back{display:inline-block;padding:10px;border:1px solid white;border-radius:8px}#status{margin:12px 0;color:#56717e}</style></head><body><header><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/17]主題餐廳服務與餐飲營運｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA　🔊 正常發音　🐢 慢速跟讀</p></header><main><input id="search" type="search" placeholder="搜尋英文、中文、例句"><p id="status"></p><button id="stop">⏹ 停止發音</button><section id="cards" class="grid"></section><p>語音由裝置 Web Speech API 提供，實際發音依系統語音而異。本教材非 ETS 官方字頻排名。</p></main><script>"use strict";const DATA=[{"en":"menu","ipa":"/ˈmen.juː/","zh":"菜單","icon":"📌","ex":"The manager updated the dinner menu.","tr":"經理更新了晚餐菜單。"},{"en":"appetizer","ipa":"/ˈæp.əˌtaɪ.zɚ/","zh":"開胃菜","icon":"💼","ex":"Each set meal includes an appetizer.","tr":"每份套餐都包含一道開胃菜。"},{"en":"entrée","ipa":"/ˈɑːn.treɪ/","zh":"主餐","icon":"📋","ex":"The salmon entrée is available tonight.","tr":"今晚供應鮭魚主餐。"},{"en":"beverage","ipa":"/ˈbev.ɚ.ɪdʒ/","zh":"飲料","icon":"🏢","ex":"The lunch special includes a beverage.","tr":"午餐特餐附贈一杯飲料。"},{"en":"buffet","ipa":"/bəˈfeɪ/","zh":"自助餐","icon":"🧾","ex":"The breakfast buffet opens at six.","tr":"早餐自助餐六點開始供應。"},{"en":"cuisine","ipa":"/kwɪˈziːn/","zh":"菜系","icon":"🔎","ex":"The restaurant specializes in French cuisine.","tr":"這間餐廳專營法式料理。"},{"en":"chef","ipa":"/ʃef/","zh":"主廚","icon":"📈","ex":"The chef designed a seasonal menu.","tr":"主廚設計了季節限定菜單。"},{"en":"waiter","ipa":"/ˈweɪ.t̬ɚ/","zh":"服務生","icon":"🤝","ex":"The waiter explained the daily specials.","tr":"服務生介紹了每日特餐。"},{"en":"ingredient","ipa":"/ɪnˈɡriː.di.ənt/","zh":"食材","icon":"💳","ex":"Fresh ingredients arrive every morning.","tr":"新鮮食材每天早上送達。"},{"en":"allergy","ipa":"/ˈæl.ɚ.dʒi/","zh":"過敏","icon":"📝","ex":"Please tell us about any food allergy.","tr":"請告訴我們是否有食物過敏。"},{"en":"vegetarian","ipa":"/ˌvedʒ.əˈter.i.ən/","zh":"素食的","icon":"📌","ex":"We offer three vegetarian dishes.","tr":"我們提供三道素食料理。"},{"en":"portion","ipa":"/ˈpɔːr.ʃən/","zh":"份量","icon":"💼","ex":"Each portion serves one person.","tr":"每份餐點供一人食用。"},{"en":"garnish","ipa":"/ˈɡɑːr.nɪʃ/","zh":"餐點裝飾","icon":"📋","ex":"The chef added herbs as a garnish.","tr":"主廚加上香草作為餐點裝飾。"},{"en":"gratuity","ipa":"/ɡrəˈtuː.ə.t̬i/","zh":"小費","icon":"🏢","ex":"A gratuity is included for large groups.","tr":"大型團體的帳單已包含小費。"},{"en":"check","ipa":"/tʃek/","zh":"帳單","icon":"🧾","ex":"Could you bring us the check?","tr":"可以幫我們送來帳單嗎？"},{"en":"refill","ipa":"/ˈriː.fɪl/","zh":"續杯","icon":"🔎","ex":"Coffee refills are free before noon.","tr":"中午前咖啡可免費續杯。"},{"en":"takeout","ipa":"/ˈteɪk.aʊt/","zh":"外帶","icon":"📈","ex":"Takeout orders are ready at the counter.","tr":"外帶訂單已在櫃檯備妥。"},{"en":"dine-in","ipa":"/ˈdaɪn.ɪn/","zh":"內用的","icon":"🤝","ex":"This offer applies to dine-in orders.","tr":"這項優惠適用於內用訂單。"},{"en":"tableware","ipa":"/ˈteɪ.bəl.wer/","zh":"餐具","icon":"💳","ex":"Staff must clean the tableware thoroughly.","tr":"員工必須徹底清潔餐具。"},{"en":"waitlist","ipa":"/ˈweɪt.lɪst/","zh":"候位名單","icon":"📝","ex":"Your name is now on the waitlist.","tr":"你的名字已列入候位名單。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis;function speak(t,slow){if(!s){$("status").textContent="瀏覽器不支援發音";return}s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;const vs=s.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;s.speak(u)}function el(tag,cls,t){const n=document.createElement(tag);n.className=cls;if(t!==undefined)n.textContent=t;return n}function btn(label,t,slow){const b=el("button",slow?"slow":"",label);b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.toLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),frag=document.createDocumentFragment();for(const x of items){const c=el("article","card"),ex=el("div","example"),bs=el("div","buttons");ex.append(el("div","",x.ex),el("div","tr",x.tr));bs.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(el("div","word",x.icon+" "+x.en),el("div","ipa",x.ipa),el("div","zh",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+items.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>s?.cancel();render();</script></body></html>
