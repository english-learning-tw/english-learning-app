<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b83"><title>[11/20]主題保險理賠與風險管理｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7fa;color:#173448;font-family:-apple-system,"PingFang TC",sans-serif}header{background:#176b83;color:white;padding:20px}main{max-width:960px;margin:auto;padding:15px}h1{font-size:clamp(21px,5vw,30px)}a{color:inherit}input{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #aac5d3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}.card{background:white;border-radius:15px;padding:17px;border:1px solid #d7e6ed}.word{font-size:23px;font-weight:800;color:#12677b}.ipa{color:#597482}.zh{font-weight:bold;margin:10px 0}.example{background:#eff6fa;padding:12px;border-radius:10px}.tr{color:#56717e;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:46px;border:0;border-radius:9px;background:#146c86;color:white;font-weight:bold}button.slow{background:#e4f1f5;color:#145c76}.back{display:inline-block;padding:10px;border:1px solid white;border-radius:8px}#status{margin:12px 0;color:#56717e}</style></head><body><header><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>🛡️ [11/20]主題保險理賠與風險管理｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA　🔊 正常發音　🐢 慢速跟讀</p></header><main><input id="search" type="search" placeholder="搜尋英文、中文、例句"><p id="status"></p><button id="stop">⏹ 停止發音</button><section id="cards" class="grid"></section><p>語音由裝置 Web Speech API 提供，實際發音依系統語音而異。本教材非 ETS 官方字頻排名。</p></main><script>"use strict";const DATA=[{"en":"policyholder","ipa":"/ˈpɑː.lə.siˌhoʊl.dɚ/","zh":"保單持有人","ex":"The policyholder must notify the insurer of any address change.","tr":"保單持有人必須通知保險公司任何地址變更。","icon":"📄"},{"en":"premium","ipa":"/ˈpriː.mi.əm/","zh":"保險費","ex":"The annual premium is due at the end of this month.","tr":"年度保險費將於本月底到期。","icon":"💳"},{"en":"coverage","ipa":"/ˈkʌv.ɚ.ɪdʒ/","zh":"保險保障範圍","ex":"The policy provides coverage for accidental damage.","tr":"這份保單提供意外損壞的保障。","icon":"🛡️"},{"en":"deductible","ipa":"/dɪˈdʌk.tə.bəl/","zh":"自負額","ex":"The customer must pay a deductible before receiving reimbursement.","tr":"客戶必須先支付自負額才能獲得補償。","icon":"💰"},{"en":"claimant","ipa":"/ˈkleɪ.mənt/","zh":"理賠申請人","ex":"The claimant submitted all required documents.","tr":"理賠申請人已提交所有必要文件。","icon":"👤"},{"en":"underwriter","ipa":"/ˈʌn.dɚˌraɪ.t̬ɚ/","zh":"核保人員","ex":"The underwriter reviewed the applicant's medical history.","tr":"核保人員審查了申請人的病史。","icon":"🔍"},{"en":"liability","ipa":"/ˌlaɪ.əˈbɪl.ə.t̬i/","zh":"法律責任","ex":"The contract limits the company's liability for delays.","tr":"合約限制公司對延誤所負的法律責任。","icon":"⚖️"},{"en":"exclusion","ipa":"/ɪkˈskluː.ʒən/","zh":"除外責任條款","ex":"Flood damage is listed as an exclusion in this policy.","tr":"這份保單將洪水損害列為除外責任。","icon":"🚫"},{"en":"beneficiary","ipa":"/ˌben.əˈfɪʃ.i.er.i/","zh":"受益人","ex":"The beneficiary will receive payment after the claim is approved.","tr":"理賠核准後，受益人將收到給付。","icon":"👥"},{"en":"endorsement","ipa":"/ɪnˈdɔːrs.mənt/","zh":"保單批單；附加條款","ex":"The insurer issued an endorsement to update the coverage.","tr":"保險公司簽發批單以更新保障範圍。","icon":"📝"},{"en":"insurer","ipa":"/ɪnˈʃʊr.ɚ/","zh":"保險公司","ex":"The insurer requested additional evidence of the loss.","tr":"保險公司要求提供額外的損失證明。","icon":"🏢"},{"en":"policy limit","ipa":"/ˈpɑː.lə.si ˈlɪm.ɪt/","zh":"保單給付上限","ex":"The repair cost exceeds the policy limit.","tr":"修理費用超過保單給付上限。","icon":"📊"},{"en":"risk assessment","ipa":"/rɪsk əˈses.mənt/","zh":"風險評估","ex":"The company conducts a risk assessment before opening a new site.","tr":"公司在啟用新據點前會進行風險評估。","icon":"📋"},{"en":"loss adjuster","ipa":"/lɔːs əˈdʒʌs.tɚ/","zh":"理賠損失理算員","ex":"A loss adjuster inspected the damaged warehouse.","tr":"損失理算員檢查了受損倉庫。","icon":"🏭"},{"en":"settlement","ipa":"/ˈset̬.əl.mənt/","zh":"理賠和解金；結算","ex":"Both parties agreed on a settlement amount.","tr":"雙方同意了理賠和解金額。","icon":"🤝"},{"en":"fraudulent","ipa":"/ˈfrɑː.dʒə.lənt/","zh":"詐欺的；虛假的","ex":"The insurer investigated a potentially fraudulent claim.","tr":"保險公司調查了一件可能涉及詐欺的理賠申請。","icon":"⚠️"},{"en":"renewable","ipa":"/rɪˈnuː.ə.bəl/","zh":"可續保的","ex":"This policy is renewable each year.","tr":"這份保單每年都可以續保。","icon":"🔄"},{"en":"lapse","ipa":"/læps/","zh":"（保單）失效","ex":"The policy may lapse if the premium is not paid.","tr":"若未繳納保費，保單可能失效。","icon":"⌛"},{"en":"indemnity","ipa":"/ɪnˈdem.nə.t̬i/","zh":"損害補償；賠償","ex":"The agreement includes an indemnity clause.","tr":"這份協議包含損害補償條款。","icon":"📜"},{"en":"actuary","ipa":"/ˈæk.tʃu.er.i/","zh":"精算師","ex":"The actuary analyzed historical claim data.","tr":"精算師分析了歷史理賠資料。","icon":"🧮"}];const $=id=>document.getElementById(id),s=window.speechSynthesis;function speak(t,slow){if(!s){$("status").textContent="瀏覽器不支援發音";return}s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;const vs=s.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;s.speak(u)}function el(tag,cls,t){const n=document.createElement(tag);n.className=cls;if(t!==undefined)n.textContent=t;return n}function btn(label,t,slow){const b=el("button",slow?"slow":"",label);b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.toLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),frag=document.createDocumentFragment();for(const x of items){const c=el("article","card"),ex=el("div","example"),bs=el("div","buttons");ex.append(el("div","",x.ex),el("div","tr",x.tr));bs.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(el("div","word",x.icon+" "+x.en),el("div","ipa",x.ipa),el("div","zh",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+items.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>s?.cancel();render();</script></body></html>
