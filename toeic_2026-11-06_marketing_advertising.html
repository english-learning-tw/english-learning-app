<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17607a"><meta name="description" content="11/06 多益市場行銷與廣告推廣20個英文單字：美式IPA、中英文例句、正常及慢速發音、搜尋"><title>[11/06]主題市場行銷與廣告推廣｜多益高頻英文20單字</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#1a3443;background:#f1f7fa}*{box-sizing:border-box}body{margin:0;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(115deg,#16415d,#197f8d);padding:22px 16px 26px;color:white}.wrap{max-width:1080px;margin:0 auto}h1{font-size:clamp(22px,5vw,31px);line-height:1.4;margin:12px 0}header p{font-size:14px;color:#e1f4f8;margin:0}.back{display:inline-flex;align-items:center;color:white;font-size:15px;font-weight:700;border:1px solid #ffffff99;border-radius:10px;min-height:44px;padding:9px 12px;text-decoration:none}main{padding:18px 14px 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px;border-radius:15px;background:white;border:1px solid #dce9ee}.search{flex:1;min-width:190px;font-size:16px;padding:11px 13px;min-height:48px;border-radius:10px;border:1px solid #aac8d4}.stop{min-height:48px;background:#e8f4f7;color:#1a5a70;border:1px solid #bcd5df;border-radius:10px;padding:9px 14px;font-weight:700}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffa834;outline-offset:2px}.status{font-size:14px;color:#496e7f;margin:12px 4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,315px),1fr));gap:14px}.card{background:white;border:1px solid #d8e7ec;border-radius:17px;padding:17px;box-shadow:0 4px 15px #16334d0b}.head{display:flex;align-items:center;gap:12px}.emoji{display:grid;place-items:center;font-size:29px;background:#e8f6f7;border-radius:13px;width:57px;height:57px;flex:none}.word{font-size:23px;color:#126b86;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:15px;color:#537582}.meaning{font-size:16px;font-weight:750;margin:12px 0 10px}.example{background:#f5f9fb;border:1px solid #e2edf0;border-radius:12px;padding:12px}.english{font-size:15px;line-height:1.7}.traditional{font-size:14px;color:#4d7080;line-height:1.65;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.audio{min-height:46px;background:#17718f;border:0;border-radius:11px;color:white;font-weight:700;font-size:14px;padding:8px 4px}.audio.slow{background:#e7f3f8;color:#1c627a;border:1px solid #b5d4df}.empty{padding:40px 10px;text-align:center;color:#557789}footer{text-align:center;color:#5a7885;font-size:12px;padding:25px 5px}@media(max-width:355px){.card{padding:14px}.word{font-size:21px}.audio{font-size:13px}}
</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/06]主題市場行銷與廣告推廣｜多益高頻英文20單字</h1><p>📣 20 個行銷英文單字｜🔊 美式發音｜🐢 慢速跟讀｜📱 iPhone 友善</p></div></header><main class="wrap"><section class="toolbar" aria-label="教材搜尋"><input id="search" class="search" type="search" placeholder="搜尋英文、中文或例句…" aria-label="搜尋英文單字、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></section><div id="status" class="status" role="status" aria-live="polite">共 20 個單字，點選發音按鈕即可練習。</div><section id="cards" class="grid" aria-label="多益行銷英文單字"></section><p id="empty" class="empty" hidden>找不到相符單字，請更換搜尋文字。</p><footer>本教材使用裝置內建 Web Speech API。實際音色依 iPhone 與瀏覽器可用的美式英語語音而定。</footer></main><script>
"use strict";
const DATA=[{"en":"campaign","ipa":"/kæmˈpeɪn/","zh":"行銷活動；宣傳活動","icon":"📣","ex":"The company launched a new advertising campaign ahead of the holiday season.","tr":"公司在假期旺季前推出新的廣告宣傳活動。"},{"en":"advertisement","ipa":"/ˌædvɚˈtaɪzmənt/","zh":"廣告","icon":"📰","ex":"The advertisement will appear in several business magazines next month.","tr":"這則廣告下個月將刊登在數本商業雜誌上。"},{"en":"audience","ipa":"/ˈɑːdiəns/","zh":"目標受眾；觀眾","icon":"👥","ex":"Our target audience consists mainly of small-business owners.","tr":"我們的目標受眾主要是小型企業經營者。"},{"en":"demographic","ipa":"/ˌdeməˈɡræfɪk/","zh":"人口族群；人口統計群體","icon":"📊","ex":"The survey identified a younger demographic interested in the product.","tr":"調查發現較年輕的族群對這項產品感興趣。"},{"en":"branding","ipa":"/ˈbrændɪŋ/","zh":"品牌塑造；品牌識別","icon":"🎨","ex":"Consistent branding helps customers recognize the company.","tr":"一致的品牌形象有助於顧客辨識這家公司。"},{"en":"slogan","ipa":"/ˈsloʊɡən/","zh":"廣告標語；口號","icon":"💬","ex":"The marketing team selected a shorter slogan for the new product.","tr":"行銷團隊為新產品選用了較短的廣告標語。"},{"en":"brochure","ipa":"/broʊˈʃʊr/","zh":"宣傳手冊；摺頁","icon":"📖","ex":"Please place the updated brochures near the entrance to the exhibition hall.","tr":"請將更新後的宣傳手冊放在展覽館入口附近。"},{"en":"catalog","ipa":"/ˈkætəlɔːɡ/","zh":"產品目錄","icon":"📚","ex":"The new catalog lists prices for all office equipment.","tr":"新的產品目錄列出了所有辦公設備的價格。"},{"en":"sponsor","ipa":"/ˈspɑːnsɚ/","zh":"贊助；贊助商","icon":"🤝","ex":"A local bank agreed to sponsor the annual trade fair.","tr":"一家當地銀行同意贊助年度商展。"},{"en":"endorsement","ipa":"/ɪnˈdɔːrsmənt/","zh":"代言；公開支持","icon":"🌟","ex":"The athlete's endorsement increased interest in the sportswear brand.","tr":"這位運動員的代言提高了大眾對該運動服飾品牌的興趣。"},{"en":"launch","ipa":"/lɔːntʃ/","zh":"上市；推出","icon":"🚀","ex":"The product launch has been scheduled for next Tuesday.","tr":"產品上市活動已排定在下週二舉行。"},{"en":"survey","ipa":"/ˈsɜːrveɪ/","zh":"問卷調查","icon":"📝","ex":"We will conduct a customer survey after the event.","tr":"活動結束後，我們將進行顧客問卷調查。"},{"en":"respondent","ipa":"/rɪˈspɑːndənt/","zh":"問卷受訪者；回答者","icon":"🙋","ex":"More than three hundred respondents completed the online questionnaire.","tr":"超過三百位受訪者完成了線上問卷。"},{"en":"consumer","ipa":"/kənˈsuːmɚ/","zh":"消費者","icon":"🛒","ex":"Consumer preferences have changed significantly over the past year.","tr":"過去一年消費者的偏好已有顯著改變。"},{"en":"competitor","ipa":"/kəmˈpetətɚ/","zh":"競爭對手","icon":"🏬","ex":"Our main competitor recently opened two additional stores.","tr":"我們的主要競爭對手最近又開了兩家分店。"},{"en":"demand","ipa":"/dɪˈmænd/","zh":"需求","icon":"📈","ex":"Demand for energy-efficient appliances remained strong this quarter.","tr":"本季市場對節能家電的需求依然強勁。"},{"en":"outreach","ipa":"/ˈaʊtriːtʃ/","zh":"拓展接觸；推廣聯繫","icon":"📨","ex":"The sales team expanded its outreach to clients in other regions.","tr":"業務團隊擴大與其他地區客戶的聯繫。"},{"en":"publicity","ipa":"/pʌˈblɪsəti/","zh":"媒體曝光；宣傳報導","icon":"📺","ex":"The charity event received positive publicity in local newspapers.","tr":"這場慈善活動獲得當地報紙正面的宣傳報導。"},{"en":"exposure","ipa":"/ɪkˈspoʊʒɚ/","zh":"曝光度","icon":"👀","ex":"The company increased its online exposure by posting weekly videos.","tr":"公司透過每週發布影片提高網路曝光度。"},{"en":"engagement","ipa":"/ɪnˈɡeɪdʒmənt/","zh":"互動參與度","icon":"❤️","ex":"The social media team measured engagement with the promotional posts.","tr":"社群媒體團隊衡量了宣傳貼文的互動參與度。"}];
const el=id=>document.getElementById(id);
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){if(synth)voices=synth.getVoices()}
if(synth){loadVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",loadVoices)}
function speak(text,slow){
 if(!synth||typeof SpeechSynthesisUtterance==="undefined"){el("status").textContent="此瀏覽器不支援語音播放；請使用 iPhone Safari。";return}
 synth.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.97;u.pitch=1;
 const v=voices.find(v=>v.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;
 u.onstart=()=>{el("status").textContent="正在播放"+(slow?"慢速":"正常")+"美式英語…"};
 u.onend=()=>{el("status").textContent="播放完成，可再次點選發音"};
 u.onerror=()=>{el("status").textContent="語音播放失敗，請檢查音量或改用 Safari"};
 synth.speak(u);
}
function n(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function audio(label,text,slow){const b=n("button","audio"+(slow?" slow":""),label);b.type="button";b.setAttribute("aria-label",label+"："+text);b.addEventListener("click",()=>speak(text,slow));return b}
function render(){
 const q=el("search").value.trim().toLocaleLowerCase();
 const words=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(t=>t.toLocaleLowerCase().includes(q)));
 const frag=document.createDocumentFragment();
 for(const x of words){
  const card=n("article","card"),head=n("div","head"),info=n("div");
  info.append(n("div","word",x.en),n("div","ipa",x.ipa));
  head.append(n("div","emoji",x.icon),info);
  const ex=n("div","example");ex.append(n("div","english",x.ex),n("div","traditional",x.tr));
  const buttons=n("div","actions");
  buttons.append(audio("🔊 單字",x.en,false),audio("🐢 單字慢速",x.en,true),audio("🔊 例句",x.ex,false),audio("🐢 例句慢速",x.ex,true));
  card.append(head,n("div","meaning",x.zh),ex,buttons);frag.append(card);
 }
 el("cards").replaceChildren(frag);el("empty").hidden=words.length!==0;
 el("status").textContent="顯示 "+words.length+" / "+DATA.length+" 個單字";
}
el("search").addEventListener("input",render);
el("stop").addEventListener("click",()=>{if(synth)synth.cancel();el("status").textContent="已停止發音"});
render();
</script></body></html>
