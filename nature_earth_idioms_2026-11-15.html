<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自然與天地英文片語｜圖片教材整理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f4f8f6;color:#183c35}*{box-sizing:border-box}body{margin:0;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(125deg,#16483b,#2c7763);color:white;padding:22px 16px}main,.wrap{max-width:1060px;margin:auto}main{padding:16px}h1{font-size:clamp(23px,5vw,32px);margin:14px 0}.back{color:white;border:1px solid #c4ded1;padding:10px 13px;border-radius:10px;display:inline-block;text-decoration:none}.tools{display:flex;gap:10px;flex-wrap:wrap}input,select{font:inherit;font-size:16px;padding:12px;border:1px solid #aac8b9;border-radius:10px;min-width:170px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:15px}.card{background:white;border:1px solid #dce9e2;border-radius:16px;padding:16px}.badge{font-size:12px;color:#32765d}.en{font-size:20px;font-weight:800;color:#17664d;margin:8px 0}.zh{font-size:16px;font-weight:700}.ex{background:#f0f7f3;border-radius:10px;padding:12px;margin:12px 0;line-height:1.6}.tr{color:#536e63;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{cursor:pointer;min-height:44px;border:0;border-radius:9px;background:#176b53;color:white;font-weight:700;padding:8px}.slow{background:#e5f3eb;color:#145a46;border:1px solid #bdd9c9}#status{color:#4a6a5b}footer{text-align:center;color:#58766b;font-size:12px;padding:25px}</style></head><body><header><div class="wrap"><a href="./index.html" class="back">← 返回 English Learning App</a><h1>🌦️ 自然與天地英文片語</h1><p>依照上傳書頁整理｜58 個片語｜英文發音・慢速跟讀・中英例句</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋英文或中文片語"><select id="category"><option value="">全部主題</option><option>暴風雷電</option><option>日月星辰</option><option>自然與天氣</option><option>冰雪</option><option>山丘</option><option>大地</option><option>陸地</option><option>海洋</option><option>天空</option></select></div><p id="status" aria-live="polite"></p><button id="stop" type="button">⏹ 停止發音</button><section class="grid" id="cards"></section><footer>片語及中文意思依照使用者提供的書頁整理；例句為新編教學例句。部分片語含省略號或可替換代名詞，實際發音採自然完整例句。</footer></main><script>"use strict";const DATA=[{"category":"暴風雷電","en":"make a tempest / storm in a teacup","zh":"小題大作","ex":"The team made a storm in a teacup over a minor typo.","tr":"團隊為一個小錯字小題大作。","icon":"⛈️"},{"category":"暴風雷電","en":"storm into / out of","zh":"氣沖沖地進入／離開","ex":"He stormed out of the meeting after the argument.","tr":"爭論後他氣沖沖地離開會議。","icon":"⛈️"},{"category":"暴風雷電","en":"take ... by storm","zh":"橫掃；席捲","ex":"The new product took the market by storm.","tr":"新產品迅速席捲市場。","icon":"⛈️"},{"category":"暴風雷電","en":"the eye of the storm","zh":"風暴中心；爭議核心","ex":"The manager was in the eye of the storm during the crisis.","tr":"危機期間經理處於風暴中心。","icon":"⛈️"},{"category":"暴風雷電","en":"up a storm","zh":"起勁地；熱烈地","ex":"The guests were chatting up a storm at the reception.","tr":"賓客在招待會上聊得十分熱絡。","icon":"⛈️"},{"category":"暴風雷電","en":"weather the storm","zh":"撐過難關","ex":"The company weathered the storm without laying off staff.","tr":"公司在沒有裁員的情況下撐過難關。","icon":"⛈️"},{"category":"暴風雷電","en":"a bolt out of the blue","zh":"晴天霹靂","ex":"The sudden closure came as a bolt out of the blue.","tr":"突然停業的消息令人震驚。","icon":"⛈️"},{"category":"暴風雷電","en":"steal one's thunder","zh":"搶走某人的風采","ex":"The early announcement stole the speaker's thunder.","tr":"提前公布消息搶走了演講者的風采。","icon":"⛈️"},{"category":"日月星辰","en":"everything under the sun","zh":"所有想得到的事物","ex":"The shop sells everything under the sun.","tr":"這間店幾乎什麼都賣。","icon":"🌞"},{"category":"日月星辰","en":"make hay while the sun shines","zh":"把握時機","ex":"We should make hay while the sun shines and finish the project.","tr":"我們應把握時機完成專案。","icon":"🌞"},{"category":"日月星辰","en":"ride off into the sunset","zh":"功成身退；結束","ex":"After selling the business, the founder rode off into the sunset.","tr":"出售公司後，創辦人功成身退。","icon":"🌞"},{"category":"日月星辰","en":"place in the sun","zh":"一席之地","ex":"The startup finally found its place in the sun.","tr":"這家新創公司終於找到一席之地。","icon":"🌞"},{"category":"日月星辰","en":"the sun won't be setting on","zh":"氣勢興旺；如日中天","ex":"The firm hopes the sun won't be setting on its overseas operations.","tr":"公司希望海外業務持續興旺。","icon":"🌞"},{"category":"日月星辰","en":"once in a blue moon","zh":"千載難逢；極少","ex":"Our director visits this branch once in a blue moon.","tr":"我們的主管極少造訪這間分店。","icon":"🌞"},{"category":"日月星辰","en":"over the moon","zh":"欣喜若狂","ex":"She was over the moon about her promotion.","tr":"她對升遷感到欣喜若狂。","icon":"🌞"},{"category":"日月星辰","en":"aim for the stars","zh":"立定志向；追求高目標","ex":"The coach encouraged us to aim for the stars.","tr":"教練鼓勵我們追求遠大目標。","icon":"🌞"},{"category":"日月星辰","en":"reach for the stars","zh":"心比天高；追求理想","ex":"Our team is ready to reach for the stars.","tr":"我們團隊準備好追求遠大理想。","icon":"🌞"},{"category":"自然與天氣","en":"answer nature's call","zh":"上廁所","ex":"Excuse me; I need to answer nature's call.","tr":"不好意思，我需要去一下洗手間。","icon":"🌿"},{"category":"自然與天氣","en":"by one's nature","zh":"就本性而言","ex":"She is cautious by nature.","tr":"她天性謹慎。","icon":"🌿"},{"category":"自然與天氣","en":"get back to nature","zh":"回歸自然","ex":"We spent the weekend hiking to get back to nature.","tr":"我們週末去健行，親近大自然。","icon":"🌿"},{"category":"自然與天氣","en":"let nature take its course","zh":"順其自然","ex":"The doctor advised us to let nature take its course.","tr":"醫師建議我們順其自然。","icon":"🌿"},{"category":"自然與天氣","en":"second nature","zh":"第二天性；習慣","ex":"Checking every detail is second nature to her.","tr":"仔細檢查每個細節已成為她的習慣。","icon":"🌿"},{"category":"自然與天氣","en":"fair-weather friends","zh":"酒肉朋友","ex":"He discovered who his fair-weather friends were during the downturn.","tr":"在低潮時，他才發現誰是酒肉朋友。","icon":"🌿"},{"category":"自然與天氣","en":"under the weather","zh":"身體不舒服","ex":"I'm feeling under the weather, so I'll work from home.","tr":"我今天不太舒服，因此會在家工作。","icon":"🌿"},{"category":"冰雪","en":"be snowed under","zh":"忙得不可開交","ex":"We're snowed under with orders this week.","tr":"我們這週訂單多得忙不過來。","icon":"❄️"},{"category":"冰雪","en":"snow ... in","zh":"大雪困住","ex":"The storm snowed the travelers in overnight.","tr":"暴風雪讓旅客受困一整夜。","icon":"❄️"},{"category":"冰雪","en":"snow job","zh":"騙局；花言巧語","ex":"The sales pitch was just a snow job.","tr":"那套銷售說詞只是花言巧語。","icon":"❄️"},{"category":"冰雪","en":"break the ice","zh":"打破沉默；打破隔閡","ex":"The host told a joke to break the ice.","tr":"主持人說了個笑話來打破尷尬。","icon":"❄️"},{"category":"冰雪","en":"skate on thin ice","zh":"如履薄冰","ex":"The company is skating on thin ice with its late payments.","tr":"公司持續延遲付款，處境相當危險。","icon":"❄️"},{"category":"冰雪","en":"put ... on ice","zh":"暫緩進行某事","ex":"We put the expansion plan on ice until next year.","tr":"我們將擴張計畫暫緩到明年。","icon":"❄️"},{"category":"冰雪","en":"sell ice to the Eskimos","zh":"口若懸河；銷售能力強","ex":"She could sell ice to the Eskimos.","tr":"她的銷售能力非常出色。","icon":"❄️"},{"category":"冰雪","en":"the tip of the iceberg","zh":"冰山一角","ex":"The reported defects may be the tip of the iceberg.","tr":"已通報的瑕疵可能只是冰山一角。","icon":"❄️"},{"category":"山丘","en":"move mountains","zh":"竭盡全力；克服萬難","ex":"The volunteers moved mountains to finish on time.","tr":"志工們竭盡全力準時完成。","icon":"⛰️"},{"category":"山丘","en":"over the hill","zh":"年華老去；過了巔峰","ex":"He jokes that he's over the hill at fifty.","tr":"他開玩笑說五十歲已過了巔峰。","icon":"⛰️"},{"category":"山丘","en":"make a mountain out of a molehill","zh":"小題大作","ex":"Don't make a mountain out of a molehill over one complaint.","tr":"不要為了一件客訴小題大作。","icon":"⛰️"},{"category":"山丘","en":"run for the hills","zh":"趕緊逃離；尋求安全","ex":"Investors ran for the hills after the announcement.","tr":"消息公布後投資人紛紛撤離。","icon":"⛰️"},{"category":"大地","en":"come down to earth","zh":"回到現實；回歸實際","ex":"After the celebration, we had to come down to earth.","tr":"慶祝結束後，我們必須回到現實。","icon":"🌍"},{"category":"大地","en":"hell on earth","zh":"人間煉獄","ex":"The crowded shelter felt like hell on earth.","tr":"擁擠的收容所宛如人間煉獄。","icon":"🌍"},{"category":"大地","en":"on earth","zh":"究竟；到底","ex":"Why on earth was the order canceled?","tr":"那筆訂單究竟為什麼被取消？","icon":"🌍"},{"category":"陸地","en":"keep one's feet on the ground","zh":"腳踏實地","ex":"Even after her success, she keeps her feet on the ground.","tr":"即使成功了，她仍然腳踏實地。","icon":"🏜️"},{"category":"陸地","en":"from the ground up","zh":"從零開始","ex":"They built the business from the ground up.","tr":"他們從零開始創立這家公司。","icon":"🏜️"},{"category":"陸地","en":"on the ground","zh":"在現場","ex":"Our staff on the ground will handle the event.","tr":"我們在現場的員工會處理活動事宜。","icon":"🏜️"},{"category":"陸地","en":"drag somebody through the mud","zh":"使某人名譽掃地","ex":"The false story dragged the executive through the mud.","tr":"不實報導使那位主管名譽受損。","icon":"🏜️"},{"category":"陸地","en":"bury one's head in the sand","zh":"鴕鳥心態","ex":"We cannot bury our heads in the sand about rising costs.","tr":"我們不能對成本上升視而不見。","icon":"🏜️"},{"category":"陸地","en":"done and dusted","zh":"大功告成","ex":"The contract is signed, so the deal is done and dusted.","tr":"合約已簽妥，交易大功告成。","icon":"🏜️"},{"category":"陸地","en":"leave in the dust","zh":"遠遠超越","ex":"The new model left its competitors in the dust.","tr":"新機型遠遠超越競爭對手。","icon":"🏜️"},{"category":"陸地","en":"let the dust settle","zh":"待塵埃落定","ex":"Let's wait for the dust to settle before deciding.","tr":"我們等情況明朗後再做決定。","icon":"🏜️"},{"category":"海洋","en":"ebb and flow","zh":"消長盛衰；退潮和漲潮","ex":"Sales ebb and flow throughout the year.","tr":"銷售量一年之中有高有低。","icon":"🌊"},{"category":"海洋","en":"make waves","zh":"興風作浪；掀起風潮","ex":"The new policy is making waves in the industry.","tr":"新政策在業界掀起波瀾。","icon":"🌊"},{"category":"海洋","en":"ride the wave","zh":"乘勢而起","ex":"The brand rode the wave of online shopping.","tr":"品牌順勢搭上網購熱潮。","icon":"🌊"},{"category":"海洋","en":"send shock waves through","zh":"帶來巨大的衝擊","ex":"The merger sent shock waves through the market.","tr":"這樁合併案震撼了市場。","icon":"🌊"},{"category":"海洋","en":"tide somebody over","zh":"幫某人撐過困難時期","ex":"The short-term loan will tide us over until payday.","tr":"短期貸款能幫我們撐到發薪日。","icon":"🌊"},{"category":"海洋","en":"turn the tide","zh":"扭轉局勢","ex":"The new strategy helped turn the tide.","tr":"新策略有助於扭轉局勢。","icon":"🌊"},{"category":"天空","en":"the sky is the limit","zh":"沒有極限；前途無量","ex":"With these resources, the sky is the limit.","tr":"有了這些資源，未來發展無可限量。","icon":"☁️"},{"category":"天空","en":"cloud one's judgment","zh":"蒙蔽判斷力","ex":"Stress can cloud your judgment.","tr":"壓力可能影響你的判斷。","icon":"☁️"},{"category":"天空","en":"every cloud has a silver lining","zh":"守得雲開見月明；天無絕人之路","ex":"The delay gave us time to improve; every cloud has a silver lining.","tr":"延誤讓我們有時間改善，凡事總有好的一面。","icon":"☁️"},{"category":"天空","en":"head in the clouds","zh":"做白日夢；胡思亂想","ex":"He has his head in the clouds instead of focusing on work.","tr":"他不專心工作，反而一直做白日夢。","icon":"☁️"},{"category":"天空","en":"on cloud nine","zh":"十分高興；樂不可支","ex":"She was on cloud nine after receiving the offer.","tr":"收到錄取通知後，她高興極了。","icon":"☁️"}];const $=id=>document.getElementById(id);const syn=window.speechSynthesis;let voices=[];function load(){if(syn)voices=syn.getVoices()}load();if(syn)syn.addEventListener("voiceschanged",load);function say(t,slow){if(!syn){$("status").textContent="裝置不支援語音朗讀";return}syn.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.66:.97;u.voice=voices.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;u.onerror=()=>{$("status").textContent="播放失敗，請改用 Safari"};syn.speak(u)}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function btn(label,txt,slow){const b=el("button",slow?"slow":"",label);b.type="button";b.onclick=()=>say(txt,slow);return b}function render(){const q=$("search").value.trim().toLowerCase(),cat=$("category").value;const items=DATA.filter(x=>(!cat||x.category===cat)&&[x.en,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q)));const frag=document.createDocumentFragment();for(const x of items){const c=el("article","card"),ex=el("div","ex"),bs=el("div","buttons");ex.append(el("div","",x.ex),el("div","tr",x.tr));bs.append(btn("🔊 片語",x.en.replace(/\.\.\./g,"something").replace(/somebody/g,"someone").replace(/one's/g,"your"),false),btn("🐢 片語慢速",x.en.replace(/\.\.\./g,"something").replace(/somebody/g,"someone").replace(/one's/g,"your"),true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(el("div","badge",x.icon+" "+x.category),el("div","en",x.en),el("div","zh",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+items.length+" / "+DATA.length+" 個片語"}$("search").addEventListener("input",render);$("category").addEventListener("change",render);$("stop").onclick=()=>{if(syn)syn.cancel()};render();</script></body></html>
