ocument.getElementById('cat'),status=document.getElementById('status'),grid=document.getElementById('grid'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');[...new Set(words.map(x=>x.category))].forEach(x=>cat.insertAdjacentHTML('beforeend',`<option>${x}</option>`));function stats(){favCount.textContent='收藏 '+fav.length;learnCount.textContent='已學會 '+learn.length}function save(){localStorage.setItem('homeequip150Fav',JSON.stringify(fav));localStorage.setItem('homeequip150Learn',JSON.stringify(learn));stats()}function speak(t){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援發音');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function filter(){let s=q.value.toLowerCase().trim();shown=words.filter(x=>(!s||(x.word+' '+x.zh+' '+x.category).toLowerCase().includes(s))&&(!cat.value||x.category===cat.value)&&(!status.value||(status.value==='fav'?fav.includes(x.word):learn.includes(x.word))));render(shown)}function render(list){grid.innerHTML='';if(!list.length){grid.innerHTML="<div class='empty'>找不到符合條件的單字。</div>";return}list.forEach(x=>{let el=document.createElement('article');el.className='card';el.innerHTML=`<div class='visual'><span class='tag'>${x.category}</span>${x.icon}</div><div><div class='top'><h2 class='word'>${x.word}</h2><button class='speak'>🔊 單字</button><button class='fav ${fav.includes(x.word)?'active':''}'>⭐</button><button class='learn ${learn.includes(x.word)?'active':''}'>✔</button></div><p class='meaning'>中文：${x.zh}</p><div class='example'><p><b>例句：</b>${x.example}</p><button class='sayEx'>🔊 例句</button><p class='muted'><b>中文：</b>${x.translation}</p></div></div>`;el.querySelector('.speak').onclick=()=>speak(x.word);el.querySelector('.sayEx').onclick=()=>speak(x.example);el.querySelector('.fav').onclick=()=>toggle(fav,x.word);el.querySelector('.learn').onclick=()=>toggle(learn,x.word);grid.appendChild(el)})}function toggle(a,w){a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();filter()}function quizMode(){mode='quiz';target=words[Math.floor(Math.random()*words.length)];let opts=[target,...words.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);modalBody.innerHTML=`<h2>選出正確中文</h2><div class='bigword'>${target.word}</div><div class='answers'>${opts.map((x,i)=>`<button class='answer' data-i='${i}'>${x.zh}</button>`).join('')}</div>`;modalBody.querySelectorAll('.answer').forEach((b,i)=>b.onclick=()=>{modalBody.querySelectorAll('.answer').forEach(z=>z.disabled=true);b.classList.add(opts[i]===target?'correct':'wrong')})}function flashMode(){mode='flash';target=words[Math.floor(Math.random()*words.length)];modalBody.innerHTML=`<div class='flash'><div class='bigicon'>${target.icon}</div><div class='bigword'>${target.word}</div><button id='say'>🔊 單字</button><div id='ans' class='hidden'><h3>${target.zh}</h3><p>${target.example}</p><p>${target.translation}</p></div><button id='reveal'>顯示答案</button></div>`;say.onclick=()=>speak(target.word);reveal.onclick=()=>ans.classList.remove('hidden')}q.oninput=filter;cat.onchange=filter;status.onchange=filter;shuffle.onclick=()=>{shown.sort(()=>Math.random()-.5);render(shown)};quiz.onclick=()=>{modal.classList.add('show');quizMode()};flash.onclick=()=>{modal.classList.add('show');flashMode()};close.onclick=()=>modal.classList.remove('show');next.onclick=()=>mode==='quiz'?quizMode():flashMode();stop.onclick=()=>speechSynthesis.cancel();stats();render(words);</script>
