<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#155d75"><meta name="description" content="11/22 TOEIC 專案管理與時程協作：20個職場英文單字、美式IPA、中英情境例句、正常及慢速朗讀、iPhone搜尋"><title>[11/22]主題專案管理與時程協作｜多益高頻英文20單字</title>
<style>:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:#f1f6fa;color:#1c3748}*{box-sizing:border-box}body{margin:0;line-height:1.55;padding-bottom:calc(22px + env(safe-area-inset-bottom))}header{background:linear-gradient(120deg,#153b5c,#147e8f);color:white;padding:22px 16px 27px}.wrap{max-width:1060px;margin:0 auto}h1{font-size:clamp(22px,4.8vw,31px);line-height:1.4;margin:15px 0 8px}header p{font-size:14px;color:#e4f4f9;margin:0}.back{display:inline-flex;align-items:center;min-height:44px;padding:9px 13px;border-radius:11px;border:1px solid #ffffffaa;color:white;text-decoration:none;font-weight:750}main{max-width:1090px;padding:17px 15px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid #d4e5ec;background:#fff;padding:12px;border-radius:15px}input{flex:1;min-width:180px;font-size:16px;padding:12px 14px;border:1px solid #a8c6d3;border-radius:10px;min-height:48px}button{font:inherit;cursor:pointer;touch-action:manipulation}.stop{background:#e7f1f7;color:#1b5b74;border:1px solid #c0d6e0;border-radius:10px;min-height:46px;padding:9px 12px;font-weight:750}#status{font-size:14px;color:#4e7180;margin:12px 4px;min-height:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,306px),1fr));gap:14px}.card{padding:17px;background:white;border:1px solid #d7e6ed;border-radius:17px;box-shadow:0 4px 16px #153a560b}.head{display:flex;align-items:center;gap:13px}.symbol{width:58px;height:58px;border-radius:14px;background:#e7f6f6;display:grid;place-items:center;font-size:30px;flex:none}.word{color:#13647e;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{color:#547786;font-size:15px;line-height:1.45;margin-top:2px}.meaning{font-weight:750;font-size:16px;margin:13px 0 10px}.example{padding:12px;border-radius:12px;background:#f3f9fb;border:1px solid #e6f0f3}.en{font-size:15px;line-height:1.7}.tr{font-size:14px;color:#54717d;margin-top:8px;line-height:1.7}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}.audio{background:#176f8c;color:white;border:0;border-radius:10px;font-weight:750;min-height:48px;font-size:14px;padding:8px 4px}.audio.slow{background:#e7f3f8;color:#175e76;border:1px solid #b8d5df}:focus-visible{outline:3px solid #efba40;outline-offset:2px}.empty{text-align:center;padding:32px;color:#59798b}footer{text-align:center;font-size:12px;color:#667d89;padding:25px 4px;line-height:1.8}@media(max-width:360px){.audio{font-size:12.5px}.card{padding:14px}.word{font-size:20px}}</style></head>
<body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/22]主題專案管理與時程協作｜多益高頻英文20單字</h1><p>📅 專案協作 × 20 單字｜🇺🇸 美式 IPA｜🔊 正常發音｜🐢 慢速跟讀｜📱 iPhone 友善</p></div></header><main><div class="toolbar"><input id="search" type="search" placeholder="搜尋英文、中文、音標或例句…" aria-label="搜尋英文、中文、音標或例句" autocomplete="off"><button class="stop" id="stop" type="button">⏹ 停止發音</button></div><p id="status" role="status" aria-live="polite">共 20 個單字。</p><section class="grid" id="cards" aria-label="今日多益職場英文20單字"></section><p class="empty" id="empty" hidden>找不到符合的單字，請更換搜尋條件。</p><footer>本教材為 TOEIC 常見職場情境的原創例句，非 ETS 官方單字頻率排名。英文發音使用裝置 Web Speech API，依 iPhone Safari 等瀏覽器實際可用的 en-US 語音播放；首次播放請直接點選發音按鈕。</footer></main>
<script>"use strict";const DATA=[{"en":"milestone","ipa":"/ˈmaɪl.stoʊn/","zh":"里程碑","icon":"🏁","ex":"Completing the initial design is a major milestone for the project.","tr":"完成初步設計是這項專案的重要里程碑。"},{"en":"deliverable","ipa":"/dɪˈlɪv.ɚ.ə.bəl/","zh":"專案交付成果","icon":"📦","ex":"The final deliverable must be submitted to the client by Friday.","tr":"最終交付成果必須在星期五前提交給客戶。"},{"en":"scope","ipa":"/skoʊp/","zh":"專案範圍","icon":"🔎","ex":"The manager approved a change to the project's scope.","tr":"經理核准了專案範圍的變更。"},{"en":"stakeholder","ipa":"/ˈsteɪkˌhoʊl.dɚ/","zh":"利害關係人","icon":"👥","ex":"The team will consult key stakeholders before making a decision.","tr":"團隊會在做決定前諮詢主要利害關係人。"},{"en":"timeline","ipa":"/ˈtaɪmˌlaɪn/","zh":"時程表；時間軸","icon":"🗓️","ex":"Please update the timeline to reflect the revised delivery date.","tr":"請更新時程表，以反映修改後的交付日期。"},{"en":"dependency","ipa":"/dɪˈpen.dən.si/","zh":"相依關係；前置依賴","icon":"🔗","ex":"The manager identified a dependency between testing and final approval.","tr":"經理發現測試與最終核准之間存在相依關係。"},{"en":"prioritize","ipa":"/praɪˈɔːr.ə.taɪz/","zh":"排定優先順序","icon":"🎯","ex":"We need to prioritize requests that affect existing customer orders.","tr":"我們需要優先處理會影響現有客戶訂單的要求。"},{"en":"contingency","ipa":"/kənˈtɪn.dʒən.si/","zh":"突發情況；應變措施","icon":"🛟","ex":"The team prepared a contingency plan in case the supplier is delayed.","tr":"團隊準備了應變計畫，以防供應商延誤。"},{"en":"backlog","ipa":"/ˈbæk.lɑːɡ/","zh":"積壓的待辦工作","icon":"📚","ex":"Additional staff were assigned to reduce the backlog of service requests.","tr":"公司增派人手，以減少積壓的服務申請。"},{"en":"kickoff","ipa":"/ˈkɪk.ɔːf/","zh":"啟動；開始（常指啟動會議）","icon":"🚀","ex":"The project kickoff meeting will take place on Monday morning.","tr":"專案啟動會議將於星期一上午舉行。"},{"en":"roadmap","ipa":"/ˈroʊd.mæp/","zh":"計畫路線圖；執行藍圖","icon":"🗺️","ex":"The director presented a roadmap for the next six months.","tr":"主管提出了未來六個月的計畫路線圖。"},{"en":"progress","ipa":"/ˈprɑː.ɡres/","zh":"進度；進展（名詞）","icon":"📈","ex":"The supervisor asked for a weekly progress report.","tr":"主管要求每週提交進度報告。"},{"en":"schedule","ipa":"/ˈskedʒ.uːl/","zh":"時程；工作排程","icon":"⏰","ex":"Please review the revised schedule before booking the meeting rooms.","tr":"預訂會議室前，請先檢視修訂後的時程表。"},{"en":"phase","ipa":"/feɪz/","zh":"階段；時期","icon":"🧩","ex":"The first phase of the renovation will end this month.","tr":"整修工程的第一階段將於本月底結束。"},{"en":"resource","ipa":"/ˈriː.sɔːrs/","zh":"資源","icon":"🧰","ex":"The project manager identified a key resource needed for the launch.","tr":"專案經理確認了一項產品上線所需的重要資源。"},{"en":"workflow","ipa":"/ˈwɝːk.floʊ/","zh":"工作流程","icon":"🔄","ex":"The new workflow reduces the time needed to approve requests.","tr":"新工作流程縮短了核准申請所需的時間。"},{"en":"assign","ipa":"/əˈsaɪn/","zh":"指派；分配任務","icon":"👤","ex":"The manager will assign each task to a team member.","tr":"經理將把每項任務指派給一位團隊成員。"},{"en":"coordinate","ipa":"/koʊˈɔːr.də.neɪt/","zh":"協調；統籌","icon":"🤝","ex":"Please coordinate with the design team before updating the website.","tr":"更新網站前，請先與設計團隊協調。"},{"en":"streamline","ipa":"/ˈstriːm.laɪn/","zh":"簡化流程；提高效率","icon":"⚙️","ex":"The company introduced new software to streamline its approval process.","tr":"公司導入新軟體，以簡化核准流程。"},{"en":"feasibility","ipa":"/ˌfiː.zəˈbɪl.ə.t̬i/","zh":"可行性","icon":"📊","ex":"A feasibility study will determine whether the expansion can proceed.","tr":"可行性研究將評估擴建計畫能否進行。"}];const $=id=>document.getElementById(id),synth=window.speechSynthesis||null;let voices=[],currentUtterance=null;function refreshVoices(){if(synth)voices=synth.getVoices()||[]}if(synth){refreshVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",refreshVoices)}function speak(text,slow){if(!synth||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援語音朗讀，建議使用 iPhone Safari。";return}try{synth.cancel();refreshVoices();const u=new SpeechSynthesisUtterance(text);currentUtterance=u;u.lang="en-US";u.rate=slow?0.65:0.98;u.pitch=1;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent="正在播放"+(slow?"慢速":"正常速度")+"美式英語…"};u.onend=()=>{$("status").textContent="播放完成，可再次點選練習。";currentUtterance=null};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="播放失敗，請檢查音量或改用 Safari。";currentUtterance=null};synth.speak(u)}catch(e){$("status").textContent="無法播放語音，請檢查瀏覽器設定。"}}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function audio(label,text,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.setAttribute("aria-label",label+"："+text);b.addEventListener("click",()=>speak(text,slow));return b}function render(){const q=$("search").value.trim().toLocaleLowerCase();const found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(y=>y.toLocaleLowerCase().includes(q)));const frag=document.createDocumentFragment();for(const x of found){const card=el("article","card"),head=el("div","head"),info=el("div"),example=el("div","example"),buttons=el("div","actions");info.append(el("div","word",x.en),el("div","ipa",x.ipa));head.append(el("div","symbol",x.icon),info);example.append(el("div","en",x.ex),el("div","tr",x.tr));buttons.append(audio("🔊 單字",x.en,false),audio("🐢 單字慢速",x.en,true),audio("🔊 例句",x.ex,false),audio("🐢 例句慢速",x.ex,true));card.append(head,el("div","meaning",x.zh),example,buttons);frag.append(card)}$("cards").replaceChildren(frag);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / "+DATA.length+" 個單字。"}$("search").addEventListener("input",render);$("stop").addEventListener("click",()=>{if(synth)synth.cancel();currentUtterance=null;$("status").textContent="已停止發音。"});window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});render();</script></body></html>
