*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:linear-gradient(180deg,#eef4ff 0%,#f7fbff 30%,#f3f7fb 100%);color:var(--text);padding-bottom:110px}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 25px rgba(38,63,115,.07);padding:16px;margin-bottom:16px}

button.ghost{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.top-actions button{width:auto;min-width:120px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--accent);border:1px solid #dce7ff;border-radius:999px;padding:8px 12px;font-size:13px;color:#3053a8;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 22px rgba(38,63,115,.06)}
.head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#eff5ff,#ffffff);border:1px solid #d8e5ff;flex:none}
.word{font-size:24px;font-weight:800;line-height:1.2;margin:0;color:#17346f}

.zh{font-size:18px;font-weight:700;margin:12px 0 8px}
.example{margin:0 0 6px;font-size:15px;line-height:1.65}
.cn{font-size:14px;color:var(--muted);line-height:1.65}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

<header>

</header>
<div class="wrap">

          <option value="1">正常 1.0x</option>
          <option value="1.15">稍快 1.15x</option>
        </select>
      </div>
      <div>

          <option value="default">原始分類</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
    </div>
    <div class="top-actions">

      <button id="clearBtn" type="button" class="ghost">🧹 清除搜尋</button>

    <div class="stats">

      <div class="stat">15 大分類</div>
      <div class="stat">含小圖案與發音</div>
    </div>
  </section>

  <section id="cards" class="grid"></section>
  <div id="empty" class="panel empty" style="display:none;">找不到符合條件的單字，請換個關鍵字試試看。</div>
  <footer>建議用 Safari、Chrome 或從 iPhone 主畫面加入的 English Learning App 開啟，發音效果更佳。</footer>
</div>

, "example": "An ice bath is not for everyone.", "icon": "🧊"}, {"category": "Supplements & Recovery", "word": "sauna", "ipa": "/ˈsɔː.nə/", "zh": "三溫暖", "example": "Some athletes relax in the sauna.", "icon": "♨️"}, {"category": "Supplements & Recovery", "word": "recovery drink", "ipa": "/rɪˈkʌv.ɚ.i drɪŋk/", "zh": "恢復飲", "example": "A recovery drink contains carbs and protein.", "icon": "🥤"}];
const categoryNames = {"Equipment Basics": "器材基礎", "Free Weights": "自由重量", "Machines": "固定器械", "Cardio Machines": "有氧器材", "Functional Equipment": "功能性器材", "Lower-body Exercises": "下肢動作", "Upper-body Exercises": "上肢動作", "Core Exercises": "核心動作", "Stretching & Mobility": "伸展與活動度", "Strength Training Terms": "重量訓練術語", "Workout Instructions": "教練口令與提示", "Anatomy & Muscles": "肌群與解剖", "Nutrition Basics": "營養基礎", "Diet Control": "飲食控制", "Supplements & Recovery": "補充與恢復"};
const state = { favoritesOnly:false, randomOnly:false, randomSet:[] };
const favoritesKey = 'fitness_english_300_favorites';

const searchEl = document.getElementById('search');
const categoryEl = document.getElementById('category');
const speedEl = document.getElementById('speed');
const sortModeEl = document.getElementById('sortMode');
const cardsEl = document.getElementById('cards');
const emptyEl = document.getElementById('empty');
const countStat = document.getElementById('countStat');
const favoritesBtn = document.getElementById('favoritesBtn');

function getFavorites(){
  try { return JSON.parse(localStorage.getItem(favoritesKey) || '[]'); } catch(err) { return []; }
}
function setFavorites(list){ localStorage.setItem(favoritesKey, JSON.stringify(list)); }
function isFavorite(word){ return getFavorites().includes(word); }
function toggleFavorite(word){
  const set = new Set(getFavorites());
  set.has(word) ? set.delete(word) : set.add(word);
  setFavorites([...set]);
  render();
}

function populateCategories(){
  const opts = ['<option value="all">全部分類</option>'];
  Object.keys(categoryNames).forEach(cat => {
    opts.push(`<option value="${cat}">${categoryNames[cat]}（${cat}）</option>`);
  });
  categoryEl.innerHTML = opts.join('');
}

function speak(text){
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音發音'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = Number(speedEl.value || 0.85);
  window.speechSynthesis.speak(utter);
}

function filteredWords(){
  let list = [...allWords];
  const keyword = searchEl.value.trim().toLowerCase();
  const category = categoryEl.value;
  const sort = sortModeEl.value;
  if (category && category !== 'all') list = list.filter(x => x.category === category);
  if (keyword) list = list.filter(x =>
    x.word.toLowerCase().includes(keyword) ||
    x.zh.toLowerCase().includes(keyword) ||
    x.example.toLowerCase().includes(keyword) ||
    x.category.toLowerCase().includes(keyword)
  );
  if (state.favoritesOnly) {
    const favs = new Set(getFavorites());
    list = list.filter(x => favs.has(x.word));
  }
  if (state.randomOnly) {
    const set = new Set(state.randomSet);
    list = list.filter(x => set.has(x.word));
  }
  if (sort === 'az') list.sort((a,b)=>a.word.localeCompare(b.word));
  else if (sort === 'za') list.sort((a,b)=>b.word.localeCompare(a.word));
  return list;
}

function render(){
  const list = filteredWords();
  cardsEl.innerHTML='';
  list.forEach(item => {
    const article=document.createElement('article');
    article.className='card';
    article.dataset.word=item.word;
    article.innerHTML=`
      <div class="head">
        <div class="icon">${item.icon}</div>
        <div>
          <h2 class="word"></h2>
          <div class="ipa"></div>
          <div class="category"></div>
        </div>
      </div>
      <div class="zh"></div>
      <p class="example"></p>
      <div class="cn"></div>
      <div class="btns"></div>`;
    article.querySelector('.word').textContent=item.word;
    article.querySelector('.ipa').textContent=item.ipa;
    article.querySelector('.category').textContent=categoryNames[item.category] || item.category;
    article.querySelector('.zh').textContent=item.zh;
    article.querySelector('.example').textContent=item.example;
    article.querySelector('.cn').textContent=`圖像記憶：${item.icon}　適用：${item.zh}`;
    const btns=article.querySelector('.btns');
    const b1=document.createElement('button'); b1.textContent='🔊 單字發音'; b1.onclick=()=>speak(item.word);
    const b2=document.createElement('button'); b2.textContent='🗣️ 例句發音'; b2.className='secondary'; b2.onclick=()=>speak(item.example);
    const b3=document.createElement('button');
    const fav=isFavorite(item.word);
    b3.textContent=fav ? '⭐ 已收藏' : '☆ 收藏';
    b3.className='favorite ' + (fav ? 'active' : 'ghost');
    b3.onclick=()=>toggleFavorite(item.word);
    btns.append(b1,b2,b3);
    cardsEl.appendChild(article);
  });

  countStat.textContent = `目前顯示 ${list.length} / ${allWords.length}`;
  emptyEl.style.display = list.length ? 'none' : 'block';
  favoritesBtn.textContent = state.favoritesOnly ? '⭐ 正在顯示收藏' : '⭐ 只看收藏';
}

document.getElementById('clearBtn').addEventListener('click', ()=>{
  searchEl.value=''; categoryEl.value='all'; sortModeEl.value='default'; state.randomOnly=false; render();
});
document.getElementById('allBtn').addEventListener('click', ()=>{
  state.randomOnly=false; state.favoritesOnly=false; render();
});
document.getElementById('favoritesBtn').addEventListener('click', ()=>{
  state.favoritesOnly=!state.favoritesOnly; state.randomOnly=false; render();
});
document.getElementById('randomBtn').addEventListener('click', ()=>{
  const pool=[...allWords].sort(()=>Math.random()-0.5).slice(0,10);
  state.randomSet=pool.map(x=>x.word); state.randomOnly=true; render();
});
[searchEl,categoryEl,sortModeEl].forEach(el=>el.addEventListener('input', ()=>{state.randomOnly=false; render();}));
[categoryEl,sortModeEl].forEach(el=>el.addEventListener('change', ()=>{state.randomOnly=false; render();}));

populateCategories();
render();
</script>
