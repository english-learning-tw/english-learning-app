function toggle(a,w){a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();filter()}
function quizMode(){mode="quiz";target=words[Math.floor(Math.random()*words.length)];let opts=[target,...words.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);modalBody.innerHTML=`<h2>選出正確中文</h2><div class="question">${target.word}<br><small>${target.root}＝${target.rootMeaning}</small></div><div class="answers">${opts.map((x,i)=>`<button class="answer" data-i="${i}">${x.zh}</button>`).join("")}</div>`;modalBody.querySelectorAll(".answer").forEach((b,i)=>b.onclick=()=>{modalBody.querySelectorAll(".answer").forEach(z=>z.disabled=true);b.classList.add(opts[i]===target?"correct":"wrong")})}
function flashMode(){mode="flash";target=words[Math.floor(Math.random()*words.length)];modalBody.innerHTML=`<div class="flash"><div>${target.root}｜${target.rootMeaning}</div><div class="bigword">${target.word}</div><button id="say">🔊 單字</button><div id="ans" class="hidden"><h3>${target.zh}</h3><p>${target.breakdown}</p><p>${target.example}</p><p>${target.translation}</p></div><button id="reveal">顯示答案</button></div>`;say.onclick=()=>speak(target.word);reveal.onclick=()=>ans.classList.remove("hidden")}
q.oninput=filter;root.onchange=filter;status.onchange=filter;shuffle.onclick=()=>{shown.sort(()=>Math.random()-.5);render(shown)};quiz.onclick=()=>{modal.classList.add("show");quizMode()};flash.onclick=()=>{modal.classList.add("show");flashMode()};close.onclick=()=>modal.classList.remove("show");next.onclick=()=>mode==="quiz"?quizMode():flashMode();stats();render(words);
</script>
