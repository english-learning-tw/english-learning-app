<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>縫紉與浴室英文 61｜圖像發音網站</title><meta name="theme-color" content="#244c92"><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#24334b;background:#f3f7fc}*{box-sizing:border-box}body{margin:0;padding-bottom:96px}header{background:linear-gradient(130deg,#263b75,#4c81c7);color:#fff;padding:24px 18px}header h1{font-size:25px;margin:0 0 7px}header p{font-size:14px;margin:0;line-height:1.6}.wrap{max-width:1120px;margin:auto;padding:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:white;border:1px solid #e1e7ef;border-radius:18px;padding:14px}.toolbar>*{flex:1;min-width:190px}input,select{width:100%;border:1px solid #cbd9eb;border-radius:11px;padding:11px;font:inherit}.count{margin:16px 0;color:#61728b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:14px}.card{background:#fff;border:1px solid #e0e7f2;border-radius:18px;padding:16px;box-shadow:0 5px 16px #2034560a}.top{display:flex;gap:13px;align-items:center}.pic{background:linear-gradient(135deg,#e9f1ff,#fff7e9);width:70px;height:70px;border:1px solid #dce5f4;border-radius:17px;display:grid;place-items:center;font-size:36px;flex:none}.en{font-size:21px;color:#194991;font-weight:800;overflow-wrap:anywhere}.ipa{color:#58708e;font-size:14px;margin-top:5px}.zh{font-size:17px;font-weight:700;margin:13px 0}.chip{font-size:12px;color:#4264a7;background:#eaf1ff;border-radius:30px;display:inline-block;padding:6px 9px}.buttons{display:flex;gap:9px;margin-top:15px}button{font:inherit;cursor:pointer;padding:11px 12px;border:0;border-radius:11px;background:#2b5fb9;color:white;font-weight:700;flex:1}button.alt{background:#edf3ff;color:#2656ac}.home{position:fixed;right:15px;bottom:calc(15px + env(safe-area-inset-bottom));padding:13px 18px;background:#2b5fb9;color:white;border-radius:35px;text-decoration:none;font-weight:800;box-shadow:0 6px 20px #263b7565}.muted{color:#61728b;font-size:13px;line-height:1.55;margin-top:16px}</style></head><body><header><div class="wrap"><h1>🪡🚿 縫紉與浴室英文 61｜圖片發音學習</h1><p>依照 4 張教材照片整理：縫紉、浴室洗臉台、淋浴室、廁所。每張單字卡搭配對應圖案、IPA、美式英文朗讀及收藏。</p></div></header><main class="wrap"><div class="toolbar"><input id="search" aria-label="搜尋單字" placeholder="搜尋英文或中文，例如：soap、牙刷"><select id="category" aria-label="教材分類"><option value="">全部分類</option></select><select id="speed" aria-label="發音速度"><option value=".7">慢速 0.7×</option><option value=".85" selected>練習 0.85×</option><option value="1">正常 1×</option></select></div><div class="count" id="count"></div><div id="cards" class="grid"></div><p class="muted">圖案為單字相關的 Emoji 示意圖，不是書本原始插畫；發音以裝置語音合成功能提供。需使用支援語音的瀏覽器。</p></main><a href="./" class="home">← 返回教材首頁</a><script>const DATA=[{"cat":"縫紉 Sewing","en":"spool","zh":"線軸","emoji":"🧵","ipa":"/spuːl/"},{"cat":"縫紉 Sewing","en":"fabric","zh":"布料","emoji":"🧶","ipa":"/ˈfæbrɪk/"},{"cat":"縫紉 Sewing","en":"patch","zh":"補丁、補片","emoji":"🩹","ipa":"/pætʃ/"},{"cat":"縫紉 Sewing","en":"marking chalk","zh":"畫記粉筆","emoji":"🖍️","ipa":"/ˈmɑːrkɪŋ tʃɔːk/"},{"cat":"縫紉 Sewing","en":"zipper","zh":"拉鍊","emoji":"🤐","ipa":"/ˈzɪpər/"},{"cat":"縫紉 Sewing","en":"button","zh":"鈕扣","emoji":"🔘","ipa":"/ˈbʌtən/"},{"cat":"縫紉 Sewing","en":"needle","zh":"針","emoji":"🪡","ipa":"/ˈniːdəl/"},{"cat":"縫紉 Sewing","en":"thimble","zh":"頂針","emoji":"🪡","ipa":"/ˈθɪmbəl/"},{"cat":"縫紉 Sewing","en":"safety pin","zh":"安全別針","emoji":"🧷","ipa":"/ˈseɪfti pɪn/"},{"cat":"縫紉 Sewing","en":"thread","zh":"線","emoji":"🧵","ipa":"/θred/"},{"cat":"縫紉 Sewing","en":"sewing machine","zh":"縫紉機","emoji":"🪡","ipa":"/ˈsoʊɪŋ məˌʃiːn/"},{"cat":"縫紉 Sewing","en":"lace","zh":"花邊、蕾絲","emoji":"🎀","ipa":"/leɪs/"},{"cat":"縫紉 Sewing","en":"measuring tape","zh":"皮尺、捲尺","emoji":"📏","ipa":"/ˈmeʒərɪŋ teɪp/"},{"cat":"縫紉 Sewing","en":"pin","zh":"大頭針","emoji":"📌","ipa":"/pɪn/"},{"cat":"縫紉 Sewing","en":"pincushion","zh":"針插、針墊","emoji":"🧷","ipa":"/ˈpɪnˌkʊʃ (JSON.parse(localStorage.getItem(favKey)||"[]"))}catch{};for(const c of [...new Set(DATA.map(x=>x.cat))]){const o=document.createElement("option");o.value=o.textContent=c;$("category").append(o)}function speak(t){if(!("speechSynthesis"in window)){alert("裝置不支援英文語音");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=Number($("speed").value);speechSynthesis.speak(u)}function render(){const q=$("search").value.trim().toLowerCase(),cat=$("category").value;const list=DATA.filter(x=>(!cat||x.cat===cat)&&(!q||(x.en+" "+x.zh).toLowerCase().includes(q)));$("count").textContent="顯示 "+list.length+" / "+DATA.length+" 筆";const root=$("cards");root.replaceChildren();for(const x of list){const card=document.createElement("article");card.className="card";const top=document.createElement("div");top.className="top";const pic=document.createElement("div");pic.className="pic";pic.textContent=x.emoji;pic.setAttribute("role","img");pic.setAttribute("aria-label",x.zh);const title=document.createElement("div");const en=document.createElement("div");en.className="en";en.textContent=x.en;const ipa=document.createElement("div");ipa.className="ipa";ipa.textContent=x.ipa;title.append(en,ipa);top.append(pic,title);const zh=document.createElement("div");zh.className="zh";zh.textContent=x.zh;const cat=document.createElement("span");cat.className="chip";cat.textContent=x.cat;const actions=document.createElement("div");actions.className="buttons";const b=document.createElement("button");b.textContent="🔊 聽發音";b.onclick=()=>speak(x.en);const f=document.createElement("button");f.className="alt";f.textContent=fav.has(x.en)?"⭐ 已收藏":"☆ 收藏";f.onclick=()=>{fav.has(x.en)?fav.delete(x.en):fav.add(x.en);localStorage.setItem(favKey,JSON.stringify([...fav]));f.textContent=fav.has(x.en)?"⭐ 已收藏":"☆ 收藏"};actions.append(b,f);card.append(top,zh,cat,actions);root.append(card)}}$("search").addEventListener("input",render);$("category").addEventListener("change",render);render();</script></body></html>
