<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/29]主題鐵路通勤與大眾運輸｜多益高頻英文20單字</title><meta name="theme-color" content="#176780"><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f9;color:#173849;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#183e5c,#178291);color:white;padding:24px 15px}.wrap{max-width:1080px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.45}.back{color:white;border:1px solid #c9e8ed;padding:10px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}main{max-width:1100px;padding:16px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:10px}input{min-width:180px;flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #b4ced9}button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px}.stop{background:#e8f2f5;color:#145b75;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;background:white;border:1px solid #d8e5ea;border-radius:16px}.head{display:flex;gap:12px;align-items:center}.symbol{background:#e8f4f7;padding:12px;border-radius:12px;font-size:27px}.word{color:#17687f;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#577382}.meaning{font-weight:700;margin:13px 0}.example{background:#f3f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#526c77;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{color:white;background:#19718b;padding:8px 4px;font-size:14px;font-weight:700}.slow{background:#e6f2f7;color:#165c73;border:1px solid #bed8e0}.status{color:#4c6b78;font-size:14px}footer{text-align:center;color:#617b86;font-size:12px;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/29]主題鐵路通勤與大眾運輸｜多益高頻英文20單字</h1><p>🚆 20 個職場單字｜🇺🇸 美式 IPA｜🔊 單字與例句｜🐢 慢速跟讀</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋英文、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite">共 20 個單字</p><section id="cards" class="grid"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材使用原創 TOEIC 職場情境例句，並非 ETS 官方頻率排名。發音使用瀏覽器 Web Speech API，優先選用裝置可用的美式英語聲音。</footer></main><script>"use strict";const DATA=[{"en":"commuter","ipa":"/kəˈmjutər/","zh":"通勤者","icon":"🚉","ex":"Many commuters take the train to work every morning.","tr":"許多通勤者每天早上搭火車上班。"},{"en":"fare","ipa":"/fɛr/","zh":"車資；票價","icon":"💳","ex":"The new fare will take effect next month.","tr":"新車資將於下個月生效。"},{"en":"platform","ipa":"/ˈplætˌfɔrm/","zh":"月台","icon":"🚉","ex":"The train to Boston leaves from platform three.","tr":"前往波士頓的火車從第三月台出發。"},{"en":"timetable","ipa":"/ˈtaɪmˌteɪbəl/","zh":"時刻表","icon":"🕒","ex":"Please check the revised timetable online.","tr":"請上網查閱更新後的時刻表。"},{"en":"route","ipa":"/rut/","zh":"路線","icon":"🗺️","ex":"The bus route has changed due to road construction.","tr":"公車路線因道路施工而變更。"},{"en":"express","ipa":"/ɪkˈsprɛs/","zh":"快速的；快車","icon":"🚄","ex":"The express train makes fewer stops.","tr":"快車停靠的站數較少。"},{"en":"conductor","ipa":"/kənˈdʌktər/","zh":"列車長；車掌","icon":"🧑‍✈️","ex":"The conductor will check your ticket on board.","tr":"列車長將在車上查驗您的車票。"},{"en":"passenger","ipa":"/ˈpæsəndʒər/","zh":"乘客","icon":"🧳","ex":"Passengers are asked to keep the doors clear.","tr":"請乘客勿阻擋車門。"},{"en":"station","ipa":"/ˈsteɪʃən/","zh":"車站","icon":"🚉","ex":"Our office is a five-minute walk from the station.","tr":"我們的辦公室距車站步行五分鐘。"},{"en":"delay","ipa":"/dɪˈleɪ/","zh":"延誤；耽擱","icon":"⏳","ex":"There is a ten-minute delay on the northbound line.","tr":"北向路線延誤十分鐘。"},{"en":"detour","ipa":"/ˈdiˌtʊr/","zh":"改道；繞道","icon":"🚧","ex":"Buses will take a detour during the parade.","tr":"遊行期間公車將改道行駛。"},{"en":"punctual","ipa":"/ˈpʌŋktʃuəl/","zh":"準時的","icon":"⌚","ex":"The new rail service is usually punctual.","tr":"新的鐵路服務通常很準時。"},{"en":"ticket","ipa":"/ˈtɪkɪt/","zh":"車票；票券","icon":"🎫","ex":"You can buy a ticket at the machine near the entrance.","tr":"您可以在入口附近的售票機購買車票。"},{"en":"railway","ipa":"/ˈreɪlˌweɪ/","zh":"鐵路","icon":"🛤️","ex":"The railway company plans to add evening trains.","tr":"鐵路公司計畫增加晚間列車。"},{"en":"connection","ipa":"/kəˈnɛkʃən/","zh":"轉乘班次；銜接","icon":"🔁","ex":"We have five minutes to make our connection.","tr":"我們有五分鐘可以趕上轉乘班次。"},{"en":"railcar","ipa":"/ˈreɪlˌkɑr/","zh":"鐵路車廂","icon":"🚃","ex":"The railcar at the front has extra space for bicycles.","tr":"前方車廂設有額外的自行車空間。"},{"en":"turnstile","ipa":"/ˈtɜrnˌstaɪl/","zh":"旋轉式閘門","icon":"🚪","ex":"Tap your transit card before passing through the turnstile.","tr":"通過閘門前請先感應交通卡。"},{"en":"frequency","ipa":"/ˈfrikwənsi/","zh":"頻率；班次密度","icon":"📅","ex":"The city will increase bus frequency on weekends.","tr":"市政府將增加週末公車的班次。"},{"en":"suspension","ipa":"/səˈspɛnʃən/","zh":"暫停；停駛","icon":"⛔","ex":"The notice announces a temporary suspension of rail service.","tr":"公告宣布鐵路服務暫時停駛。"},{"en":"peak hours","ipa":"/ˈpik ˌaʊərz/","zh":"尖峰時段","icon":"👥","ex":"Trains are more crowded during peak hours.","tr":"尖峰時段的列車更加擁擠。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis||null;let voices=[];function load(){if(s)voices=s.getVoices()||[]}if(s){load();s.addEventListener?.("voiceschanged",load)}function speak(text,slow){if(!s||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援朗讀，請改用 Safari";return}s.cancel();load();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在慢速朗讀…":"正在朗讀…"};u.onend=()=>{$("status").textContent="朗讀完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="朗讀失敗，請確認音量或使用 Safari"};s.speak(u)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){const q=$("search").value.trim().toLowerCase(),found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of found){const c=el("article","card"),h=el("div","head"),inf=el("div"),ex=el("div","example"),b=el("div","buttons");inf.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","symbol",x.icon),inf);ex.append(el("div","",x.ex),el("div","tr",x.tr));b.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,b);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{s?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>s?.cancel());render();</script></body></html>
