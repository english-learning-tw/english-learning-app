<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/14]主題職場安全與緊急應變｜多益高頻英文20單字</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#18384b;background:#f2f7fa}*{box-sizing:border-box}body{margin:0;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(110deg,#173c58,#147b83);color:white;padding:22px 16px}main,.wrap{max-width:1000px;margin:auto}main{padding:16px}h1{font-size:clamp(22px,5vw,32px)}a{color:inherit}.back{display:inline-block;padding:10px;border:1px solid #a6c8d3;border-radius:9px}input{width:100%;font-size:16px;padding:13px;border:1px solid #aac5d3;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}.card{background:white;border:1px solid #d7e6ed;border-radius:15px;padding:17px}.head{display:flex;gap:12px;align-items:center}.emoji{font-size:32px}.word{font-size:22px;font-weight:800;color:#11647d}.ipa{color:#577383}.meaning{font-weight:700;margin:10px 0}.example{background:#f1f7fa;padding:12px;border-radius:10px}.tr{color:#536f7b;margin-top:6px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:46px;border:0;border-radius:9px;background:#146c86;color:white;font-size:14px;font-weight:700}button.slow{background:#e6f2f6;color:#145c76;border:1px solid #b5d4df}#status{color:#496a7a}footer{text-align:center;padding:25px;font-size:12px;color:#637d8a}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/14]主題職場安全與緊急應變｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA｜🔊 正常發音｜🐢 慢速跟讀｜📱 iPhone 友善</p></div></header><main><input id="search" type="search" placeholder="搜尋英文、中文或例句" aria-label="搜尋教材"><p id="status" aria-live="polite"></p><button id="stop" type="button">⏹ 停止發音</button><section id="cards" class="grid"></section><footer>發音使用裝置內建 Web Speech API；實際語音品質依瀏覽器與手機而異。</footer></main><script>"use strict";const DATA=[{"en":"hazard","ipa":"/ˈhæzɚd/","zh":"危害；危險因素","icon":"⚠️","ex":"Employees must report any safety hazard immediately.","tr":"員工必須立即通報任何安全危害。"},{"en":"precaution","ipa":"/prɪˈkɔːʃən/","zh":"預防措施","icon":"🛡️","ex":"Take extra precautions when handling heavy equipment.","tr":"操作重型設備時請採取額外預防措施。"},{"en":"evacuation","ipa":"/ɪˌvækjuˈeɪʃən/","zh":"疏散","icon":"🚪","ex":"The building's evacuation plan is posted near each exit.","tr":"建築物的疏散計畫張貼在各出口附近。"},{"en":"emergency exit","ipa":"/ɪˈmɝːdʒənsi ˈeɡzɪt/","zh":"緊急出口","icon":"🚨","ex":"Keep the emergency exit clear at all times.","tr":"請隨時保持緊急出口暢通。"},{"en":"extinguisher","ipa":"/ɪkˈstɪŋɡwɪʃɚ/","zh":"滅火器","icon":"🧯","ex":"Every employee should know where the nearest fire extinguisher is located.","tr":"每位員工都應知道最近的滅火器位置。"},{"en":"inspection","ipa":"/ɪnˈspekʃən/","zh":"檢查；檢驗","icon":"🔍","ex":"The annual safety inspection is scheduled for Monday.","tr":"年度安全檢查安排在星期一。"},{"en":"incident","ipa":"/ˈɪnsɪdənt/","zh":"事故；事件","icon":"📋","ex":"The supervisor documented the incident in the safety report.","tr":"主管已在安全報告中記錄這起事故。"},{"en":"injury","ipa":"/ˈɪndʒəri/","zh":"傷害；受傷","icon":"🩹","ex":"Report any workplace injury to your supervisor.","tr":"任何職場傷害都應向主管通報。"},{"en":"protective","ipa":"/prəˈtektɪv/","zh":"防護的","icon":"🥽","ex":"Protective eyewear is required in the workshop.","tr":"進入工作坊必須配戴防護眼鏡。"},{"en":"equipment","ipa":"/ɪˈkwɪpmənt/","zh":"設備","icon":"🦺","ex":"All safety equipment must be checked regularly.","tr":"所有安全設備都必須定期檢查。"},{"en":"procedure","ipa":"/prəˈsiːdʒɚ/","zh":"程序；作業流程","icon":"📑","ex":"Follow the approved procedure when operating machinery.","tr":"操作機械時請遵循核准的作業程序。"},{"en":"drill","ipa":"/drɪl/","zh":"演練","icon":"📣","ex":"The company will conduct a fire drill next Thursday.","tr":"公司將在下週四舉行消防演練。"},{"en":"first aid","ipa":"/ˌfɝːst ˈeɪd/","zh":"急救","icon":"⛑️","ex":"First aid supplies are available at the reception desk.","tr":"接待櫃檯備有急救用品。"},{"en":"spill","ipa":"/spɪl/","zh":"溢出；潑灑","icon":"💧","ex":"Please clean up the spill to prevent slips.","tr":"請清理溢出的液體，以防滑倒。"},{"en":"slippery","ipa":"/ˈslɪpəri/","zh":"濕滑的","icon":"🚧","ex":"Place a warning sign near the slippery floor.","tr":"請在濕滑地板附近放置警告標誌。"},{"en":"ventilation","ipa":"/ˌventəˈleɪʃən/","zh":"通風","icon":"🌬️","ex":"Proper ventilation is essential in the storage area.","tr":"儲藏區必須保持適當通風。"},{"en":"maintenance","ipa":"/ˈmeɪntənəns/","zh":"維護；保養","icon":"🔧","ex":"Regular maintenance helps prevent equipment failures.","tr":"定期保養有助於避免設備故障。"},{"en":"alarm","ipa":"/əˈlɑːrm/","zh":"警報器；警報","icon":"🔔","ex":"Leave the building immediately when the alarm sounds.","tr":"警報響起時請立即離開建築物。"},{"en":"assembly point","ipa":"/əˈsembli pɔɪnt/","zh":"集合地點","icon":"📍","ex":"Meet at the designated assembly point after evacuating.","tr":"疏散後請在指定集合地點會合。"},{"en":"supervision","ipa":"/ˌsuːpɚˈvɪʒən/","zh":"監督；督導","icon":"👷","ex":"New employees may operate the machine only under supervision.","tr":"新進員工只能在有人監督下操作機器。"}];const $=id=>document.getElementById(id);const synth=window.speechSynthesis;let voices=[];function load(){if(synth)voices=synth.getVoices()}load();if(synth)synth.addEventListener("voiceschanged",load);function speak(t,slow){if(!synth){$("status").textContent="此瀏覽器不支援語音";return} synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;u.voice=voices.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;u.onstart=()=>{$("status").textContent="正在播放…"};u.onend=()=>{$("status").textContent="播放完成"};u.onerror=()=>{$("status").textContent="發音未成功，請改用 Safari"};synth.speak(u)}function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function audio(label,t,slow){const b=node("button",slow?"slow":"",label);b.type="button";b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.trim().toLowerCase();const found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q)));const frag=document.createDocumentFragment();for(const x of found){const c=node("article","card"),head=node("div","head"),info=node("div"),ex=node("div","example"),bs=node("div","buttons");info.append(node("div","word",x.en),node("div","ipa",x.ipa));head.append(node("div","emoji",x.icon),info);ex.append(node("div","",x.ex),node("div","tr",x.tr));bs.append(audio("🔊 單字",x.en,false),audio("🐢 單字慢速",x.en,true),audio("🔊 例句",x.ex,false),audio("🐢 例句慢速",x.ex,true));c.append(head,node("div","meaning",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{if(synth)synth.cancel();$("status").textContent="已停止發音"};render();</script></body></html>
