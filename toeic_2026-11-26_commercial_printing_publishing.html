<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/26]主題商務印刷與出版｜多益高頻英文20單字</title><meta name="theme-color" content="#176780"><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f9;color:#173849;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#183e5c,#178291);color:white;padding:24px 15px}.wrap{max-width:1080px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.45}.back{color:white;border:1px solid #c9e8ed;padding:10px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}main{max-width:1100px;padding:16px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:10px}input{min-width:180px;flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #b4ced9}button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px}.stop{background:#e8f2f5;color:#145b75;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;background:white;border:1px solid #d8e5ea;border-radius:16px}.head{display:flex;gap:12px;align-items:center}.symbol{background:#e8f4f7;padding:12px;border-radius:12px;font-size:27px}.word{color:#17687f;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#577382}.meaning{font-weight:700;margin:13px 0}.example{background:#f3f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#526c77;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{color:white;background:#19718b;padding:8px 4px;font-size:14px;font-weight:700}.slow{background:#e6f2f7;color:#165c73;border:1px solid #bed8e0}.status{color:#4c6b78;font-size:14px}footer{text-align:center;color:#617b86;font-size:12px;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/26]主題商務印刷與出版｜多益高頻英文20單字</h1><p>📰 20 個職場單字｜🇺🇸 美式 IPA｜🔊 單字與例句｜🐢 慢速跟讀</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋英文、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite">共 20 個單字</p><section id="cards" class="grid"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材使用原創 TOEIC 職場情境例句，並非 ETS 官方頻率排名。發音使用瀏覽器 Web Speech API，優先選用裝置可用的美式英語聲音。</footer></main><script>"use strict";const DATA=[{"en":"proof","ipa":"/pruːf/","zh":"校樣；印刷前供確認的樣稿","icon":"📰","ex":"Please approve the digital proof before we print the booklet.","tr":"印製小冊子前，請先核准電子校樣。"},{"en":"manuscript","ipa":"/ˈmænjəˌskrɪpt/","zh":"原稿；待出版的文稿","icon":"📰","ex":"The author submitted the revised manuscript on Monday.","tr":"作者週一提交了修訂後的原稿。"},{"en":"layout","ipa":"/ˈleɪˌaʊt/","zh":"版面配置；排版設計","icon":"📰","ex":"The designer changed the layout to make the price list easier to read.","tr":"設計師調整了版面，讓價目表更好讀。"},{"en":"typeface","ipa":"/ˈtaɪpˌfeɪs/","zh":"字型；一組字母的設計樣式","icon":"📰","ex":"Use the same typeface on every page of the report.","tr":"報告每一頁都請使用相同的字型。"},{"en":"headline","ipa":"/ˈhɛdˌlaɪn/","zh":"大標題","icon":"📰","ex":"The editor shortened the headline so it would fit on one line.","tr":"編輯縮短了大標題，讓它能排在同一行。"},{"en":"caption","ipa":"/ˈkæpʃən/","zh":"圖片說明文字","icon":"🖨️","ex":"Add a caption under the photograph to identify the speaker.","tr":"請在照片下方加上說明，標明講者是誰。"},{"en":"trim","ipa":"/trɪm/","zh":"裁切；修剪（動詞）","icon":"🖨️","ex":"The printer will trim the pages to the requested size.","tr":"印刷廠會把內頁裁成指定尺寸。"},{"en":"laminate","ipa":"/ˈlæməˌneɪt/","zh":"護貝；覆上保護膜（動詞）","icon":"🖨️","ex":"We laminate the signs so they can be wiped clean.","tr":"我們會把標示牌護貝，方便擦拭清潔。"},{"en":"glossy","ipa":"/ˈɡlɑːsi/","zh":"有光澤的；亮面的","icon":"🖨️","ex":"The client chose glossy paper to make the photos stand out.","tr":"客戶選了亮面紙，讓照片更顯眼。"},{"en":"matte","ipa":"/mæt/","zh":"霧面的；不反光的","icon":"🖨️","ex":"The report has a matte cover that does not reflect much light.","tr":"這份報告採用不太反光的霧面封面。"},{"en":"booklet","ipa":"/ˈbʊklət/","zh":"小冊子","icon":"📚","ex":"Each new employee receives a booklet about company policies.","tr":"每位新進員工都會收到一本公司規定小冊子。"},{"en":"circulation","ipa":"/ˌsɝkjəˈleɪʃən/","zh":"發行量；流通量","icon":"📚","ex":"The magazine has a monthly circulation of ten thousand copies.","tr":"這本雜誌的月發行量為一萬本。"},{"en":"print run","ipa":"/ˈprɪnt ˌrʌn/","zh":"一次印刷的批次或印量","icon":"📚","ex":"The first print run will be limited to five hundred copies.","tr":"首批只會印製五百份。"},{"en":"publisher","ipa":"/ˈpʌblɪʃɚ/","zh":"出版商；出版者","icon":"📚","ex":"The publisher offers an electronic version of the handbook.","tr":"出版商提供這本手冊的電子版。"},{"en":"edition","ipa":"/ɪˈdɪʃən/","zh":"版本；版次","icon":"📚","ex":"The latest edition includes the updated office directory.","tr":"最新版收錄了更新後的辦公室通訊錄。"},{"en":"ink","ipa":"/ɪŋk/","zh":"墨水；印刷油墨","icon":"📄","ex":"The printer ran out of ink during the job.","tr":"印表機在列印途中用完了墨水。"},{"en":"reprint","ipa":"/ˌriːˈprɪnt/","zh":"重印；再版（動詞）","icon":"📄","ex":"We need to reprint the forms with the correct phone number.","tr":"我們要用正確的電話號碼重新印製表單。"},{"en":"paper stock","ipa":"/ˈpeɪpɚ ˌstɑːk/","zh":"印刷用紙；紙材","icon":"📄","ex":"We chose a heavier paper stock for the cover.","tr":"我們替封面選了較厚的紙材。"},{"en":"cover page","ipa":"/ˈkʌvɚ ˌpeɪdʒ/","zh":"封面頁；首頁（文件用）","icon":"📄","ex":"Include the project name and date on the cover page.","tr":"請在封面頁列上專案名稱與日期。"},{"en":"flyer","ipa":"/ˈflaɪɚ/","zh":"傳單；宣傳單","icon":"📄","ex":"Staff handed out a flyer about the store’s extended hours.","tr":"店員發送了宣傳延長營業時間的傳單。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis||null;let voices=[];function load(){if(s)voices=s.getVoices()||[]}if(s){load();s.addEventListener?.("voiceschanged",load)}function speak(text,slow){if(!s||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援朗讀，請改用 Safari";return}s.cancel();load();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在慢速朗讀…":"正在朗讀…"};u.onend=()=>{$("status").textContent="朗讀完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="朗讀失敗，請確認音量或使用 Safari"};s.speak(u)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){const q=$("search").value.trim().toLowerCase(),found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of found){const c=el("article","card"),h=el("div","head"),inf=el("div"),ex=el("div","example"),b=el("div","buttons");inf.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","symbol",x.icon),inf);ex.append(el("div","",x.ex),el("div","tr",x.tr));b.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,b);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{s?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>s?.cancel());render();</script></body></html>
