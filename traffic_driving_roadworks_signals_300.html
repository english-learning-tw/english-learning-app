ple":"Be careful: mudslide may affect your trip.","translation":"請注意，土石滑落可能影響行車。"},{"en":"landslide","zh":"山崩","ipa":"/lˈændslˌaɪd/","cat":"天候與道路條件","example":"Be careful: landslide may affect your trip.","translation":"請注意，山崩可能影響行車。"},{"en":"fallen tree","zh":"倒木","ipa":"/fˈɑlʌn tɹˈi/","cat":"天候與道路條件","example":"Be careful: fallen tree may affect your trip.","translation":"請注意，倒木可能影響行車。"},{"en":"road hazard","zh":"道路危險狀況","ipa":"/ɹˈoʊd hˈæzɝd/","cat":"天候與道路條件","example":"Be careful: road hazard may affect your trip.","translation":"請注意，道路危險狀況可能影響行車。"},{"en":"weather warning","zh":"天氣警報","ipa":"/wˈɛðɝ wˈɔɹnɪŋ/","cat":"天候與道路條件","example":"Be careful: weather warning may affect your trip.","translation":"請注意，天氣警報可能影響行車。"},{"en":"drive carefully","zh":"小心駕駛","ipa":"/dɹˈaɪv kˈɛɹfʌli/","cat":"天候與道路條件","example":"Be careful: drive carefully may affect your trip.","translation":"請注意，小心駕駛可能影響行車。"}];
const CATS=[...new Set(DATA.map(x=>x.cat))];const $=id=>document.getElementById(id);let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('traffic300-favorites')||'[]'))}catch(e){}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音合成');return} speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('rate').value);const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function persist(){try{localStorage.setItem('traffic300-favorites',JSON.stringify([...saved]))}catch(e){}}
function render(){let q=$('search').value.trim().toLocaleLowerCase(),cat=$('category').value,f=$('favorites').checked;const rows=DATA.filter(x=>(!cat||x.cat===cat)&&(!f||saved.has(x.en))&&(!q||[x.en,x.zh,x.example,x.translation,x.cat].some(v=>v.toLocaleLowerCase().includes(q))));$('count').textContent=`顯示 ${rows.length} / 300 筆`;$('empty').style.display=rows.length?'none':'block';const list=$('list');list.replaceChildren();const frag=document.createDocumentFragment();for(let x of rows){let card=document.createElement('article');card.className='item';card.innerHTML=`<div class="heading"><h2>${escapeHTML(x.en)}</h2><span class="cat">${escapeHTML(x.cat)}</span></div><div class="ipa">${escapeHTML(x.ipa)}</div><div class="zh">${escapeHTML(x.zh)}</div><div class="example">${escapeHTML(x.example)}<small>${escapeHTML(x.translation)}</small></div><div class="actions"></div>`;let acts=card.querySelector('.actions');const mk=(text,fn,cl)=>{let b=document.createElement('button');b.textContent=text;b.type='button';if(cl)b.className=cl;b.addEventListener('click',fn);acts.appendChild(b)};mk('🔊 單字',()=>speak(x.en));mk('🔊 例句',()=>speak(x.example));mk(saved.has(x.en)?'★ 已收藏':'☆ 收藏',()=>{saved.has(x.en)?saved.delete(x.en):saved.add(x.en);persist();render()},saved.has(x.en)?'saved':'');frag.appendChild(card)}list.appendChild(frag);document.querySelectorAll('.chip').forEach(b=>{b.classList.toggle('active',b.dataset.cat===cat)})}
$('category').innerHTML='<option value="">全部分類（300 筆）</option>'+CATS.map(x=>`<option value="${escapeHTML(x)}">${escapeHTML(x)}</option>`).join('');const chips=$('chips');for(let x of ['',...CATS]){let b=document.createElement('button');b.className='chip';b.type='button';b.dataset.cat=x;b.textContent=x||'全部';b.addEventListener('click',()=>{$('category').value=x;render()});chips.appendChild(b)}$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('favorites').addEventListener('change',render);$('reset').addEventListener('click',()=>{$('search').value='';$('category').value='';$('favorites').checked=false;render()});$('random').addEventListener('click',()=>{const x=DATA[Math.floor(Math.random()*DATA.length)];$('search').value=x.en;$('category').value='';$('favorites').checked=false;render();speak(x.en)});render();
</script></body></html>
