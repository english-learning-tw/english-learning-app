<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214b88"><title>[10/30]主題商務會議｜多益高頻英文20單字</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20324b;background:#f3f7fc}*{box-sizing:border-box}body{margin:0;padding-bottom:100px}header{background:linear-gradient(120deg,#173967,#367ab8);color:white;padding:22px 16px}header h1{font-size:24px;margin:0 0 8px}header p{margin:0;font-size:14px;line-height:1.65}.wrap{max-width:1100px;margin:auto;padding:16px}.toolbar{display:flex;gap:10px;background:white;border:1px solid #dfe7f2;border-radius:16px;padding:14px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}input,select{font:inherit;border-radius:10px;border:1px solid #c5d5e8;padding:11px;width:100%}.count{color:#63758e;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.card{background:white;border:1px solid #dbe4f1;border-radius:19px;padding:17px;box-shadow:0 6px 18px #12345a0a}.head{display:flex;gap:12px;align-items:center}.pic{width:62px;height:62px;flex:none;border:1px solid #d5e5f8;border-radius:17px;background:#f0f6ff;display:grid;place-items:center;font-size:32px}.en{font-size:23px;font-weight:800;color:#1f4b8e;overflow-wrap:anywhere}.ipa{color:#617994;font-size:14px;margin-top:5px}.zh{font-weight:750;font-size:17px;margin:14px 0 8px}.example{line-height:1.65;font-size:15px}.translation{color:#5b718c;font-size:14px;line-height:1.6;margin-top:4px}.actions{display:flex;gap:8px;margin-top:14px}button{border:0;border-radius:11px;background:#2864b9;color:white;padding:11px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;flex:1}button.secondary{background:#e7effd;color:#2856a7}.back{position:fixed;right:15px;bottom:calc(16px + env(safe-area-inset-bottom));padding:14px 18px;border-radius:40px;background:#295eb4;color:white;text-decoration:none;font-weight:800;box-shadow:0 6px 18px #234a8370}.foot{color:#667c97;font-size:13px;line-height:1.55;margin-top:20px}@media(max-width:540px){header h1{font-size:21px}.cards{grid-template-columns:1fr}.en{font-size:21px}}</style></head><body><header><div class="wrap"><h1>📅 [10/30]主題商務會議｜多益高頻英文20單字</h1><p>TOEIC 商務會議情境｜20 個重要單字，包含 IPA 美式音標、繁體中文、中英例句及雙速度英文朗讀。</p></div></header><main class="wrap"><div class="toolbar"><input id="search" placeholder="搜尋英文或中文" aria-label="搜尋單字"><select id="speed" aria-label="發音速度"><option value=".7">慢速 0.7×</option><option value=".85" selected>練習 0.85×</option><option value="1">正常 1×</option></select></div><p class="count" id="count"></p><div id="cards" class="cards"></div><p class="foot">這是以多益常見職場情境設計的原創學習例句，並非官方公布的精確單字頻率排名。語音由裝置內建英文語音引擎播放。</p></main><a href="./" class="back">← 返回教材首頁</a><script>const DATA=[{"en": "agenda", "ipa": "/əˈdʒen.də/", "zh": "議程", "icon": "🗓️", "example": "Please review the agenda before the meeting.", "translation": "請在會議開始前檢視議程。"}, {"en": "attendee", "ipa": "/əˌtenˈdiː/", "zh": "與會者", "icon": "👥", "example": "Each attendee will receive a copy of the report.", "translation": "每位與會者都會收到一份報告。"}, {"en": "chairperson", "ipa": "/ˈtʃerˌpɝː.sən/", "zh": "會議主席", "icon": "🧑‍💼", "example": "The chairperson opened the meeting at nine.", "translation": "主席在九點宣布開會。"}, {"en": "minutes", "ipa": "/ˈmɪn.ɪts/", "zh": "會議紀錄", "icon": "📝", "example": "Please email the minutes to the entire team.", "translation": "請將會議紀錄寄給整個團隊。"}, {"en": "proposal", "ipa": "/prəˈpoʊ.zəl/", "zh": "提案", "icon": "📄", "example": "Our manager approved the new proposal.", "translation": "經理核准了新提案。"}, {"en": "deadline", "ipa": "/ˈded.laɪn/", "zh": "截止期限", "icon": "⏰", "example": "The deadline for the project is Friday.", "translation": "這個專案的截止期限是星期五。"}, {"en": "postpone", "ipa": "/poʊstˈpoʊn/", "zh": "延後", "icon": "📅", "example": "We need to postpone the meeting until Monday.", "translation": "我們需要把會議延到星期一。"}, {"en": "reschedule", "ipa": "/ˌriːˈskedʒ.uːl/", "zh": "重新安排時間", "icon": "🔁", "example": "Could we reschedule the presentation?", "translation": "我們可以重新安排簡報時間嗎？"}, {"en": "confirm", "ipa": "/kənˈfɝːm/", "zh": "確認", "icon": "✅", "example": "Please confirm your attendance by tomorrow.", "translation": "請在明天前確認是否出席。"}, {"en": "participant", "ipa": "/pɑːrˈtɪs.ə.pənt/", "zh": "參與者", "icon": "🙋", "example": "Every participant can ask questions afterward.", "translation": "每位參與者之後都可以發問。"}, {"en": "discussion", "ipa": "/dɪˈskʌʃ.ən/", "zh": "討論", "icon": "💬", "example": "The discussion focused on customer satisfaction.", "translation": "討論聚焦於顧客滿意度。"}, {"en": "objective", "ipa": "/əbˈdʒek.tɪv/", "zh": "目標", "icon": "🎯", "example": "Our main objective is to reduce operating costs.", "translation": "我們的主要目標是降低營運成本。"}, {"en": "strategy", "ipa": "/ˈstræt̬.ə.dʒi/", "zh": "策略", "icon": "♟️", "example": "The team discussed a new marketing strategy.", "translation": "團隊討論了一項新的行銷策略。"}, {"en": "budget", "ipa": "/ˈbʌdʒ.ɪt/", "zh": "預算", "icon": "💰", "example": "The department must stay within its budget.", "translation": "部門必須控制在預算範圍內。"}, {"en": "approve", "ipa": "/əˈpruːv/", "zh": "核准", "icon": "👍", "example": "The director must approve the final plan.", "translation": "主管必須核准最終計畫。"}, {"en": "feedback", "ipa": "/ˈfiːd.bæk/", "zh": "回饋意見", "icon": "🗣️", "example": "We appreciate your feedback on the proposal.", "translation": "感謝您對提案提供回饋。"}, {"en": "consensus", "ipa": "/kənˈsen.səs/", "zh": "共識", "icon": "🤝", "example": "The committee reached a consensus.", "translation": "委員會達成了共識。"}, {"en": "priority", "ipa": "/praɪˈɔːr.ə.t̬i/", "zh": "優先事項", "icon": "⭐", "example": "Improving service quality is our top priority.", "translation": "改善服務品質是我們的首要事項。"}, {"en": "implement", "ipa": "/ˈɪm.plə.ment/", "zh": "實施、執行", "icon": "⚙️", "example": "We will implement the changes next month.", "translation": "我們將在下個月實施這些變更。"}, {"en": "follow-up", "ipa": "/ˈfɑː.loʊ.ʌp/", "zh": "後續追蹤", "icon": "📨", "example": "I will send a follow-up email this afternoon.", "translation": "我今天下午會寄送後續追蹤電子郵件。"}],$=id=>document.getElementById(id);function speak(text){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('speed').value);speechSynthesis.speak(u)}function render(){const q=$('search').value.trim().toLowerCase();const list=DATA.filter(x=>(x.en+' '+x.zh+' '+x.example).toLowerCase().includes(q));$('count').textContent='顯示 '+list.length+' / 20 筆單字';const root=$('cards');root.replaceChildren();for(const x of list){const card=document.createElement('article');card.className='card';const h=document.createElement('div');h.className='head';const pic=document.createElement('div');pic.className='pic';pic.textContent=x.icon;const detail=document.createElement('div');const en=document.createElement('div');en.className='en';en.textContent=x.en;const ipa=document.createElement('div');ipa.className='ipa';ipa.textContent=x.ipa;detail.append(en,ipa);h.append(pic,detail);const zh=document.createElement('div');zh.className='zh';zh.textContent=x.zh;const ex=document.createElement('div');ex.className='example';ex.textContent=x.example;const trans=document.createElement('div');trans.className='translation';trans.textContent=x.translation;const actions=document.createElement('div');actions.className='actions';const a=document.createElement('button');a.textContent='🔊 單字';a.onclick=()=>speak(x.en);const b=document.createElement('button');b.className='secondary';b.textContent='🔊 例句';b.onclick=()=>speak(x.example);actions.append(a,b);card.append(h,zh,ex,trans,actions);root.append(card)}}$('search').addEventListener('input',render);render();</script></body></html>
