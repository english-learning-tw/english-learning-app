<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/27]主題企業公益與社區服務｜多益高頻英文20單字</title><meta name="theme-color" content="#176780"><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f9;color:#173849;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#183e5c,#178291);color:white;padding:24px 15px}.wrap{max-width:1080px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.45}.back{color:white;border:1px solid #c9e8ed;padding:10px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}main{max-width:1100px;padding:16px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:10px}input{min-width:180px;flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #b4ced9}button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px}.stop{background:#e8f2f5;color:#145b75;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:14px}.card{padding:17px;background:white;border:1px solid #d8e5ea;border-radius:16px}.head{display:flex;gap:12px;align-items:center}.symbol{background:#e8f4f7;padding:12px;border-radius:12px;font-size:27px}.word{color:#17687f;font-size:22px;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#577382}.meaning{font-weight:700;margin:13px 0}.example{background:#f3f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#526c77;margin-top:7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{color:white;background:#19718b;padding:8px 4px;font-size:14px;font-weight:700}.slow{background:#e6f2f7;color:#165c73;border:1px solid #bed8e0}.status{color:#4c6b78;font-size:14px}footer{text-align:center;color:#617b86;font-size:12px;padding:24px}*:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/27]主題企業公益與社區服務｜多益高頻英文20單字</h1><p>🤝 20 個職場單字｜🇺🇸 美式 IPA｜🔊 單字與例句｜🐢 慢速跟讀</p></div></header><main><div class="tools"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋英文、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></div><p class="status" id="status" aria-live="polite">共 20 個單字</p><section id="cards" class="grid"></section><p id="empty" hidden>沒有符合的單字。</p><footer>本教材使用原創 TOEIC 職場情境例句，並非 ETS 官方頻率排名。發音使用瀏覽器 Web Speech API，優先選用裝置可用的美式英語聲音。</footer></main><script>"use strict";const DATA=[{"en":"charity","ipa":"/ˈtʃærəti/","zh":"慈善機構","icon":"🤝","ex":"The company supports a local charity.","tr":"公司支持一家當地慈善機構。"},{"en":"donation","ipa":"/doʊˈneɪʃən/","zh":"捐款","icon":"🤝","ex":"We received a generous donation yesterday.","tr":"我們昨天收到一筆慷慨的捐款。"},{"en":"volunteer","ipa":"/ˌvɑlənˈtɪr/","zh":"志工","icon":"🤝","ex":"Each volunteer will receive a free lunch.","tr":"每位志工都會獲得免費午餐。"},{"en":"fundraiser","ipa":"/ˈfʌndˌreɪzər/","zh":"募款活動","icon":"🤝","ex":"The annual fundraiser begins at noon.","tr":"年度募款活動於中午開始。"},{"en":"nonprofit","ipa":"/ˌnɑnˈprɑfɪt/","zh":"非營利組織","icon":"🤝","ex":"The nonprofit offers free meals.","tr":"該非營利組織提供免費餐點。"},{"en":"contribution","ipa":"/ˌkɑntrəˈbjuʃən/","zh":"捐助；貢獻","icon":"🤝","ex":"Your contribution will help local families.","tr":"您的捐助將幫助當地家庭。"},{"en":"community","ipa":"/kəˈmjunəti/","zh":"社區","icon":"🤝","ex":"The company works closely with the community.","tr":"公司與社區密切合作。"},{"en":"initiative","ipa":"/ɪˈnɪʃətɪv/","zh":"新計畫；倡議","icon":"🤝","ex":"The initiative will support local schools.","tr":"這項計畫將支持當地學校。"},{"en":"grant","ipa":"/ɡrænt/","zh":"補助金","icon":"🤝","ex":"The center received a grant for new computers.","tr":"中心獲得購置新電腦的補助金。"},{"en":"foundation","ipa":"/faʊnˈdeɪʃən/","zh":"基金會","icon":"🤝","ex":"The foundation funds educational programs.","tr":"該基金會資助教育計畫。"},{"en":"raffle","ipa":"/ˈræfəl/","zh":"抽獎活動","icon":"🤝","ex":"Raffle tickets are available at the entrance.","tr":"抽獎券可在入口處取得。"},{"en":"auction","ipa":"/ˈɔkʃən/","zh":"拍賣","icon":"🤝","ex":"The charity auction will feature local artwork.","tr":"慈善拍賣將展售當地藝術作品。"},{"en":"pledge","ipa":"/pledʒ/","zh":"承諾；認捐","icon":"🤝","ex":"The firm made a pledge to support the shelter.","tr":"公司承諾支持收容所。"},{"en":"proceeds","ipa":"/ˈproʊsidz/","zh":"所得款項","icon":"🤝","ex":"All proceeds will go to the food bank.","tr":"所有所得款項將捐給食物銀行。"},{"en":"awareness","ipa":"/əˈwɛrnəs/","zh":"認知；意識","icon":"🤝","ex":"The campaign raises awareness of hunger.","tr":"該活動提高民眾對飢餓問題的認識。"},{"en":"participation","ipa":"/pɑrˌtɪsəˈpeɪʃən/","zh":"參與","icon":"🤝","ex":"Employee participation is optional.","tr":"員工可自由選擇是否參與。"},{"en":"distribute","ipa":"/dɪˈstrɪbjut/","zh":"分發","icon":"🤝","ex":"Staff will distribute meals on Friday.","tr":"員工將於星期五分發餐點。"},{"en":"relief","ipa":"/rɪˈlif/","zh":"救濟；援助","icon":"🤝","ex":"The company sent supplies for disaster relief.","tr":"公司運送物資支援災害救濟。"},{"en":"neighborhood","ipa":"/ˈneɪbərˌhʊd/","zh":"鄰近地區","icon":"🤝","ex":"Staff helped clean up the neighborhood.","tr":"員工協助清理附近社區。"},{"en":"shelter","ipa":"/ˈʃɛltər/","zh":"收容所","icon":"🤝","ex":"The shelter needs additional blankets.","tr":"收容所需要更多毛毯。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis||null;let voices=[];function load(){if(s)voices=s.getVoices()||[]}if(s){load();s.addEventListener?.("voiceschanged",load)}function speak(text,slow){if(!s||typeof SpeechSynthesisUtterance==="undefined"){$("status").textContent="此瀏覽器不支援朗讀，請改用 Safari";return}s.cancel();load();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;const v=voices.find(x=>x.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(v)u.voice=v;u.onstart=()=>{$("status").textContent=slow?"正在慢速朗讀…":"正在朗讀…"};u.onend=()=>{$("status").textContent="朗讀完成"};u.onerror=e=>{if(!["canceled","interrupted"].includes(e.error))$("status").textContent="朗讀失敗，請確認音量或使用 Safari"};s.speak(u)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,t,slow){const b=el("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){const q=$("search").value.trim().toLowerCase(),found=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),f=document.createDocumentFragment();for(const x of found){const c=el("article","card"),h=el("div","head"),inf=el("div"),ex=el("div","example"),b=el("div","buttons");inf.append(el("div","word",x.en),el("div","ipa",x.ipa));h.append(el("div","symbol",x.icon),inf);ex.append(el("div","",x.ex),el("div","tr",x.tr));b.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,el("div","meaning",x.zh),ex,b);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=found.length!==0;$("status").textContent="顯示 "+found.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>{s?.cancel();$("status").textContent="已停止發音"};window.addEventListener("pagehide",()=>s?.cancel());render();</script></body></html>
