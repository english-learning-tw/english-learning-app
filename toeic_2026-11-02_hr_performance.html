<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/02]主題人資管理與員工績效｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#18314a;font-family:system-ui,-apple-system,"PingFang TC",sans-serif;padding-bottom:85px}header{background:#17496b;color:white;padding:22px 16px}main{max-width:980px;margin:auto;padding:15px}h1{font-size:23px;line-height:1.4}input{width:100%;font-size:17px;padding:13px;border:1px solid #b7c8d8;border-radius:12px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:13px;margin-top:16px}.card{background:white;border:1px solid #d8e4ee;border-radius:17px;padding:17px}.head{display:flex;align-items:center;gap:12px}.emoji{font-size:30px}.word{font-size:23px;font-weight:800}.ipa{color:#60738a;margin:5px 0}.zh{font-weight:700;margin:12px 0}.example{line-height:1.6}.translation{color:#60738a;font-size:14px;line-height:1.6;margin:6px 0 12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{background:#235e92;color:white;border:0;border-radius:10px;padding:12px 5px;font-size:14px;min-height:44px}.slow{background:#e7f0f9;color:#1d4e7a}a.back{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#183d60;color:white;border-radius:30px;padding:13px 17px;text-decoration:none;font-weight:bold}small{color:#61758b}</style></head><body><header><h1>[11/02]主題人資管理與員工績效｜多益高頻英文20單字</h1><p>20 個職場詞彙 · 美式 IPA · 中英例句 · 正常與慢速跟讀</p></header><main><input id="search" type="search" placeholder="搜尋英文、中文或例句" aria-label="搜尋"><p id="count"></p><section id="cards"></section><p><small>語音使用裝置的英文文字轉語音功能；語音品質依 iPhone 與瀏覽器設定而異。詞彙選自常見 TOEIC 職場情境，並非官方頻率排名。</small></p></main><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><script>const D=[["appraisal","/əˈpreɪ.zəl/","績效評估","📊","The annual appraisal will take place in December.","年度績效評估將於十二月進行。"],["probation","/proʊˈbeɪ.ʃən/","試用期","📅","New employees must complete a three-month probation period.","新進員工必須完成三個月的試用期。"],["orientation","/ˌɔːr.i.enˈteɪ.ʃən/","職前訓練","🧭","The orientation session begins at nine on Monday.","職前訓練課程將於週一九點開始。"],["supervisor","/ˈsuː.pɚˌvaɪ.zɚ/","主管","👔","Please ask your supervisor to sign the form.","請主管在表格上簽名。"],["subordinate","/səˈbɔːr.dən.ət/","下屬","👥","The manager assigned tasks to each subordinate.","經理將工作分配給每位下屬。"],["promotion","/prəˈmoʊ.ʃən/","升遷","📈","She received a promotion after leading the project.","她領導該專案後獲得升遷。"],["incentive","/ɪnˈsen.tɪv/","獎勵措施","🎁","The company offers incentives for outstanding performance.","公司提供獎勵措施給表現優異的員工。"],["compensation","/ˌkɑːm.penˈseɪ.ʃən/","薪酬","💵","The position includes competitive compensation and benefits.","這個職位提供具競爭力的薪酬與福利。"],["payroll","/ˈpeɪ.roʊl/","薪資名冊；薪資發放","💳","The payroll department processes salaries twice a month.","薪資部門每月處理兩次薪資發放。"],["absenteeism","/ˌæb.sənˈtiː.ɪ.zəm/","缺勤情形","📉","The new attendance policy aims to reduce absenteeism.","新的出勤政策旨在降低缺勤率。"],["turnover","/ˈtɝːnˌoʊ.vɚ/","人員流動率","🔄","Employee turnover has decreased since last year.","員工流動率自去年起已下降。"],["retention","/rɪˈten.ʃən/","員工留任","🤝","Flexible schedules can improve employee retention.","彈性工時有助於提高員工留任率。"],["eligibility","/ˌel.ə.dʒəˈbɪl.ə.ti/","資格條件","📋","Please check your eligibility for the training program.","請確認自己是否符合訓練計畫的參加資格。"],["entitlement","/ɪnˈtaɪ.təl.mənt/","應享有的權益","⚖️","Employees can review their leave entitlements online.","員工可以在線上查看自己的休假權益。"],["grievance","/ˈɡriː.vəns/","員工申訴","🗣️","Human Resources will investigate the employee's grievance.","人資部門將調查該員工的申訴。"],["compliance","/kəmˈplaɪ.əns/","遵循規定","🛡️","All staff must complete the annual compliance training.","所有員工都必須完成年度法規遵循訓練。"],["evaluation","/ɪˌvæl.juˈeɪ.ʃən/","評量","📝","The evaluation results will be shared with each employee.","評量結果將提供給每位員工。"],["competency","/ˈkɑːm.pə.tən.si/","職務能力","🎯","Communication is a key competency for this role.","溝通是這個職位的重要能力。"],["mentorship","/ˈmen.tɚ.ʃɪp/","導師指導制度","🧑‍🏫","The mentorship program pairs new hires with experienced staff.","導師制度會讓新進員工與資深員工配對。"],["workload","/ˈwɝːk.loʊd/","工作量","🗂️","The team hired an assistant to manage the increased workload.","團隊聘請了一位助理來應付增加的工作量。"]];function say(t,slow){if(!window.speechSynthesis){alert('此瀏覽器不支援語音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?0.68:1;speechSynthesis.speak(u)}function render(){let q=document.getElementById('search').value.toLowerCase().trim(),rows=D.filter(x=>x.join(' ').toLowerCase().includes(q)),root=document.getElementById('cards');root.replaceChildren();document.getElementById('count').textContent='顯示 '+rows.length+' / 20 筆';for(let x of rows){let c=document.createElement('article');c.className='card';let h=document.createElement('div');h.className='head';let e=document.createElement('div');e.className='emoji';e.textContent=x[3];let w=document.createElement('div');let a=document.createElement('div');a.className='word';a.textContent=x[0];let p=document.createElement('div');p.className='ipa';p.textContent=x[1];w.append(a,p);h.append(e,w);c.append(h);for(let [cl,t] of [['zh',x[2]],['example',x[4]],['translation',x[5]]]){let d=document.createElement('div');d.className=cl;d.textContent=t;c.append(d)}let bs=document.createElement('div');bs.className='buttons';for(let [txt,spoken,slow] of [['🔊 單字',x[0],false],['🐢 慢速單字',x[0],true],['🔊 例句',x[4],false],['🐢 慢速例句',x[4],true]]){let b=document.createElement('button');b.textContent=txt;if(slow)b.className='slow';b.onclick=()=>say(spoken,slow);bs.append(b)}c.append(bs);root.append(c)}}document.getElementById('search').addEventListener('input',render);render();</script></body></html>
