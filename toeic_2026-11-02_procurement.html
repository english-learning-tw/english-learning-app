<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/02]主題採購與供應商管理｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1c3048;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{background:#214d80;color:white;padding:22px 16px}main{max-width:900px;margin:auto;padding:16px 16px 90px}h1{font-size:24px;line-height:1.5}input{width:100%;padding:14px;font-size:16px;border:1px solid #aac0d8;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}.card{background:white;border-radius:16px;padding:17px;box-shadow:0 2px 12px #17365515}.word{font-size:23px;font-weight:800;color:#214d80}.ipa{color:#536d89}.zh{font-weight:700;margin:12px 0}.ex{line-height:1.65}.tr{color:#5b6e81;font-size:14px;margin:8px 0 14px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{background:#255e9b;color:white;border:0;border-radius:10px;padding:12px 5px;font-size:14px;cursor:pointer}.slow{background:#e6eff9;color:#214d80}a.home{position:fixed;right:15px;bottom:calc(14px + env(safe-area-inset-bottom));background:#214d80;color:white;text-decoration:none;border-radius:24px;padding:13px 18px}small{color:#dce9f6}p.note{font-size:13px;color:#61758b;line-height:1.6}</style></head><body><header><h1>[11/02]主題採購與供應商管理｜多益高頻英文20單字</h1><small>美式 IPA · 繁體中文 · 職場例句 · 正常／慢速跟讀</small></header><main><input id="q" type="search" placeholder="搜尋英文、中文或例句" aria-label="搜尋單字"><p id="count"></p><div id="grid" class="grid"></div><p class="note">語音使用裝置內建 en-US 文字轉語音。教材選字依常見職場情境，非 ETS 官方字頻排名。</p></main><a class="home" href="./index.html">← 返回 English Learning App 首頁</a><script>const data=[{"en":"quotation","ipa":"/kwoʊˈteɪ.ʃən/","zh":"報價單","ex":"The supplier sent a revised quotation this morning.","tr":"供應商今天早上寄來修訂後的報價單。","icon":"📄"},{"en":"supplier","ipa":"/səˈplaɪ.ɚ/","zh":"供應商","ex":"We are looking for a reliable supplier of office furniture.","tr":"我們正在尋找可靠的辦公家具供應商。","icon":"🏭"},{"en":"vendor","ipa":"/ˈven.dɚ/","zh":"賣方；供應商","ex":"The vendor offers free delivery for large orders.","tr":"該供應商針對大量訂單提供免費配送。","icon":"🏬"},{"en":"purchase order","ipa":"/ˈpɝː.tʃəs ˌɔːr.dɚ/","zh":"採購訂單","ex":"Please issue a purchase order before Friday.","tr":"請在星期五前開立採購訂單。","icon":"🧾"},{"en":"inventory","ipa":"/ˈɪn.vən.tɔːr.i/","zh":"庫存","ex":"The warehouse checks its inventory every month.","tr":"倉庫每個月盤點庫存。","icon":"📦"},{"en":"stock","ipa":"/stɑːk/","zh":"存貨","ex":"The replacement parts are currently out of stock.","tr":"替換零件目前缺貨。","icon":"🗃️"},{"en":"bulk","ipa":"/bʌlk/","zh":"大量的；批量","ex":"Buying supplies in bulk can reduce costs.","tr":"大量採購用品可以降低成本。","icon":"📦"},{"en":"discount","ipa":"/ˈdɪs.kaʊnt/","zh":"折扣","ex":"We negotiated a ten percent discount on the equipment.","tr":"我們就設備價格談妥了百分之十的折扣。","icon":"🏷️"},{"en":"invoice","ipa":"/ˈɪn.vɔɪs/","zh":"發票；請款單","ex":"The accounting team needs the invoice for payment.","tr":"會計團隊需要發票才能付款。","icon":"🧮"},{"en":"procurement","ipa":"/prəˈkjʊr.mənt/","zh":"採購","ex":"The procurement department evaluates potential suppliers.","tr":"採購部門會評估潛在供應商。","icon":"🛒"},{"en":"specification","ipa":"/ˌspes.ə.fəˈkeɪ.ʃən/","zh":"規格","ex":"The product must meet all technical specifications.","tr":"產品必須符合所有技術規格。","icon":"📐"},{"en":"negotiate","ipa":"/nɪˈɡoʊ.ʃi.eɪt/","zh":"協商","ex":"Our team will negotiate the delivery schedule.","tr":"我們的團隊將協商交貨時程。","icon":"🤝"},{"en":"contractor","ipa":"/ˈkɑːn.træk.tɚ/","zh":"承包商","ex":"The contractor will install the new equipment next week.","tr":"承包商下週將安裝新設備。","icon":"👷"},{"en":"tender","ipa":"/ˈten.dɚ/","zh":"投標；標案","ex":"Three companies submitted tenders for the project.","tr":"三家公司為該專案提交投標文件。","icon":"📑"},{"en":"bid","ipa":"/bɪd/","zh":"投標；出價","ex":"The company submitted the lowest bid.","tr":"該公司提出了最低標價。","icon":"💼"},{"en":"requisition","ipa":"/ˌrek.wəˈzɪʃ.ən/","zh":"請購申請","ex":"Employees must complete a requisition for new supplies.","tr":"員工必須填寫新用品的請購申請。","icon":"📝"},{"en":"backorder","ipa":"/ˈbækˌɔːr.dɚ/","zh":"缺貨待補訂單","ex":"The chairs are on backorder until next month.","tr":"椅子目前缺貨，須等到下個月才能補貨。","icon":"⏳"},{"en":"warranty","ipa":"/ˈwɔːr.ən.t̬i/","zh":"保固","ex":"The printer comes with a two-year warranty.","tr":"這台印表機附有兩年保固。","icon":"🛡️"},{"en":"shipment","ipa":"/ˈʃɪp.mənt/","zh":"出貨；貨運批次","ex":"The shipment is expected to arrive on Tuesday.","tr":"這批貨預計星期二抵達。","icon":"🚚"},{"en":"refund","ipa":"/ˈriː.fʌnd/","zh":"退款","ex":"The supplier agreed to issue a full refund.","tr":"供應商同意全額退款。","icon":"💳"}];function speak(t,slow){if(!('speechSynthesis'in window)){alert('裝置不支援語音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?.68:1;let vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase()==='en-us');if(v)u.voice=v;speechSynthesis.speak(u)}function render(){let q=document.getElementById('q').value.toLowerCase().trim(),items=data.filter(x=>[x.en,x.zh,x.ex,x.tr].join(' ').toLowerCase().includes(q)),g=document.getElementById('grid');g.replaceChildren();document.getElementById('count').textContent='顯示 '+items.length+' / 20 個單字';for(let x of items){let c=document.createElement('article');c.className='card';for(let [cls,txt] of [['word',x.icon+' '+x.en],['ipa',x.ipa],['zh',x.zh],['ex',x.ex],['tr',x.tr]]){let d=document.createElement('div');d.className=cls;d.textContent=txt;c.append(d)}let a=document.createElement('div');a.className='actions';for(let [t,s,label] of [[x.en,false,'🔊 單字'],[x.en,true,'🐢 慢速單字'],[x.ex,false,'🔊 例句'],[x.ex,true,'🐢 慢速例句']]){let b=document.createElement('button');b.textContent=label;b.className=s?'slow':'';b.onclick=()=>speak(t,s);a.append(b)}c.append(a);g.append(c)}}document.getElementById('q').addEventListener('input',render);render();</script></body></html>
