<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Names of Lights</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial;background:linear-gradient(#f3faf4,#fbfdfb);color:#163b24}header{text-align:center;padding:36px 18px 22px}h1{font-size:clamp(34px,7vw,58px);margin:0;color:#114d28}header p{color:#617267;line-height:1.7}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:white;border:1px solid #d9e8dc;padding:8px 13px;border-radius:999px;font-weight:800}.toolbar{position:sticky;top:0;z-index:5;background:#f9fcf9ee;backdrop-filter:blur(10px);padding:10px;border-block:1px solid #dbe8de}.controls{max-width:1100px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}input,select,button{border:1px solid #d3e1d6;border-radius:12px;padding:10px 12px;background:white;font-size:15px}input{flex:1;min-width:220px}button{font-weight:800;cursor:pointer}.primary,.speak{background:#176134;color:white;border:0}.grid{width:min(1100px,calc(100% - 24px));margin:18px auto 45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #dce9df;border-radius:22px;padding:16px;display:grid;grid-template-columns:105px 1fr;gap:14px}.visual{height:105px;border-radius:18px;background:#eaf5ed;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}.num{position:absolute;top:7px;left:7px;background:#ffffffdd;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.word{margin:0;color:#114d28;font-size:24px}.meaning{font-weight:850}.example{border-top:1px dashed #d7e4da;padding-top:9px;line-height:1.55}.muted{color:#66766c}.fav.active{background:#fff4bf}.learn.active{background:#e8ffed}.modal{position:fixed;inset:0;background:#11182799;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.panel{background:white;border-radius:24px;padding:24px;width:min(650px,100%)}.question{font-size:34px;font-weight:900;color:#114d28}.answers{display:grid;gap:8px}.answer.correct{background:#e8fff0}.answer.wrong{background:#fff0f0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.flash{text-align:center}.bigicon{font-size:86px}.bigword{font-size:40px;font-weight:900;color:#114d28}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media(max-width:500px){.card{grid-template-columns:1fr;text-align:center}.visual{width:105px;margin:auto}.top{justify-content:center}.example{text-align:left}}
</style></head><body>
<header><h1>💡 Names of Lights</h1><p>圖片中的 20 種燈具英文，含中文、例句、發音、收藏、測驗與單字卡。</p><div class="stats"><span class="stat">20 個單字</span><span class="stat" id="favCount">收藏 0</span><span class="stat" id="learnCount">已學會 0</span></div></header>
<div class="toolbar"><div class="controls"><input id="q" placeholder="搜尋英文或中文"><select id="status"><option value="">全部單字</option><option value="fav">只看收藏</option><option value="learn">只看已學會</option></select><button id="shuffle">🔀 隨機</button><button id="quiz" class="primary">📝 測驗</button><button id="flash" class="primary">🃏 單字卡</button><button id="stop">⏹ 停止</button></div></div>
<main id="grid" class="grid"></main>
<div id="modal" class="modal"><div class="panel"><div id="body"></div><div class="actions"><button id="close">關閉</button><button id="next" class="primary">下一題</button></div></div></div>
<script>
const words=[{"word": "Lamp", "zh": "燈／檯燈", "icon": "💡", "ex": "A lamp gives soft light to a room.", "tr": "燈可以為房間提供柔和的光線。"}, {"word": "Chandelier", "zh": "吊燈／水晶燈", "icon": "✨", "ex": "The chandelier hangs above the dining table.", "tr": "水晶吊燈懸掛在餐桌上方。"}, {"word": "Lantern", "zh": "燈籠／提燈", "icon": "🏮", "ex": "We carried a lantern while walking outside at night.", "tr": "晚上在戶外行走時，我們提著燈籠。"}, {"word": "Bulb", "zh": "燈泡", "icon": "💡", "ex": "This bulb uses less electricity than the old one.", "tr": "這顆燈泡比舊燈泡更省電。"}, {"word": "Torch", "zh": "手電筒（英式）", "icon": "🔦", "ex": "Take a torch with you when you go camping.", "tr": "露營時請帶一支手電筒。"}, {"word": "Floodlight", "zh": "泛光燈", "icon": "🏟️", "ex": "The floodlights brighten the entire sports field.", "tr": "泛光燈照亮了整座運動場。"}, {"word": "Desk Lamp", "zh": "書桌燈", "icon": "🛋️", "ex": "I use a desk lamp when I read at night.", "tr": "晚上閱讀時，我會使用書桌燈。"}, {"word": "Wall Sconce", "zh": "壁燈", "icon": "🧱", "ex": "The wall sconce creates a warm atmosphere in the hallway.", "tr": "壁燈在走廊營造出溫暖的氛圍。"}, {"word": "Flashlight", "zh": "手電筒（美式）", "icon": "🔦", "ex": "The flashlight helped us see during the power outage.", "tr": "停電時，手電筒幫助我們看清楚。"}, {"word": "Spotlight", "zh": "聚光燈", "icon": "🎭", "ex": "A spotlight shone on the singer during the performance.", "tr": "表演時，聚光燈照在歌手身上。"}, {"word": "Ceiling Light", "zh": "吸頂燈／天花板燈", "icon": "🔆", "ex": "The ceiling light is bright enough for the whole room.", "tr": "吸頂燈的亮度足以照亮整個房間。"}, {"word": "Recessed Light", "zh": "嵌燈／筒燈", "icon": "⬇️", "ex": "Recessed lights make the ceiling look clean and modern.", "tr": "嵌燈讓天花板看起來整潔又現代。"}, {"word": "Neon Light", "zh": "霓虹燈", "icon": "🌈", "ex": "The neon light outside the shop is easy to notice.", "tr": "店外的霓虹燈很容易被注意到。"}, {"word": "Streetlight", "zh": "路燈", "icon": "🚏", "ex": "The streetlights turn on automatically after sunset.", "tr": "日落後，路燈會自動亮起。"}, {"word": "Night Light", "zh": "小夜燈", "icon": "🌙", "ex": "The child sleeps with a small night light beside the bed.", "tr": "孩子睡覺時，床邊會開著一盞小夜燈。"}, {"word": "Track Light", "zh": "軌道燈", "icon": "🎯", "ex": "Track lights can be pointed in different directions.", "tr": "軌道燈可以朝不同方向調整。"}, {"word": "Candle", "zh": "蠟燭", "icon": "🕯️", "ex": "She lit a candle during dinner.", "tr": "晚餐時，她點了一根蠟燭。"}, {"word": "Fairy Lights", "zh": "串燈／仙女燈", "icon": "🎄", "ex": "We decorated the balcony with fairy lights.", "tr": "我們用串燈裝飾陽台。"}, {"word": "Pendant Light", "zh": "吊墜燈／吊燈", "icon": "🔔", "ex": "A pendant light hangs over the kitchen counter.", "tr": "一盞吊燈懸掛在廚房流理台上方。"}, {"word": "Solar Light", "zh": "太陽能燈", "icon": "☀️", "ex": "Solar lights charge during the day and turn on at night.", "tr": "太陽能燈白天充電，晚上亮起。"}];let fav=JSON.parse(localStorage.getItem("lightsFav")||"[]"),learn=JSON.parse(localStorage.getItem("lightsLearn")||"[]"),shown=[...words],mode="quiz",target=null;
const grid=document.getElementById("grid"),q=document.getElementById("q"),status=document.getElementById("status"),modal=document.getElementById("modal"),body=document.getElementById("body");
function stats(){favCount.textContent="收藏 "+fav.length;learnCount.textContent="已學會 "+learn.length}
function save(){localStorage.setItem("lightsFav",JSON.stringify(fav));localStorage.setItem("lightsLearn",JSON.stringify(learn));stats()}
function speak(t){if(!("speechSynthesis" in window))return alert("此瀏覽器不支援發音");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
function filter(){let s=q.value.toLowerCase().trim();shown=words.filter(x=>(!s||(x.word+" "+x.zh).toLowerCase().includes(s))&&(!status.value||(status.value==="fav"?fav.includes(x.word):learn.includes(x.word))));render(shown)}
function render(list){grid.innerHTML="";list.forEach((x,i)=>{let el=document.createElement("article");el.className="card";el.innerHTML=`<div class="visual"><span class="num">${i+1}</span>${x.icon}</div><div><div class="top"><h2 class="word">${x.word}</h2><button class="speak">🔊 單字</button><button class="fav ${fav.includes(x.word)?"active":""}">⭐</button><button class="learn ${learn.includes(x.word)?"active":""}">✔</button></div><p class="meaning">中文：${x.zh}</p><div class="example"><p><b>例句：</b>${x.ex}</p><button class="speakEx">🔊 例句</button><p class="muted"><b>中文：</b>${x.tr}</p></div></div>`;el.querySelector(".speak").onclick=()=>speak(x.word);el.querySelector(".speakEx").onclick=()=>speak(x.ex);el.querySelector(".fav").onclick=()=>toggle(fav,x.word);el.querySelector(".learn").onclick=()=>toggle(learn,x.word);grid.appendChild(el)})}
function toggle(a,w){a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();filter()}
function quiz(){mode="quiz";target=words[Math.floor(Math.random()*words.length)];let opts=[target,...words.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);body.innerHTML=`<h2>選出正確中文</h2><div class="question">${target.word}</div><div class="answers">${opts.map((x,i)=>`<button class="answer" data-i="${i}">${x.zh}</button>`).join("")}</div>`;body.querySelectorAll(".answer").forEach((b,i)=>b.onclick=()=>{body.querySelectorAll(".answer").forEach(z=>z.disabled=true);b.classList.add(opts[i]===target?"correct":"wrong")})}
function flash(){mode="flash";target=words[Math.floor(Math.random()*words.length)];body.innerHTML=`<div class="flash"><div class="bigicon">${target.icon}</div><div class="bigword">${target.word}</div><button id="say">🔊 單字</button><div id="ans" class="hidden"><h3>${target.zh}</h3><p>${target.ex}</p><p>${target.tr}</p></div><button id="reveal">顯示答案</button></div>`;say.onclick=()=>speak(target.word);reveal.onclick=()=>ans.classList.remove("hidden")}
q.oninput=filter;status.onchange=filter;shuffle.onclick=()=>{shown.sort(()=>Math.random()-.5);render(shown)};quiz.onclick=()=>{modal.classList.add("show");window.quiz()};flash.onclick=()=>{modal.classList.add("show");window.flash()};close.onclick=()=>modal.classList.remove("show");next.onclick=()=>mode==="quiz"?window.quiz():window.flash();stop.onclick=()=>speechSynthesis.cancel();stats();render(words);
</script>
