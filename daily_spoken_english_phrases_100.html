<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',Arial;background:linear-gradient(#f4f7fb,#fff);color:#202936}header{text-align:center;padding:36px 18px 22px}h1{margin:0;color:#253c65;font-size:clamp(30px,6vw,48px)}header p{max-width:900px;margin:10px auto;color:#687386;line-height:1.7}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:white;border:1px solid #dce3ec;padding:8px 13px;border-radius:999px;font-weight:800}.toolbar{position:sticky;top:0;z-index:5;background:#fcfdfff0;backdrop-filter:blur(10px);padding:10px;border-bottom:1px solid #dce3ec}.controls{max-width:1200px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}input,select,button{border:1px solid #d5dde8;border-radius:12px;padding:10px 12px;background:white;font-size:15px}input{flex:1;min-width:220px}button{font-weight:800;cursor:pointer}.primary,.speak{background:#2f527e;color:white;border:0}.grid{width:min(1200px,calc(100% - 24px));margin:18px auto 45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e0e6ee;border-radius:22px;padding:16px}.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.num,.badge{background:#eef3f8;color:#2f527e;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.phrase{margin:0;color:#253c65;font-size:24px}.meaning{font-size:18px;font-weight:850}.note{border-top:1px dashed #d8e0e9;padding-top:9px;color:#687386}.fav.active{background:#fff4bc}.learn.active{background:#e8ffed}.modal{position:fixed;inset:0;background:#11182799;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.panel{background:white;border-radius:24px;padding:24px;width:min(650px,100%)}.answers{display:grid;gap:8px}.answer.correct{background:#e8fff4}.answer.wrong{background:#fff0f0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.bigphrase{font-size:36px;font- <header><h1>💬 生活英文口語片語 100 句</h1><p>收錄你圖片中的 go nuts、agree to disagree、out of the blue、You got this、I don't buy it、hit the sack、Give me some credit 等，再補充 100 句同類型常用口語。</p><div class='stats'><span class='stat'>100 句口語</span><span class='stat' id='catCount'></span><span class='stat' id='favCount'>收藏 0</span><span class='stat' id='learnCount'>已學會 0</span></div></header>
<div class='toolbar'><div class='controls'><input id='q' placeholder='搜尋英文或中文'><select id='cat'><option value=''>全部分類</option></select><select id='status'><option value=''>全部句子</option><option value='fav'>只看收藏</option><option value='learn'>只看已學會</option></select><button id='shuffle'>🔀 隨機</button><button id='quiz' class='primary'>📝 測驗</button><button id='flash' class='primary'>🃏 單句卡</button><button id='stop'>⏹ 停止</button></div></div>

y": "衝突回應"}, {"id": 56, "phrase": "Suit yourself", "zh": "隨你便", "category": "衝突回應"}, {"id": 57, "phrase": "Be my guest", "zh": "請便／請自便", "category": "社交禮貌"}, {"id": 58, "phrase": "After you", "zh": "你先請", "category": "社交禮貌"}, {"id": 59, "phrase": "No worries", "zh": "別擔心／沒事", "category": "安慰回應"}, {"id": 60, "phrase": "No problem", "zh": "沒問題", "category": "同意回應"}, {"id": 61, "phrase": "Sounds good", "zh": "聽起來不錯", "category": "同意回應"}, {"id": 62, "phrase": "Works for me", "zh": "我可以／這樣行", "category": "同意回應"}, {"id": 63, "phrase": "I'm in", "zh": "算我一個", "category": "邀請提議"}, {"id": 64, "phrase": "I'm out", "zh": "我不參加", "category": "邀請提議"}, {"id": 65, "phrase": "Count me in", "zh": "算我一份", "category": "邀請提議"}, {"id": 66, "phrase": "Maybe next time", "zh": "下次吧", "category": "邀請提議"}, {"id": 67, "phrase": "Why not?", "zh": "為什麼不呢？", "category": "邀請提議"}, {"id": 68, "phrase": "Go for it", "zh": "去做吧", "category": "鼓勵支持"}, {"id": 69, "phrase": "Give it a shot", "zh": "試試看", "category": "鼓勵支持"}, {"id": 70, "phrase": "It's worth a shot", "zh": "值得一試", "category": "鼓勵支持"}, {"id": 71, "phrase": "Fingers crossed", "zh": "祝你好運", "category": "鼓勵支持"}, {"id": 72, "phrase": "Wish me luck", "zh": "祝我好運", "category": "鼓勵支持"}, {"id": 73, "phrase": "You never know", "zh": "很難說／誰知道呢", "category": "日常描述"}, {"id": 74, "phrase": "It depends", "zh": "看情況", "category": "日常描述"}, {"id": 75, "phrase": "It rings a bell", "zh": "聽起來有印象", "category": "記憶思考"}, {"id": 76, "phrase": "It slipped my mind", "zh": "我忘了", "category": "記憶思考"}, {"id": 77, "phrase": "I have no clue", "zh": "我完全不知道", "category": "記憶思考"}, {"id": 78, "phrase": "Beats me", "zh": "我也不知道", "category": "記憶思考"}, {"id": 79, "phrase": "Let me think", "zh": "讓我想想", "category": "記憶思考"}, {"id": 80, "phrase": "Think it over", "zh": "好好考慮一下", "category": "記憶思考"}, {"id": 81, "phrase": "Make up your mind", "zh": "做決定吧", "category": "記憶思考"}, {"id": 82, "phrase": "Sleep on it", "zh": "睡一晚再決定", "category": "記憶思考"}, {"id": 83, "phrase": "That's the point", "zh": "重點就在這", "category": "溝通互動"}, {"id": 84, "phrase": "You have a point", "zh": "你說得有道理", "category": "溝通互動"}, {"id": 85, "phrase": "Fair enough", "zh": "有道理／可以接受", "category": "同意回應"}, {"id": 86, "phrase": "I see your point", "zh": "我懂你的意思", "category": "溝通互動"}, {"id": 87, "phrase": "That's not the point", "zh": "重點不是這個", "category": "溝通互動"}, {"id": 88, "phrase": "Don't get me wrong", "zh": "別誤會我的意思", "category": "溝通互動"}, {"id": 89, "phrase": "What do you mean?", "zh": "你是什麼意思？", "category": "溝通互動"}, {"id": 90, "phrase": "Say no more", "zh": "不用多說／我懂了", "category": "溝通互動"}, {"id": 91, "phrase": "You read my mind", "zh": "你說中我心裡想的", "category": "溝通互動"}, {"id": 92, "phrase": "Same here", "zh": "我也是", "category": "同意回應"}, {"id": 93, "phrase": "Tell me about it", "zh": "可不是嗎／我超懂", "category": "同意回應"}, {"id": 94, "phrase": "I'm beat", "zh": "我累壞了", "category": "身體狀況"}, {"id": 95, "phrase": "I'm starving", "zh": "我餓死了", "category": "身體狀況"}, {"id": 96, "phrase": "I'm stuffed", "zh": "我吃太飽了", "category": "身體狀況"}, {"id": 97, "phrase": "I'm broke", "zh": "我沒錢了", "category": "日常狀況"}, {"id": 98, "phrase": "I'm swamped", "zh": "我忙翻了", "category": "日常狀況"}, {"id": 99, "phrase": "I'm running late", "zh": "我要遲到了", "category": "日常狀況"}, {"id": 100, "phrase": "I'm in a rush", "zh": "我趕時間", "category": "日常狀況"}];let fav=JSON.parse(localStorage.getItem('spoken100Fav')||'[]'),learn=JSON.parse(localStorage.getItem('spoken100Learn')||'[]'),shown=[...phrases],mode='quiz',target=null;const q=document.getElementById('q'),cat=document.getElementById('cat'),status=document.getElementById('status'),grid=document.getElementById('grid'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');const cats=[...new Set(phrases.map(x=>x.category))];cats.forEach(x=>cat.insertAdjacentHTML('beforeend',`<option>${x}</option>`));catCount.textContent=cats.length+' 種情境分類';function stats(){favCount.textContent='收藏 '+fav.length;learnCount.textContent='已學會 '+learn.length}function save(){localStorage.setItem('spoken100Fav',JSON.stringify(fav));localStorage.setItem('spoken100Learn',JSON.stringify(learn));stats()}function speak(t){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援發音');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}function filter(){let s=q.value.toLowerCase().trim();shown=phrases.filter(x=>(!s||(x.phrase+' '+x.zh+' '+x.category).toLowerCase().includes(s))&&(!cat.value||x.category===cat.value)&&(!status.value||(status.value==='fav'?fav.includes(x.phrase):learn.includes(x.phrase))));render(shown)}function render(list){grid.innerHTML='';if(!list.length){grid.innerHTML="<div class='empty'>找不到符合條件的片語。</div>";return}list.forEach(x=>{let el=document.createElement('article');el.className='card';el.innerHTML=`<div class='top'><span class='num'>${x.id}</span><h2 class='phrase'>${x.phrase}</h2><span class='badge'>${x.category}</span><button class='speak'>🔊 片語</button><button class='fav ${fav.includes(x.phrase)?'active':''}'>⭐</button><button class='learn ${learn.includes(x.phrase)?'active':''}'>✔</button></div><p class='meaning'>中文：${x.zh}</p><div class='note'>這是日常口語常見表達，使用時注意語氣與情境。</div>`;el.querySelector('.speak').onclick=()=>speak(x.phrase);el.querySelector('.fav').onclick=()=>toggle(fav,x.phrase);el.querySelector('.learn').onclick=()=>toggle(learn,x.phrase);grid.appendChild(el)})}function toggle(a,w){a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();filter()}function quizMode(){mode='quiz';target=phrases[Math.floor(Math.random()*phrases.length)];let opts=[target,...phrases.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);modalBody.innerHTML=`<h2>選出正確中文</h2><div class='bigphrase'>${target.phrase}</div><div class='answers'>${opts.map((x,i)=>`<button class='answer' data-i='${i}'>${x.zh}</button>`).join('')}</div>`;modalBody.querySelectorAll('.answer').forEach((b,i)=>b.onclick=()=>{modalBody.querySelectorAll('.answer').forEach(z=>z.disabled=true);b.classList.add(opts[i]===target?'correct':'wrong')})}function flashMode(){mode='flash';target=phrases[Math.floor(Math.random()*phrases.length)];modalBody.innerHTML=`<div style='text-align:center'><div class='bigphrase'>${target.phrase}</div><p>${target.category}</p><button id='say'>🔊 片語</button><div id='ans' class='hidden'><h3>${target.zh}</h3></div><button id='reveal'>顯示答案</button></div>`;say.onclick=()=>speak(target.phrase);reveal.onclick=()=>ans.classList.remove('hidden')}q.oninput=filter;cat.onchange=filter;status.onchange=filter;shuffle.onclick=()=>{shown.sort(()=>Math.random()-.5);render(shown)};quiz.onclick=()=>{modal.classList.add('show');quizMode()};flash.onclick=()=>{modal.classList.add('show');flashMode()};close.onclick=()=>modal.classList.remove('show');next.onclick=()=>mode==='quiz'?quizMode():flashMode();stop.onclick=()=>speechSynthesis.cancel();stats();render(phrases);</script>
