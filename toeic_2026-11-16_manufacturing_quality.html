<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173750"><title>[11/16]主題製造生產與品質管理｜多益高頻英文20單字</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",system-ui,sans-serif;color:#173248;background:#f1f6f9}*{box-sizing:border-box}body{margin:0;padding-bottom:calc(28px + env(safe-area-inset-bottom))}header{background:linear-gradient(120deg,#173750,#176e82);color:white;padding:24px 17px}main,.inner{max-width:1060px;margin:auto}main{padding:17px}h1{font-size:clamp(21px,5vw,30px);line-height:1.35;margin:17px 0 8px}header p{font-size:14px;opacity:.95;line-height:1.65;margin:6px 0 0}.back{display:inline-block;color:white;font-weight:700;text-decoration:none;border:1px solid #97c5d1;border-radius:10px;padding:10px 13px;min-height:44px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:180px;padding:13px;font:inherit;font-size:16px;border-radius:12px;border:1px solid #bad3dc;background:white}.stop{background:#e7eff3;color:#244d63;border:1px solid #b6ced9;padding:12px 15px;border-radius:10px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;margin-top:13px}.card{background:white;border:1px solid #dae7ed;border-radius:17px;box-shadow:0 5px 18px #133a5109;padding:18px}.head{display:flex;align-items:center;gap:14px}.icon{font-size:31px;width:54px;height:54px;background:#eff8fa;display:grid;place-items:center;border-radius:15px;flex:0 0 auto}.word{font-size:22px;font-weight:800;color:#12677b;overflow-wrap:anywhere}.ipa{font-size:14px;color:#547787;margin-top:3px}.meaning{font-size:17px;font-weight:750;margin:13px 0}.example{background:#f3f8fb;border-radius:10px;padding:12px 13px;font-size:15px;line-height:1.6}.translation{color:#547081;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}button{min-height:45px;cursor:pointer;font:inherit;font-weight:700;font-size:14px;border:0;border-radius:10px;background:#19768d;color:white;padding:10px 7px}button.slow{background:#e9f4f7;color:#17637a;border:1px solid #bcdae4}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #edab3f;outline-offset:2px}.status{font-size:13px;color:#526f7b;margin:12px 2px}.foot{color:#627f8d;font-size:13px;line-height:1.65;padding:12px 3px}footer a{color:#15687c}button:active{transform:translateY(1px)}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><header><div class="inner"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>🏭 [11/16]主題製造生產與品質管理｜多益高頻英文20單字</h1><p>美式 IPA｜20 個製造與品管職場單字｜中英情境例句｜單字及例句正常／慢速發音</p></div></header><main><div class="toolbar"><input id="search" type="search" placeholder="搜尋英文、中文或例句" aria-label="搜尋英文、中文或例句" autocomplete="off"><button class="stop" type="button" id="stop">⏹ 停止播放</button></div><p id="count" class="status" aria-live="polite"></p><section id="cards" class="grid" aria-label="多益單字學習卡"></section><footer class="foot">此教材為多益常見製造業情境的原創練習，並非 ETS 官方單字頻率排名。使用裝置內建美式英文語音朗讀，實際口音與速度會依瀏覽器及系統語音而異。<a href="./index.html">返回教材首頁</a></footer></main><script>"use strict";const DATA=[{"en":"manufacturing","ipa":"/ˌmæn.jəˈfæk.tʃɚ.ɪŋ/","zh":"製造業；製造","icon":"🏭","example":"The company is expanding its manufacturing operations in Asia.","translation":"這家公司正在擴大亞洲的製造業務。"},{"en":"assembly line","ipa":"/əˈsem.bli ˌlaɪn/","zh":"生產組裝線","icon":"🔩","example":"The new assembly line can produce five hundred units a day.","translation":"新的組裝線每天可生產五百件產品。"},{"en":"machinery","ipa":"/məˈʃiː.nɚ.i/","zh":"機械設備","icon":"⚙️","example":"The factory invested in modern machinery to reduce costs.","translation":"工廠投資現代化機械設備以降低成本。"},{"en":"component","ipa":"/kəmˈpoʊ.nənt/","zh":"零組件；構成部分","icon":"🧩","example":"The supplier will deliver the missing components by Friday.","translation":"供應商將在星期五前交付缺少的零組件。"},{"en":"raw material","ipa":"/ˌrɑː məˈtɪr.i.əl/","zh":"原料","icon":"🪵","example":"A shortage of raw materials delayed production.","translation":"原料短缺導致生產延誤。"},{"en":"prototype","ipa":"/ˈproʊ.t̬ə.taɪp/","zh":"原型；試作品","icon":"🛠️","example":"The engineering team will test the prototype next week.","translation":"工程團隊將於下週測試試作品。"},{"en":"batch","ipa":"/bætʃ/","zh":"一批（產品）","icon":"📦","example":"This batch of products must pass the final inspection.","translation":"這批產品必須通過最終檢驗。"},{"en":"defect","ipa":"/ˈdiː.fekt/","zh":"瑕疵；缺陷","icon":"🔎","example":"The inspector found a defect in the packaging.","translation":"檢驗員發現包裝有一處瑕疵。"},{"en":"quality assurance","ipa":"/ˈkwɑː.lə.t̬i əˈʃʊr.əns/","zh":"品質保證","icon":"✅","example":"Our quality assurance team reviews every production report.","translation":"我們的品質保證團隊會審查每一份生產報告。"},{"en":"productivity","ipa":"/ˌproʊ.dʌkˈtɪv.ə.t̬i/","zh":"生產力；工作效率","icon":"📈","example":"The new equipment has increased employee productivity.","translation":"新設備已提升員工的生產力。"},{"en":"output","ipa":"/ˈaʊt.pʊt/","zh":"產量；產出","icon":"📊","example":"Daily output rose after the production process was improved.","translation":"改善生產流程後，每日產量增加了。"},{"en":"conveyor","ipa":"/kənˈveɪ.ɚ/","zh":"輸送機；輸送帶","icon":"📤","example":"Boxes move along the conveyor to the packing area.","translation":"箱子沿著輸送帶移動到包裝區。"},{"en":"calibrate","ipa":"/ˈkæl.ə.breɪt/","zh":"校準；校正","icon":"📏","example":"Technicians calibrate the measuring devices every month.","translation":"技術人員每個月都會校準測量設備。"},{"en":"downtime","ipa":"/ˈdaʊn.taɪm/","zh":"停機時間","icon":"⏸️","example":"Scheduled maintenance will cause two hours of downtime.","translation":"定期保養將造成兩小時的停機時間。"},{"en":"shift","ipa":"/ʃɪft/","zh":"輪班；班次","icon":"🕒","example":"The evening shift begins at four o'clock.","translation":"晚班從四點開始。"},{"en":"overtime","ipa":"/ˈoʊ.vɚ.taɪm/","zh":"加班；加班時間","icon":"⌛","example":"Employees may need to work overtime to meet the deadline.","translation":"員工可能需要加班才能趕上期限。"},{"en":"quota","ipa":"/ˈkwoʊ.t̬ə/","zh":"配額；定額目標","icon":"🎯","example":"The production team met its monthly quota ahead of schedule.","translation":"生產團隊提前達成每月產量目標。"},{"en":"yield","ipa":"/jiːld/","zh":"良率；產出量","icon":"🌱","example":"The improved process resulted in a higher production yield.","translation":"改善後的流程提高了生產良率。"},{"en":"automation","ipa":"/ˌɑː.t̬əˈmeɪ.ʃən/","zh":"自動化","icon":"🤖","example":"Automation helps the factory maintain consistent product quality.","translation":"自動化有助於工廠維持一致的產品品質。"},{"en":"tolerance","ipa":"/ˈtɑː.lɚ.əns/","zh":"公差；允許誤差","icon":"📐","example":"The parts must remain within the specified tolerance.","translation":"零件尺寸必須維持在指定公差範圍內。"}];const $=id=>document.getElementById(id);const synth=window.speechSynthesis;let voices=[];function refreshVoices(){if(synth)voices=synth.getVoices()}refreshVoices();if(synth&&synth.addEventListener)synth.addEventListener("voiceschanged",refreshVoices);function speak(txt,slow){if(!synth){$("count").textContent="此瀏覽器不支援語音播放。";return}try{synth.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=slow?0.7:1;u.pitch=1;u.voice=voices.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||voices.find(v=>v.lang.toLowerCase().startsWith("en"))||null;u.onerror=()=>{$("count").textContent="無法播放語音，請確認手機未靜音並嘗試 Safari。"};synth.speak(u)}catch(e){$("count").textContent="語音播放未成功："+String(e.message||e)}}function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n}function audio(label,txt,slow){const b=el("button",slow?"slow":"",label);b.type="button";b.setAttribute("aria-label",label+" "+txt);b.addEventListener("click",()=>speak(txt,slow));return b}function render(){const q=$("search").value.trim().toLocaleLowerCase();const list=DATA.filter(x=>[x.en,x.ipa,x.zh,x.example,x.translation].some(s=>s.toLocaleLowerCase().includes(q)));const root=$("cards"),fragment=document.createDocumentFragment();for(const x of list){const card=el("article","card"),head=el("div","head"),wordBox=el("div",""),example=el("div","example"),buttons=el("div","buttons");wordBox.append(el("div","word",x.en),el("div","ipa",x.ipa));head.append(el("div","icon",x.icon),wordBox);example.append(el("div","",x.example),el("div","translation",x.translation));buttons.append(audio("🔊 單字",x.en,false),audio("🐢 單字慢速",x.en,true),audio("🔊 例句",x.example,false),audio("🐢 例句慢速",x.example,true));card.append(head,el("div","meaning",x.zh),example,buttons);fragment.append(card)}root.replaceChildren(fragment);$("count").textContent="顯示 "+list.length+" / "+DATA.length+" 個單字"}$("search").addEventListener("input",render);$("stop").addEventListener("click",()=>{if(synth)synth.cancel()});window.addEventListener("pagehide",()=>{if(synth)synth.cancel()});render();</script></body></html>
