<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174b66">
<meta name="description" content="2026年11月4日 TOEIC 國際物流與倉儲20單字，附美式IPA、中英例句、iPhone英文正常及慢速發音、搜尋。">
<title>[11/04]主題國際物流與倉儲｜多益高頻英文20單字</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#1b3546;background:#f2f7fa}
*{box-sizing:border-box}
body{margin:0;padding-bottom:calc(75px + env(safe-area-inset-bottom));line-height:1.5}
header{background:linear-gradient(115deg,#153e58,#226d84);color:#fff;padding:24px 17px 27px}
.wrap{max-width:1070px;margin:0 auto;padding:0 16px}
header h1{font-size:clamp(22px,4.9vw,30px);line-height:1.4;margin:12px 0}
header p{margin:0;line-height:1.8;color:#e1f1f6;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:white;border:1px solid #c2e6f377;border-radius:11px;padding:8px 12px;font-size:14px;font-weight:700;min-height:42px}
main{padding-top:18px}
.toolbar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #d1e2e9;border-radius:16px;padding:12px;flex-wrap:wrap}
.search{flex:1;min-width:185px;border:1px solid #adc8d4;border-radius:10px;font-size:16px;min-height:48px;padding:10px 13px;outline-offset:3px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.stop{border:1px solid #bfd4dc;border-radius:10px;background:#eaf3f7;color:#20546b;min-height:46px;padding:10px 12px;font-weight:700}
.status{font-size:13px;color:#476e7d;margin:12px 2px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}
.card{background:#fff;border:1px solid #dbe7ec;border-radius:17px;padding:17px;box-shadow:0 4px 17px #102e4f09}
.head{display:flex;align-items:center;gap:13px}
.emoji{font-size:30px;display:grid;place-items:center;width:59px;height:59px;background:#edf7f7;border-radius:14px;flex:none}
.word{font-size:22px;font-weight:800;color:#145c76;overflow-wrap:anywhere}
.ipa{font-size:14px;color:#557583;margin-top:1px}
.meaning{font-size:16px;font-weight:750;margin:13px 0 10px}
.example{background:#f5f9fa;border:1px solid #e3edf0;border-radius:12px;padding:12px}
.en{font-size:15px;line-height:1.7}
.tr{font-size:13px;color:#516f7c;line-height:1.7;margin-top:7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.audio{border:none;border-radius:11px;background:#176b87;color:white;font-weight:750;font-size:14px;min-height:46px;padding:8px}
.audio.slow{background:#e8f3f7;color:#1c647b;border:1px solid #bad6df}
.audio:focus-visible,.back:focus-visible{outline:3px solid #e6bb38;outline-offset:2px}
.empty{text-align:center;padding:50px 10px;color:#597484}
footer{padding:22px 0;color:#6a8290;font-size:12px;text-align:center}
@media (max-width:350px){.card{padding:14px}.audio{font-size:13px}.word{font-size:20px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/04]主題國際物流與倉儲｜多益高頻英文20單字</h1><p>📦 物流情境 × 20 單字｜🔊 美式英語朗讀｜🐢 慢速跟讀｜📱 iPhone 友善</p></div></header>
<main class="wrap">
<section class="toolbar" aria-label="教材搜尋"><input id="search" class="search" type="search" placeholder="搜尋英文、中文或例句…" aria-label="搜尋英文單字、中文或例句" autocomplete="off"><button id="stop" class="stop" type="button">⏹ 停止發音</button></section>
<div id="status" class="status" role="status" aria-live="polite">共 20 個單字。請點選發音按鈕練習。</div>
<section id="cards" class="grid" aria-label="每日多益英文20單字"></section>
<p id="empty" class="empty" hidden>找不到相符的單字，請更換搜尋內容。</p>
<footer>發音由裝置內建 Web Speech 語音提供，實際音色依手機及瀏覽器可用的 en-US 語音而定。</footer>
</main>
<script>
"use strict";
const DATA=[{"en":"logistics","ipa":"/ləˈdʒɪstɪks/","zh":"物流；物流管理","icon":"🚚","ex":"Efficient logistics helped the retailer deliver orders before the holiday.","tr":"有效率的物流管理讓零售商能在假日前送達訂單。"},{"en":"warehouse","ipa":"/ˈwerhaʊs/","zh":"倉庫","icon":"🏭","ex":"The warehouse will remain open until eight p.m. during the busy season.","tr":"旺季期間，倉庫將營業至晚上八點。"},{"en":"freight","ipa":"/freɪt/","zh":"貨運；貨物運輸","icon":"🚛","ex":"Freight charges depend on the weight and destination of each package.","tr":"貨運費用取決於每件包裹的重量及目的地。"},{"en":"cargo","ipa":"/ˈkɑːrɡoʊ/","zh":"（船、機、車運送的）貨物","icon":"🚢","ex":"The cargo arrived at the port two days ahead of schedule.","tr":"這批貨物比預定時間早兩天抵達港口。"},{"en":"carrier","ipa":"/ˈkæriər/","zh":"運輸業者；承運人","icon":"🚐","ex":"The carrier will inform customers about delays caused by severe weather.","tr":"運輸業者將通知客戶惡劣天氣造成的延誤。"},{"en":"dispatch","ipa":"/dɪˈspætʃ/","zh":"派送；發送","icon":"📤","ex":"Please dispatch the replacement parts as soon as payment is received.","tr":"收到款項後，請儘速寄送替換零件。"},{"en":"delivery","ipa":"/dɪˈlɪvəri/","zh":"配送；交貨","icon":"📦","ex":"We expect delivery of the office furniture on Thursday morning.","tr":"我們預計週四上午收到辦公家具。"},{"en":"tracking","ipa":"/ˈtrækɪŋ/","zh":"追蹤；物流追蹤","icon":"📍","ex":"Use the tracking number to check the package's current location.","tr":"請使用追蹤號碼查詢包裹目前的位置。"},{"en":"customs","ipa":"/ˈkʌstəmz/","zh":"海關","icon":"🛃","ex":"All imported products must be declared to customs upon arrival.","tr":"所有進口商品在抵達時都必須向海關申報。"},{"en":"clearance","ipa":"/ˈklɪrəns/","zh":"通關；清關","icon":"✅","ex":"Customs clearance may take longer if the documents are incomplete.","tr":"如果文件不齊全，海關清關可能需要更長時間。"},{"en":"container","ipa":"/kənˈteɪnər/","zh":"貨櫃；容器","icon":"🧊","ex":"The company booked a refrigerated container for the fresh seafood.","tr":"公司為新鮮海鮮預訂了一個冷藏貨櫃。"},{"en":"pallet","ipa":"/ˈpælɪt/","zh":"棧板","icon":"🪵","ex":"Place the cartons securely on a pallet before moving them.","tr":"搬運之前，請將紙箱穩固地放在棧板上。"},{"en":"transit","ipa":"/ˈtrænzɪt/","zh":"運輸途中；運送過程","icon":"🛣️","ex":"The equipment was damaged while in transit to the construction site.","tr":"設備在運往工地的途中受損。"},{"en":"distribution","ipa":"/ˌdɪstrɪˈbjuːʃən/","zh":"配送；分銷","icon":"🏬","ex":"The regional distribution center serves more than fifty retail stores.","tr":"這座區域配送中心服務超過五十家零售門市。"},{"en":"fragile","ipa":"/ˈfrædʒəl/","zh":"易碎的","icon":"🍷","ex":"Please label the glass products as fragile before shipping them.","tr":"出貨前請在玻璃製品上標示易碎。"},{"en":"perishable","ipa":"/ˈperɪʃəbl/","zh":"易腐壞的","icon":"🥬","ex":"Perishable goods must be kept at the recommended temperature.","tr":"易腐壞商品必須保存在建議的溫度下。"},{"en":"dock","ipa":"/dɑːk/","zh":"裝卸月台；碼頭","icon":"⚓","ex":"Truck drivers must check in at the loading dock before unloading.","tr":"卡車司機卸貨前必須先到裝卸月台報到。"},{"en":"storage","ipa":"/ˈstɔːrɪdʒ/","zh":"儲存；倉儲","icon":"🗄️","ex":"Additional storage fees apply after the first seven days.","tr":"前七天過後將收取額外倉儲費用。"},{"en":"weigh","ipa":"/weɪ/","zh":"秤重","icon":"⚖️","ex":"Please weigh each package before printing its shipping label.","tr":"列印出貨標籤之前，請先替每件包裹秤重。"},{"en":"unload","ipa":"/ʌnˈloʊd/","zh":"卸貨；卸下","icon":"📥","ex":"The staff will unload the truck after the safety inspection.","tr":"工作人員將在安全檢查後卸下卡車上的貨物。"}];
const el=id=>document.getElementById(id);
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){if(synth)voices=synth.getVoices();}
if(synth){loadVoices();if(typeof synth.addEventListener==="function")synth.addEventListener("voiceschanged",loadVoices);}
function speak(text,slow){
 if(!synth||typeof SpeechSynthesisUtterance==="undefined"){el("status").textContent="此裝置或瀏覽器不支援語音朗讀；建議使用 iPhone Safari。";return;}
 synth.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=slow?0.65:0.98;u.pitch=1;
 const voice=voices.find(v=>v.lang.toLowerCase().replace(/_/g,"-")==="en-us");if(voice)u.voice=voice;
 u.onstart=()=>{el("status").textContent="正在播放"+(slow?"慢速":"正常")+"英語發音…";};
 u.onend=()=>{el("status").textContent="播放完成，可再次點選發音。";};
 u.onerror=()=>{el("status").textContent="語音播放失敗，請檢查音量、靜音模式，或改用 Safari 再試。";};
 synth.speak(u);
}
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function audioBtn(label,text,slow){const b=node("button","audio"+(slow?" slow":""),label);b.type="button";b.setAttribute("aria-label",label+"："+text);b.addEventListener("click",()=>speak(text,slow));return b;}
function render(){
 const q=el("search").value.trim().toLocaleLowerCase();
 const items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(s=>s.toLocaleLowerCase().includes(q)));
 const frag=document.createDocumentFragment();
 for(const x of items){
   const c=node("article","card"),h=node("div","head"),em=node("div","emoji",x.icon),info=node("div");
   info.append(node("div","word",x.en),node("div","ipa",x.ipa));h.append(em,info);
   const ex=node("div","example");ex.append(node("div","en",x.ex),node("div","tr",x.tr));
   const act=node("div","actions");
   act.append(audioBtn("🔊 單字",x.en,false),audioBtn("🐢 單字慢速",x.en,true),audioBtn("🔊 例句",x.ex,false),audioBtn("🐢 例句慢速",x.ex,true));
   c.append(h,node("div","meaning",x.zh),ex,act);frag.append(c);
 }
 el("cards").replaceChildren(frag);el("empty").hidden=items.length!==0;
 el("status").textContent="顯示 "+items.length+" / "+DATA.length+" 個單字，點選按鈕即可朗讀。";
}
el("search").addEventListener("input",render);
el("stop").addEventListener("click",()=>{if(synth)synth.cancel();el("status").textContent="已停止發音。";});
render();
</script>
</body>
</html>
