*{box-sizing:border-box}body{margin:0;background:#f0f6fa;color:#183748;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#163f5b,#187b8c);color:white;padding:24px 16px}.wrap{max-width:1040px;margin:auto}h1{font-size:clamp(22px,5vw,30px);line-height:1.35}a.back{display:inline-block;color:white;border:1px solid #ffffff88;border-radius:10px;padding:10px;text-decoration:none}main{padding:18px 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:white;padding:12px;border-radius:14px;margin-bottom:12px}input{flex:1;min-width:190px;font-size:16px;padding:12px;border:1px solid #a5c1ce;border-radius:10px}button{font:inherit;cursor:pointer;touch-action:manipulation}.stop{background:#e8f2f6;border:1px solid #bdd4df;border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}.card{background:white;border:1px solid #d6e5eb;border-radius:16px;padding:16px;box-shadow:0 3px 15px #1837480a}.head{display:flex;align-items:center;gap:12px}.icon{font-size:30px;background:#eaf7f7;border-radius:12px;width:56px;height:56px;display:grid;place-items:center;flex:none}.word{font-size:21px;color:#146580;font-weight:800;overflow-wrap:anywhere}.ipa{font-size:14px;color:#547684}.meaning{font-weight:750;margin:12px 0}.example{background:#f4f8fa;padding:12px;border-radius:10px}.tr{font-size:14px;color:#4b6876;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audio{background:#176d89;color:white;border:0;border-radius:10px;min-height:46px;padding:8px 4px;font-weight:700;font-size:14px}.slow{background:#e8f3f7;color:#175f78;border:1px solid #b7d2dc}.status{font-size:14px;color:#426779;margin:10px 2px 15px}footer{text-align:center;color:#597786;font-size:12px;padding:25px 8px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange;outline-offset:2px}
</style></head><body><header><div class="wrap"><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/05]主題飯店訂房與旅宿服務｜多益高頻英文20單字</h1><p>🏨 飯店服務 × 20 單字｜🔊 美式發音｜🐢 慢速跟讀｜📱 iPhone 適用</p></div></header><main class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="搜尋單字、中文或例句…" aria-label="搜尋單字"><button class="stop" id="stop">⏹ 停止發音</button></div><p class="status" id="status" role="status">共 20 個單字</p><section class="grid" id="cards"></section><p id="empty" hidden>找不到符合的單字。</p><footer>發音使用瀏覽器 Web Speech API，實際聲音依裝置提供的美式英語語音而定。</footer></main><script>
"use strict";const DATA=[{"en":"reservation","ipa":"/ˌrezərˈveɪʃən/","zh":"預訂","icon":"📅","ex":"Please make a reservation at least two weeks before your arrival.","tr":"請至少在抵達前兩週完成預訂。"},{"en":"accommodation","ipa":"/əˌkɑːməˈdeɪʃən/","zh":"住宿；住宿設施","icon":"🏨","ex":"The conference fee does not include accommodation.","tr":"會議費用不包含住宿。"},{"en":"availability","ipa":"/əˌveɪləˈbɪləti/","zh":"可預訂情況；供應狀況","icon":"🗓️","ex":"Contact the hotel to check room availability for Friday night.","tr":"請聯絡飯店確認週五晚上的空房情況。"},{"en":"occupancy","ipa":"/ˈɑːkjəpənsi/","zh":"住房率；使用率","icon":"🛏️","ex":"Hotel occupancy usually increases during the summer holidays.","tr":"飯店住房率通常在暑假期間上升。"},{"en":"amenity","ipa":"/əˈmenəti/","zh":"便利設施","icon":"🏊","ex":"The hotel's amenities include a gym and an indoor pool.","tr":"這間飯店的設施包括健身房和室內游泳池。"},{"en":"concierge","ipa":"/kɑːnsiˈerʒ/","zh":"禮賓服務人員","icon":"🛎️","ex":"The concierge can recommend restaurants near the hotel.","tr":"禮賓人員可以推薦飯店附近的餐廳。"},{"en":"housekeeping","ipa":"/ˈhaʊskiːpɪŋ/","zh":"客房清潔服務","icon":"🧹","ex":"Housekeeping will clean your room while you attend the meeting.","tr":"您參加會議期間，客房清潔人員會打掃房間。"},{"en":"complimentary","ipa":"/ˌkɑːmpləˈmentəri/","zh":"免費提供的","icon":"☕","ex":"A complimentary breakfast is served in the dining area.","tr":"用餐區提供免費早餐。"},{"en":"suite","ipa":"/swiːt/","zh":"套房","icon":"🛋️","ex":"The executive suite has a separate meeting area.","tr":"行政套房設有獨立的會議區。"},{"en":"lobby","ipa":"/ˈlɑːbi/","zh":"大廳","icon":"🏢","ex":"Please meet the tour guide in the hotel lobby at nine.","tr":"請在九點到飯店大廳與導遊會合。"},{"en":"deposit","ipa":"/dɪˈpɑːzɪt/","zh":"訂金；押金","icon":"💳","ex":"A deposit is required to secure the group booking.","tr":"團體訂房需要支付訂金才能保留房間。"},{"en":"cancellation","ipa":"/ˌkænsəˈleɪʃən/","zh":"取消","icon":"❌","ex":"The cancellation policy allows changes up to 48 hours before arrival.","tr":"取消政策允許旅客在抵達前四十八小時更改訂單。"},{"en":"upgrade","ipa":"/ˈʌpɡreɪd/","zh":"升等；升級","icon":"⬆️","ex":"Guests may request a room upgrade at the front desk.","tr":"房客可以在櫃檯申請房型升等。"},{"en":"surcharge","ipa":"/ˈsɜːrtʃɑːrdʒ/","zh":"附加費","icon":"💰","ex":"A surcharge applies to late-night room service.","tr":"深夜客房服務需支付附加費。"},{"en":"reception","ipa":"/rɪˈsepʃən/","zh":"接待櫃檯；接待處","icon":"👩‍💼","ex":"Please leave your luggage at reception before the event.","tr":"活動開始前請將行李寄放在接待櫃檯。"},{"en":"shuttle","ipa":"/ˈʃʌtəl/","zh":"接駁車","icon":"🚐","ex":"The airport shuttle departs from the hotel every hour.","tr":"機場接駁車每小時從飯店發車。"},{"en":"voucher","ipa":"/ˈvaʊtʃər/","zh":"兌換券；憑證","icon":"🎟️","ex":"Present your meal voucher to the restaurant staff.","tr":"請向餐廳人員出示餐券。"},{"en":"occupant","ipa":"/ˈɑːkjəpənt/","zh":"房間使用者；入住者","icon":"👤","ex":"Each room occupant must provide identification at check-in.","tr":"每位入住者辦理入住時都必須提供身分證明。"},{"en":"adjoining","ipa":"/əˈdʒɔɪnɪŋ/","zh":"相鄰的","icon":"🚪","ex":"The family requested two adjoining rooms for their stay.","tr":"這家人要求住宿期間安排兩間相鄰的客房。"},{"en":"hospitality","ipa":"/ˌhɑːspɪˈtæləti/","zh":"旅宿服務；殷勤款待","icon":"🤝","ex":"The company offers training for employees in the hospitality industry.","tr":"公司為旅宿服務業的員工提供訓練。"}];const $=id=>document.getElementById(id);const synth=("speechSynthesis" in window)?speechSynthesis:null;let voices=[];function loadVoices(){if(synth)voices=synth.getVoices()}if(synth){loadVoices();synth.addEventListener?.("voiceschanged",loadVoices)}function speak(t,slow){if(!synth){$("status").textContent="瀏覽器不支援語音功能，請使用 Safari。";return}synth.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;let v=voices.find(x=>x.lang.toLowerCase().replace("_","-")==="en-us");if(v)u.voice=v;u.onstart=()=>$("status").textContent="正在播放"+(slow?"慢速":"正常")+"發音…";u.onend=()=>$("status").textContent="播放完成";u.onerror=()=>$("status").textContent="播放失敗，請確認裝置音量及瀏覽器語音支援";synth.speak(u)}function n(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function btn(label,t,slow){let b=n("button","audio"+(slow?" slow":""),label);b.type="button";b.addEventListener("click",()=>speak(t,slow));return b}function render(){let q=$("search").value.trim().toLocaleLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(s=>s.toLocaleLowerCase().includes(q))),f=document.createDocumentFragment();for(let x of items){let c=n("article","card"),h=n("div","head"),info=n("div");info.append(n("div","word",x.en),n("div","ipa",x.ipa));h.append(n("div","icon",x.icon),info);let ex=n("div","example");ex.append(n("div","en",x.ex),n("div","tr",x.tr));let a=n("div","actions");a.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(h,n("div","meaning",x.zh),ex,a);f.append(c)}$("cards").replaceChildren(f);$("empty").hidden=items.length>0;$("status").textContent="顯示 "+items.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").addEventListener("click",()=>{synth?.cancel();$("status").textContent="已停止發音"});render();
</script></body></html>
