name: Remove one Firestore test lesson

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-autopublish-test.yml'

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    if: github.repository == 'english-learning-tw/english-learning-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud without keys
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/781857177241/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: english-learning-publisher@english-learning-app-461d8.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/datastore
          access_token_lifetime: 600s
      - name: Delete only the known smoke-test document
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          # Only this exact test document may be removed.
          url = ("https://firestore.googleapis.com/v1/projects/"
                 "english-learning-app-461d8/databases/(default)/documents/"
                 "publishedLessons/github-autopublish_test_20261018")
          token = os.environ["GOOGLE_ACCESS_TOKEN"]
          if not token: raise SystemExit("Missing Google access token")
          req = Request(url, headers={"Authorization": "Bearer " + token}, method="DELETE")
          try:
              with urlopen(req, timeout=30) as r:
                  print("Deleted test Firestore document (HTTP", r.status, ")")
          except HTTPError as e:
              if e.code == 404:
                  print("Test document already absent (404).")
              else:
                  raise
          PY
