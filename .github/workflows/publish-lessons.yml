name: Publish HTML lessons to Firestore

on:
  push:
    branches: [main]
    paths:
      - 'lesson-publications/*.json'
      - 'lesson-publications/**/*.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-lessons
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'english-learning-tw/english-learning-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (OIDC, no private key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/781857177241/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: english-learning-publisher@english-learning-app-461d8.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3'
      - name: Publish declared lessons
        run: python scripts/publish_lessons.py
