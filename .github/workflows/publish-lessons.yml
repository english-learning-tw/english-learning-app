name: Publish HTML lessons to Firestore

on:
  push:
    branches: [main]
    paths:
      - 'lesson-publications/*.json'
      - 'lesson-publications/**/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-lessons
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT_JSON in repository Actions secrets."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3'
      - name: Publish declared lessons
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/publish_lessons.py
