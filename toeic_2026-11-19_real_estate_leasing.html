<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>[11/19]主題商用不動產與租賃管理｜多益高頻英文20單字</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7fa;color:#173448;font-family:-apple-system,"PingFang TC",sans-serif}header{background:#176b83;color:white;padding:20px}main{max-width:960px;margin:auto;padding:15px}h1{font-size:clamp(21px,5vw,30px)}a{color:inherit}input{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #aac5d3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}.card{background:white;border-radius:15px;padding:17px;border:1px solid #d7e6ed}.word{font-size:23px;font-weight:800;color:#12677b}.ipa{color:#597482}.zh{font-weight:bold;margin:10px 0}.example{background:#eff6fa;padding:12px;border-radius:10px}.tr{color:#56717e;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:46px;border:0;border-radius:9px;background:#146c86;color:white;font-weight:bold}button.slow{background:#e4f1f5;color:#145c76}.back{display:inline-block;padding:10px;border:1px solid white;border-radius:8px}#status{margin:12px 0;color:#56717e}</style></head><body><header><a class="back" href="./index.html">← 返回 English Learning App 首頁</a><h1>[11/19]主題商用不動產與租賃管理｜多益高頻英文20單字</h1><p>🇺🇸 美式 IPA　🔊 正常發音　🐢 慢速跟讀</p></header><main><input id="search" type="search" placeholder="搜尋英文、中文、例句"><p id="status"></p><button id="stop">⏹ 停止發音</button><section id="cards" class="grid"></section><p>語音由裝置 Web Speech API 提供，實際發音依系統語音而異。本教材非 ETS 官方字頻排名。</p></main><script>"use strict";const DATA=[{"en":"lease","ipa":"/liːs/","zh":"租約","icon":"📌","ex":"The tenant signed a three-year lease.","tr":"承租人簽署了三年租約。"},{"en":"tenant","ipa":"/ˈten.ənt/","zh":"承租人","icon":"💼","ex":"The tenant requested a parking space.","tr":"承租人要求一個停車位。"},{"en":"landlord","ipa":"/ˈlænd.lɔːrd/","zh":"房東","icon":"📋","ex":"The landlord approved the renovation.","tr":"房東同意了整修工程。"},{"en":"premises","ipa":"/ˈprem.ɪ.sɪz/","zh":"營業場所","icon":"🏢","ex":"The company inspected the new premises.","tr":"公司檢查了新的營業場所。"},{"en":"square footage","ipa":"/ˈskwer ˌfʊt̬.ɪdʒ/","zh":"平方英尺面積","icon":"🧾","ex":"The listing states the total square footage.","tr":"物件資訊列出了總平方英尺面積。"},{"en":"renovation","ipa":"/ˌren.əˈveɪ.ʃən/","zh":"整修","icon":"🔎","ex":"The office renovation begins next month.","tr":"辦公室整修將於下個月開始。"},{"en":"occupancy rate","ipa":"/ˈɑː.kjə.pən.si reɪt/","zh":"出租率","icon":"📈","ex":"The building's occupancy rate increased.","tr":"這棟大樓的出租率上升了。"},{"en":"property manager","ipa":"/ˈprɑː.pɚ.t̬i ˈmæn.ɪ.dʒɚ/","zh":"物業管理員","icon":"🤝","ex":"The property manager arranged an inspection.","tr":"物業管理員安排了檢查。"},{"en":"utilities","ipa":"/juːˈtɪl.ə.t̬iz/","zh":"水電瓦斯等公用事業費","icon":"💳","ex":"Utilities are not included in the rent.","tr":"租金不包含水電等公用事業費。"},{"en":"maintenance fee","ipa":"/ˈmeɪn.tən.əns fiː/","zh":"維護費","icon":"📝","ex":"The monthly maintenance fee is listed separately.","tr":"每月維護費另行列示。"},{"en":"security deposit","ipa":"/sɪˈkjʊr.ə.t̬i dɪˈpɑː.zɪt/","zh":"押金","icon":"📌","ex":"The security deposit is refundable.","tr":"押金可以退還。"},{"en":"renewal","ipa":"/rɪˈnuː.əl/","zh":"續約","icon":"💼","ex":"Lease renewal requires written approval.","tr":"租約續約需要書面核准。"},{"en":"sublease","ipa":"/ˌsʌbˈliːs/","zh":"轉租","icon":"📋","ex":"The agreement prohibits sublease without consent.","tr":"合約禁止未經同意的轉租。"},{"en":"vacancy rate","ipa":"/ˈveɪ.kən.si reɪt/","zh":"空置率","icon":"🏢","ex":"The vacancy rate fell this quarter.","tr":"本季空置率下降了。"},{"en":"zoning","ipa":"/ˈzoʊ.nɪŋ/","zh":"土地使用分區","icon":"🧾","ex":"Check the zoning rules before opening a store.","tr":"開店前請確認土地使用分區規定。"},{"en":"floor plan","ipa":"/ˈflɔːr plæn/","zh":"平面配置圖","icon":"🔎","ex":"The architect sent the revised floor plan.","tr":"建築師寄來修訂後的平面配置圖。"},{"en":"inspection report","ipa":"/ɪnˈspek.ʃən rɪˈpɔːrt/","zh":"檢查報告","icon":"📈","ex":"The inspection report identified two repairs.","tr":"檢查報告指出兩項需要修繕的地方。"},{"en":"accessibility","ipa":"/əkˌses.əˈbɪl.ə.t̬i/","zh":"無障礙可及性","icon":"🤝","ex":"Accessibility is essential for public offices.","tr":"無障礙可及性對公共辦公場所十分重要。"},{"en":"commercial property","ipa":"/kəˈmɝː.ʃəl ˈprɑː.pɚ.t̬i/","zh":"商用不動產","icon":"💳","ex":"The agency specializes in commercial property.","tr":"這家仲介公司專營商用不動產。"},{"en":"brokerage","ipa":"/ˈbroʊ.kɚ.ɪdʒ/","zh":"仲介服務","icon":"📝","ex":"The brokerage arranged several site visits.","tr":"仲介公司安排了數次現場看屋。"}];const $=id=>document.getElementById(id),s=window.speechSynthesis;function speak(t,slow){if(!s){$("status").textContent="瀏覽器不支援發音";return}s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=slow?.65:.98;const vs=s.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().replace("_","-")==="en-us")||null;s.speak(u)}function el(tag,cls,t){const n=document.createElement(tag);n.className=cls;if(t!==undefined)n.textContent=t;return n}function btn(label,t,slow){const b=el("button",slow?"slow":"",label);b.onclick=()=>speak(t,slow);return b}function render(){const q=$("search").value.toLowerCase(),items=DATA.filter(x=>[x.en,x.ipa,x.zh,x.ex,x.tr].some(v=>v.toLowerCase().includes(q))),frag=document.createDocumentFragment();for(const x of items){const c=el("article","card"),ex=el("div","example"),bs=el("div","buttons");ex.append(el("div","",x.ex),el("div","tr",x.tr));bs.append(btn("🔊 單字",x.en,false),btn("🐢 單字慢速",x.en,true),btn("🔊 例句",x.ex,false),btn("🐢 例句慢速",x.ex,true));c.append(el("div","word",x.icon+" "+x.en),el("div","ipa",x.ipa),el("div","zh",x.zh),ex,bs);frag.append(c)}$("cards").replaceChildren(frag);$("status").textContent="顯示 "+items.length+" / 20 個單字"}$("search").addEventListener("input",render);$("stop").onclick=()=>s?.cancel();render();</script></body></html>
