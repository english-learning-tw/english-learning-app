ById('modal'),modalBody=document.getElementById('modalBody');function stats(){favCount.textContent='收藏 '+fav.length;learnCount.textContent='已學會 '+learn.length}function save(){localStorage.setItem('poly200Fav',JSON.stringify(fav));localStorage.setItem('poly200Learn',JSON.stringify(learn));stats()}function speak(t){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援發音');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function filter(){const s=q.value.toLowerCase().trim();shown=words.filter(x=>(!s||(x.word+' '+x.meanings.map(m=>m.zh).join(' ')).toLowerCase().includes(s))&&(!status.value||(status.value==='fav'?fav.includes(x.word):learn.includes(x.word))));render(shown)}function toggle(a,w){a.includes(w)?a.splice(a.indexOf(w),1):a.push(w);save();filter()}function render(list){grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">找不到符合條件的單字。</div>';return}list.forEach(x=>{const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="top"><span class="num">${x.id}</span><h2 class="word">${x.word}</h2><button class="speak">🔊 發音</button><button class="fav ${fav.includes(x.word)?'active':''}">⭐</button><button class="learn ${learn.includes(x.word)?'active':''}">✔</button></div><div class="meaningGrid">${x.meanings.map((m,i)=>`<div class="meaning"><div class="small">意思 ${i+1}</div><div class="icon">${m.icon}</div><div class="zh">${m.zh}</div></div>`).join('')}</div>`;e.querySelector('.speak').onclick=()=>speak(x.word);e.querySelector('.fav').onclick=()=>toggle(fav,x.word);e.querySelector('.learn').onclick=()=>toggle(learn,x.word);grid.appendChild(e)})}function quizMode(){mode='quiz';target=words[Math.floor(Math.random()*words.length)];const correct=target.meanings.map(m=>m.zh).join('／');const wrong=words.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meanings.map(m=>m.zh).join('／'));const opts=[correct,...wrong].sort(()=>Math.random()-.5);modalBody.innerHTML=`<h2 style="text-align:center">選出兩個正確意思</h2><div class="bigword">${target.word}</div><div class="answers">${opts.map(v=>`<button class="answer">${v}</button>`).join('')}</div>`;modalBody.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{modalBody.querySelectorAll('.answer').forEach(z=>z.disabled=true);b.classList.add(b.textContent===correct?'correct':'wrong')})}function flashMode(){mode='flash';target=words[Math.floor(Math.random()*words.length)];modalBody.innerHTML=`<div class="bigword">${target.word}</div><p style="text-align:center"><button id="say">🔊 發音</button></p><div id="ans" class="hidden"><div class="meaningGrid">${target.meanings.map(m=>`<div class="meaning"><div class="icon">${m.icon}</div><div class="zh">${m.zh}</div></div>`).join('')}</div></div><p style="text-align:center"><button id="reveal">顯示答案</button></p>`;say.onclick=()=>speak(target.word);reveal.onclick=()=>ans.classList.remove('hidden')}q.oninput=filter;status.onchange=filter;shuffle.onclick=()=>{shown.sort(()=>Math.random()-.5);render(shown)};quiz.onclick=()=>{modal.classList.add('show');quizMode()};flash.onclick=()=>{modal.classList.add('show');flashMode()};close.onclick=()=>modal.classList.remove('show');next.onclick=()=>mode==='quiz'?quizMode():flashMode();stop.onclick=()=>speechSynthesis.cancel();stats();render(words);</script></body></html>
